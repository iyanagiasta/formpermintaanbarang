/* ===== Code 128 ===== */
function c128(text){

  seq.forEach(function(v){var p=C128[v];for(var k=0;k<p.length;k++){var w=Number(p[k]);if(k%2===0)bars.push([mod,w]);mod+=w;}});

function ukuranEf(s){return s.bagi===1?Object.assign({},s,{lh:s.lh/2}):s.bagi===2?Object.assign({},s,{lw:s.lw/2}):s;}

function hexRgb(h){h=String(h||"#000000").replace("#","");if(h.length===3)h=h.split("").map(function(c){return c+c;}).join("");var n=parseInt(h,16);if(isNaN(n)||h.length!==6)n=0;return [(n>>16)&255,(n>>8)&255,n&255];}
function rgbHex(a){return "#"+a.map(function(v){v=Math.max(0,Math.min(255,Math.round(v)));return (v<16?"0":"")+v.toString(16);}).join("");}
function lumH(h){var c=hexRgb(h).map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function kontrasH(h){return lumH(h)>0.4?"#000000":"#ffffff";}
function gelapH(h,f){return rgbHex(hexRgb(h).map(function(v){return v*(1-f);}));}
function pdfRgb(h){var c=hexRgb(h);return window.PDFLib.rgb(c[0]/255,c[1]/255,c[2]/255);}
function fitTeks(font,txt,maxW,maxH,maxSz,maxBaris){
  for(var sz=Math.max(4,maxSz);sz>=4;sz-=0.5){var b=bungkus(font,txt,sz,maxW,maxBaris);if(b&&b.length*sz*1.1<=maxH)return {sz:sz,baris:b};}

}
/* Susunan satu label rak (satuan pt, titik nol di kiri atas label). Dipakai bersama oleh PDF dan pratinjau. */
function susunRak(F,s,item){
  var W=s.lw*MM,H=s.lh*MM,pad=Math.max(0,s.pad)*MM,sw=Math.max(0,s.tepi)*MM,col=item.warna||s.warna,R=[],T=[];
  var nama=aman(F.b,String(s.kapital?String(item.nama||"").toUpperCase():String(item.nama||""))),ket=aman(F.r,String(item.ket||"").trim());
  var ketH=ket?H*0.26:0,gaya=s.gaya,cNama,cKet,areaN,areaK;
  if(gaya==="pita"){
    var bh=H*Math.max(10,Math.min(100,s.pita))/100;
    R.push({x:0,y:0,w:W,h:H,fill:"#ffffff",stroke:col,sw:sw});R.push({x:0,y:0,w:W,h:bh,fill:col,stroke:col,sw:0});
    cNama=s.teksOto?kontrasH(col):s.teks;cKet=s.teksOto?"#000000":s.teks;
    areaN={x:pad,y:pad,w:W-2*pad,h:bh-2*pad};areaK=ket&&bh<H?{x:pad,y:bh+pad,w:W-2*pad,h:H-bh-2*pad}:null;
  }else if(gaya==="bingkai"){
    R.push({x:0,y:0,w:W,h:H,fill:"#ffffff",stroke:col,sw:Math.max(sw,0.8*MM)});
    cNama=s.teksOto?(lumH(col)>0.75?"#000000":col):s.teks;cKet=s.teksOto?"#000000":s.teks;
    areaN={x:pad,y:pad,w:W-2*pad,h:H-2*pad-ketH};areaK=ket?{x:pad,y:H-pad-ketH,w:W-2*pad,h:ketH}:null;
  }else{
    R.push({x:0,y:0,w:W,h:H,fill:col,stroke:gelapH(col,0.25),sw:sw});
    cNama=s.teksOto?kontrasH(col):s.teks;cKet=cNama;
    areaN={x:pad,y:pad,w:W-2*pad,h:H-2*pad-ketH};areaK=ket?{x:pad,y:H-pad-ketH,w:W-2*pad,h:ketH}:null;
  }
  function taruh(font,txt,a,maxSz,maxBaris,warna){
    if(!(a.w>2&&a.h>2)||!txt)return;
    var f=fitTeks(font,txt,a.w,a.h,maxSz,maxBaris),bl=f.baris.length*f.sz*1.1,top=a.y+(a.h-bl)/2;
    f.baris.forEach(function(t,i){T.push({t:t,x:a.x+a.w/2,y:top+i*f.sz*1.1+f.sz*0.85,sz:f.sz,col:warna,b:font===F.b});});
  }
  taruh(F.b,nama,areaN,s.maksHuruf>0?s.maksHuruf:Math.min(areaN.h,400),3,cNama);
  if(areaK)taruh(F.r,ket,areaK,Math.min(areaK.h*0.7,22),2,cKet);
  return {W:W,H:H,R:R,T:T};
}
function gambarRak(page,F,s,x,y,item){
  var L=susunRak(F,s,item),X=x*MM,Yt=(s.ph-y)*MM;

  L.T.forEach(function(t){var f=t.b?F.b:F.r;page.drawText(t.t,{x:X+t.x-f.widthOfTextAtSize(t.t,t.sz)/2,y:Yt-t.y,size:t.sz,font:f,color:pdfRgb(t.col)});});
}
async function buatPdfRak(items,s,uji){

    for(var i=0;i<per;i++){var p=posisi(s,i);garisLabel(page,s,p.x,p.y);page.drawText(String(i+1),{x:(p.x+1.5)*MM,y:(s.ph-p.y-4)*MM,size:7,font:F.r,color:PDF.rgb(0.4,0.4,0.4)});}
    page.drawText("Uji cetak label rak: kotak harus pas dengan label. Ukuran "+s.lw+"x"+s.lh+" mm, mulai "+s.ml+" mm dari kiri dan "+s.mt+" mm dari atas.",{x:10*MM,y:8*MM,size:7,font:F.r});
    return await doc.save();
  }

}

  document.getElementById("radd").onclick=function(){var v=document.getElementById("rsel").value;if(!v){toast("Pilih rak dulu.",true);return;}toast(tambahRakLabel(v)?"Rak "+v+" ditambahkan.":"Rak itu sudah ada di daftar.");gRak();};
  document.getElementById("rall").onclick=function(){var n=0;ks.forEach(function(k){if(tambahRakLabel(k))n++;});toast(n+" rak ditambahkan.");gRak();};
  document.getElementById("rderet").onclick=function(){
    var pre=document.getElementById("rpre").value,a=Math.round(Number(document.getElementById("rdari").value)),z=Math.round(Number(document.getElementById("rsmp").value));
    if(!(a>=0)||!(z>=a)){toast("Isi nomor dari dan sampai (sampai tidak boleh lebih kecil).",true);return;}
    if(z-a>299){toast("Maksimal 300 rak sekali buat.",true);return;}
    var lebar=String(z).length<2?2:String(z).length,n=0;for(var i=a;i<=z;i++){var s=String(i);while(s.length<lebar)s="0"+s;if(tambahRakLabel(pre+s))n++;}
    toast(n+" rak ditambahkan.");gRak();};
  document.getElementById("rmanadd").onclick=function(){var i=document.getElementById("rman");if(tambahRakLabel(i.value)){i.value="";toast("Rak ditambahkan.");}else toast("Isi nama rak yang belum ada di daftar.",true);gRak();};
  document.getElementById("rman").onkeydown=function(e){if(e.key==="Enter")document.getElementById("rmanadd").click();};
  document.getElementById("rkos").onclick=function(){if(PILRAK.length&&confirm("Kosongkan daftar rak?")){PILRAK=[];gRak();}};
  document.getElementById("rsama").onclick=function(){["pw","ph","kol","bar","gx","gy","ml","mt"].forEach(function(k){RS[k]=S[k];});RS.pad=Math.max(RS.pad,S.pad);RS.lw=S.lw;RS.lh=S.lh;simpanRS();tampilRak();toast("Ukuran lembar disamakan dengan Label Barang ("+S.lw+" x "+S.lh+" mm).");};
  document.getElementById("rreset").onclick=function(){RS=Object.assign({},RDEF);simpanRS();tampilRak();};
  document.getElementById("rbuat").onclick=function(){cetakRak(false);};document.getElementById("ruji").onclick=function(){cetakRak(true);};
  pasangSaklar();gRak();
}
async function cetakRak(uji){
  if(!window.PDFLib){toast("Pustaka PDF belum termuat. Periksa internet lalu muat ulang.",true);return;}
  var k=["lw","lh","kol","bar","pw","ph"].filter(function(z){return !(RS[z]>0);});if(k.length){toast("Isi dulu ukuran label, jumlah kolom/baris, dan ukuran kertas (angka lebih dari 0).",true);return;}
  ["ml","mt","gx","gy","pad","tepi"].forEach(function(z){if(!(RS[z]>=0))RS[z]=0;});if(RS.pad>Math.min(RS.lw,RS.lh)/2-0.5)RS.pad=Math.max(0,Math.min(RS.lw,RS.lh)/2-0.5);
  if(!uji&&!PILRAK.length){toast("Pilih rak dulu.",true);return;}
  var info=document.getElementById("rinfo");info.textContent="Menyusun PDF...";
  try{var by=await buatPdfRak(PILRAK,RS,uji),u=URL.createObjectURL(new Blob([by],{type:"application/pdf"}));window.open(u,"_blank");
    var a=document.createElement("a");a.href=u;a.download=(uji?"uji-label-rak-":"label-rak-")+new Date().toISOString().slice(0,10)+".pdf";document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},1500);
    info.textContent=uji?"PDF uji siap.":"PDF siap: "+PILRAK.reduce(function(x,y){return x+y.n;},0)+" label.";}
  catch(e){info.textContent="";toast("Gagal membuat PDF: "+(e&&e.message?e.message:"kesalahan"),true);}
}
