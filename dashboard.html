async function api(b){
  var r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)});
  return await r.json();
}
/* ---- kotak kode ---- */
var dlgRes=null;
function mintaKode(judul,ket,verif){
  return new Promise(function(done){
    var ov=document.getElementById("ov"),di=document.getElementById("di"),de=document.getElementById("de"),dg=document.getElementById("dg");
    document.getElementById("dj").textContent=judul;document.getElementById("dk").textContent=ket;di.value="";de.textContent="";dg.disabled=false;ov.classList.add("on");setTimeout(function(){di.focus();},30);
    function tutup(v){ov.classList.remove("on");dg.onclick=null;document.getElementById("db").onclick=null;di.onkeydown=null;done(v);}
    async function ok(){
      var v=di.value.trim();if(!v){di.focus();return;}
      dg.disabled=true;de.textContent="";
      try{var r=await verif(v);if(r&&r.ok){tutup(v);return;}de.textContent=(r&&r.msg)||"Kode tidak diterima.";}
      catch(e){de.textContent="Gagal terhubung ke server. Periksa internet lalu coba lagi.";}
      dg.disabled=false;di.select();
    }
    dg.onclick=ok;document.getElementById("db").onclick=function(){tutup(null);};
    di.onkeydown=function(e){if(e.key==="Enter")ok();else if(e.key==="Escape")tutup(null);};
  });
}
/* ---- gerbang per kartu ---- */
async function pastikanPegawai(){
  var k=st("sctk_kode");
  if(k){try{var r=await api({action:"proyek",kode:k});if(r.ok)return k;}catch(e){return k;}st("sctk_kode",null);}
  var v=await mintaKode("Kode akses pegawai","Masukkan kode akses pegawai untuk melanjutkan. Kode cukup dimasukkan sekali di perangkat ini.",function(x){return api({action:"proyek",kode:x});});
  if(v)st("sctk_kode",v);return v;
}
async function pastikanPic(){
  var k=st("sctk_pic"),pin=st("sctk_admin",undefined,true);
  if(k||pin){try{var r=await api({action:"proyekPic",kode:k,pin:k?undefined:pin});if(r.ok)return true;}catch(e){return true;}st("sctk_pic",null);}
  var v=await mintaKode("Kode akses PIC / atasan / gudang","Menu ini untuk PIC, atasan, Manager Gudang, dan Staff Gudang. Masukkan kode akses Anda.",function(x){return api({action:"proyekPic",kode:x});});
  if(v)st("sctk_pic",v);return !!v;
}
async function pastikanAdmin(){
  var pin=st("sctk_admin",undefined,true);
  if(pin){try{var r=await api({action:"adminSistem",pin:pin});if(r.ok)return pin;}catch(e){return pin;}st("sctk_admin",null,true);}
  var v=await mintaKode("Kode admin","Khusus admin gudang. Masukkan kode admin Anda.",function(x){return api({action:"adminSistem",pin:x});});
  if(v)st("sctk_admin",v,true);return v;
}
async function buka(aksi,btn){
  if(btn)btn.disabled=true;
  try{
    if(aksi==="minta"){if(await pastikanPegawai())location.href="index.html?dari=utama";}
    else if(aksi==="cari"){
      var k=await pastikanPegawai();
      if(k){var r=await api({action:"menu",kode:k}),u=(r&&r.ok&&r.cari)||"gudang.html";location.href=u;}
    }
    else if(aksi==="masterbarang"){if(await pastikanPegawai())location.href="masterbarang.html";}
    else if(aksi==="kembali"){if(await pastikanPegawai())location.href="pengembalian.html";}
    else if(aksi==="kebutuhan"){if(await pastikanPic())location.href="kebutuhan.html";}
    else if(aksi==="proyek"){if(await pastikanPic())location.href="proyek.html";}
    else if(aksi==="beli"){if(await pastikanPic())location.href="pembelian.html";}
    else if(aksi==="realisasi"){if(await pastikanPic())location.href="realisasi.html";}
    else if(aksi==="pembelianku"){if(await pastikanPic())location.href="pengadaan.html";}
    else if(aksi==="label"){if(await pastikanPic())location.href="label.html";}
    else if(aksi==="admin"){if(await pastikanAdmin())location.href="admin.html";}
  }finally{if(btn)btn.disabled=false;}
}
function keluar(){st("sctk_kode",null);st("sctk_pic",null);st("sctk_admin",null,true);tampilAwal();}

function stat(n,l,c,href,ik){return '<a class="stat '+c+'" href="'+href+'"><div class="top"><span class="ik"><svg viewBox="0 0 24 24" aria-hidden="true">'+(SI[ik]||SI.kotak)+'</svg></span><span class="dot"></span></div><b>'+esc(n)+'</b><span class="l">'+esc(l)+'</span></a>';}
function grid(a){
  return '<div class="grid">'+a.map(function(m){
    var ext=/^https?:/i.test(m.link);
    return '<a class="tile" href="'+esc(m.link)+'"'+(ext?' target="_blank" rel="noopener"':'')+'>'+ikon(m.ikon)+'<div><b>'+esc(m.judul)+'</b><small>'+esc(m.ket)+'</small>'+(m.untuk==="Admin"?'<span class="badge">ADMIN</span>':'')+'</div></a>';
  }).join("")+'</div>';
}

function grafikAdmin(g){
  var box=document.getElementById("adm-graf");if(!box||!g)return;
  var W=560,H=170,pl=28,pb=22,pt=10,pr=8,mx=Math.max.apply(null,g.hari.map(function(x){return x.n;}).concat([3])),bw=(W-pl-pr)/g.hari.length,svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Permintaan per hari">';
  for(var i=0;i<=3;i++){var y=pt+(H-pt-pb)*i/3,v=Math.round(mx*(3-i)/3);svg+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="var(--mut)">'+v+'</text>';}
  g.hari.forEach(function(x,i){var h=(H-pt-pb)*x.n/mx,xx=pl+i*bw+bw*.18;svg+='<rect x="'+xx+'" y="'+(H-pb-h)+'" width="'+(bw*.64)+'" height="'+Math.max(h,x.n?2:0)+'" rx="3" fill="var(--aqua)"><title>'+x.label+': '+x.n+' permintaan</title></rect>';if(i%2===0||g.hari.length<8)svg+='<text x="'+(xx+bw*.32)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9.5" fill="var(--mut)">'+x.label+'</text>';});
  svg+='</svg>';
  var tot=g.status.reduce(function(a,x){return a+x.n;},0),WR=["var(--warn)","var(--aqua)","var(--ok)","var(--bad)"],R=52,cx=70,cy=70,ang=-Math.PI/2,dn='';
  if(tot){g.status.forEach(function(x,i){if(!x.n)return;var a=x.n/tot*Math.PI*2,e=ang+a,f=a>Math.PI?1:0;
    if(x.n===tot)dn+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="'+WR[i]+'" stroke-width="22"/>';
    else dn+='<path d="M'+(cx+R*Math.cos(ang))+' '+(cy+R*Math.sin(ang))+' A'+R+' '+R+' 0 '+f+' 1 '+(cx+R*Math.cos(e))+' '+(cy+R*Math.sin(e))+'" fill="none" stroke="'+WR[i]+'" stroke-width="22"><title>'+esc(x.nama)+': '+x.n+'</title></path>';ang=e;});
    dn='<svg viewBox="0 0 140 140" style="max-width:190px;margin:0 auto" role="img" aria-label="Status permintaan 30 hari">'+dn+'<text x="70" y="68" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">'+tot+'</text><text x="70" y="84" text-anchor="middle" font-size="9.5" fill="var(--mut)">permintaan</text></svg>'+
    '<div class="lgd">'+g.status.map(function(x,i){return '<span><b style="background:'+WR[i]+'"></b>'+esc(x.nama)+' ('+x.n+')</span>';}).join("")+'</div>';}
  else dn='<div class="kosong">Belum ada permintaan 30 hari terakhir.</div>';
  function bars(a,sat){if(!a.length)return '<div class="kosong">Belum ada data.</div>';var m=a[0].n||1;return a.map(function(x){return '<div class="bar"><span title="'+esc(x.nama)+'">'+esc(x.nama)+'</span><span><i style="width:'+Math.max(4,x.n/m*100)+'%"></i></span><em>'+x.n+(sat||"")+'</em></div>';}).join("");}
  box.innerHTML='<div class="sec"><h3>Grafik dan tren</h3></div><div class="chs">'+
   '<div class="ch"><h4>Permintaan per hari<small>14 hari terakhir</small></h4>'+svg+'</div>'+
   '<div class="ch"><h4>Status permintaan<small>30 hari terakhir</small></h4>'+dn+'</div>'+

}

  }catch(e){}

    var r=await api({action:"pengumuman"});if(!r||!r.ok||!r.data||!r.data.length)return;
    var box=document.getElementById("pgm");if(!box)return;
    box.innerHTML=r.data.map(function(p){
      var ext=/^https?:/i.test(p.tautan||"");
      return '<div class="pg'+(p.penting?" pen":"")+'"><b>'+esc(p.judul)+'</b>'+(p.isi?'<p>'+esc(p.isi)+'</p>':'')+
        (p.tautan?'<a href="'+esc(p.tautan)+'"'+(ext?' target="_blank" rel="noopener"':'')+'>Buka tautan &#8594;</a>':'')+
        (p.berakhir?'<small>Berlaku sampai '+esc(tglId(p.berakhir))+'</small>':'')+'</div>';}).join("");
  }catch(e){}
}
function tampilAwal(){
  app.innerHTML='<div id="adm-stat"></div>'+kartu()+'<div id="adm-box"></div>';pasangKartu();bar();papan();
  var pin=st("sctk_admin",undefined,true);if(pin)ringkasAdmin(pin);
}

  setInterval(function(){i=(i+1)%K.length;e.style.opacity=0;setTimeout(function(){e.textContent=K[i];e.style.opacity=1;},500);},7000);

})();
