<!DOCTYPE html>
<html lang="id">
<head><link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tandai Penyerahan Barang - Gudang SCTK</title>
<style>
:root{--navy:#0a2a43;--gold:var(--accent,#0b5f8f);--bg:#eef3f6;--ink:#0d1f2d;--card:#fff;--line:#cfd8de;--mut:#5b7a8c}
@media (prefers-color-scheme:dark){:root{--bg:#0f171c;--ink:#e6eef2;--card:#1a252c;--line:#33444e;--mut:#9db0bc}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}
.top{position:relative;background:#0c3b57;color:#fff;text-align:center;padding:16px 12px;border-bottom:4px solid var(--gold)}
.top h1{margin:0;font:700 17px Inter,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:1.5px}
.top div{margin-top:4px;font-size:11px;letter-spacing:2px;color:#c9dde9;font-weight:600}
.homebtn{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#c9dde9;font:600 12px "Segoe UI",Roboto,Arial,sans-serif;text-decoration:none;border:1px solid rgba(201,221,233,.5);border-radius:8px;padding:7px 11px}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
input,select,textarea{font:14px "Segoe UI",Roboto,Arial,sans-serif;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input.t{width:100%;padding:12px;font-size:16px}
button{font:600 13px "Segoe UI",Roboto,Arial,sans-serif;padding:10px 14px;border:0;border-radius:8px;color:#fff;background:var(--navy);cursor:pointer}
button.gh{background:transparent;color:var(--navy);border:1px solid var(--line)}
@media (prefers-color-scheme:dark){button.gh{color:var(--ink)}}
button:disabled{opacity:.55;cursor:not-allowed}
.msg{text-align:center;padding:18px;color:var(--mut)}.err{color:#a82424}
.fr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.fl{font-size:12px;color:var(--mut)}
.note{font-size:12px;color:var(--mut)}
.bd{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700}.bd.d{background:#d9f0df;color:#14612b}.bd.w{background:#fff3cd;color:#7a5b00}.bd.l{background:#e4e9ec;color:#445}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th.n,td.n{text-align:right}small{display:block;color:var(--mut);font-size:11px}
.chip{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:6px 12px}.chip.on{background:var(--navy);color:#fff}
.act{display:flex;gap:6px}
#toast{display:none;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#14612b;color:#fff;padding:11px 16px;border-radius:9px;z-index:10000;max-width:90%}#toast.bad{background:#a82424}
@media print{.top,.noprint{display:none}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema-halaman.css">
<script src="tema.js"></script>
</head>
<body>
<div class="top"><a class="homebtn" href="dashboard.html">&larr; Halaman Utama</a><h1>TANDAI PENYERAHAN</h1><div>GUDANG - PT SARANA CATUR TIRTA KELOLA</div></div>
<div class="wrap" id="app"></div>
<div id="toast"></div>
<script src="tanda.js"></script>
<script>
var API_URL="https://script.google.com/macros/s/AKfycbyVPrhw3xmk8D-73kgZQlesBB_1M6-Pc6vv3IUFMpa8jZx9bZmfGhzf_IFjKe3ZuYOMVw/exec";
var KODE="",app=document.getElementById("app");
function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function toast(m,bad){var t=document.getElementById("toast");t.textContent=m;t.className=bad?"bad":"";t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none";},4500);}
function simpan(v){try{if(v)localStorage.setItem("sctk_pic",v);else localStorage.removeItem("sctk_pic");}catch(e){}}
function baca(){try{return localStorage.getItem("sctk_pic")||"";}catch(e){return "";}}
async function api(b){
  b.kode=KODE;
  var r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)});
  return await r.json();
}
function loginView(msg){
  app.innerHTML='<div class="card" style="max-width:380px;margin:30px auto"><p style="margin-top:0"><b>Kode akses Staff Gudang</b></p><div class="note" style="margin-bottom:8px">Menandai waktu penyerahan barang untuk KPI gudang. Khusus Staff Gudang dan admin.</div>'+
   '<input class="t" id="kd" type="password" autocomplete="off" placeholder="Kode akses"><div style="height:10px"></div>'+
   '<button id="go" style="width:100%">Masuk</button><p class="err" id="lerr" style="margin:10px 0 0">'+esc(msg||"")+'</p></div>';
  var i=document.getElementById("kd");i.focus();i.onkeydown=function(e){if(e.key==="Enter")masuk();};document.getElementById("go").onclick=masuk;
}
async function masuk(){
  var v=document.getElementById("kd").value.trim();if(!v)return;
  var b=document.getElementById("go");b.disabled=true;KODE=v;
  var r;try{r=await api({action:"tandaList"});}catch(e){b.disabled=false;document.getElementById("lerr").textContent="Tidak bisa terhubung. Periksa internet.";return;}
  if(!r.ok){KODE="";b.disabled=false;document.getElementById("lerr").textContent=r.msg||"Kode salah.";return;}
  simpan(v);mulai();
}
function mulai(){
  app.innerHTML='<div class="noprint" style="text-align:right;margin-bottom:6px"><button class="gh" id="kel">Keluar</button></div><div id="isi"></div>';
  document.getElementById("kel").onclick=function(){simpan("");KODE="";loginView("");};
  TDS.mount(document.getElementById("isi"));
}
(async function(){var k=baca();if(k){KODE=k;var r;try{r=await api({action:"tandaList"});}catch(e){r=null;}if(r&&r.ok){mulai();return;}KODE="";}loginView("");})();
</script>
</body>
</html>
