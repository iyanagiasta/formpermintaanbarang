<style>
:root{--navy:#0a2a43;--gold:var(--accent,#0b5f8f);--bg:#eef3f6;--ink:#0d1f2d;--card:#fff;--line:#cfd8de;--mut:#5b7a8c}
@media (prefers-color-scheme:dark){:root{--bg:#0f171c;--ink:#e6eef2;--card:#1a252c;--line:#33444e;--mut:#9db0bc}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}
.top{background:#0c3b57;color:#fff;text-align:center;padding:16px 12px;border-bottom:4px solid var(--gold)}
.top h1{margin:0;font:700 17px Inter,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:1.5px}
.top div{margin-top:4px;font-size:11px;letter-spacing:2px;color:#c9dde9;font-weight:600}
.wrap{max-width:1180px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
input.t{width:100%;padding:11px;font:600 15px "Segoe UI",Roboto,Arial,sans-serif;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
button{font:600 13px "Segoe UI",Roboto,Arial,sans-serif;padding:8px 11px;border:0;border-radius:8px;color:#fff;background:var(--navy);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.rm{background:#b8760a}button.sv{background:#1b8a3a}button.gh{background:transparent;color:var(--navy);border:1px solid var(--line)}
@media (prefers-color-scheme:dark){button.gh{color:var(--ink)}}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chip{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:6px 12px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.bar input{flex:1;min-width:150px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
.sum{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.sum div{flex:1;min-width:130px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.sum b{display:block;font-size:22px}.sum span{color:var(--mut);font-size:12px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
tr.grp td{background:var(--solid-hover,#eef6f9);color:var(--solid-ink,#0b2133);border-top:2px solid var(--accent,#0b5f8f)}
tr.grp td small{color:var(--solid-sub,#52707f)}
th{background:var(--navy);color:#fff;text-align:left;padding:9px 8px;font-size:12px;letter-spacing:.3px}
td{border-top:1px solid var(--line);padding:9px 8px;vertical-align:top}
td small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.bd{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700}
.bd.n{background:#e8f1f6;color:#0a2a43}.bd.w{background:#fff3cd;color:#7a5b00}.bd.b{background:#f8d7da;color:#8a1c28}.bd.d{background:#d9f0df;color:#14612b}.bd.r{background:#e6e6e6;color:#444}
.act{display:flex;flex-direction:column;gap:6px;min-width:150px}
.ppi{display:flex;gap:5px;margin-top:6px}.ppi input{width:110px;padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
.msg{text-align:center;padding:22px;color:var(--mut)}
.err{color:var(--red,#a82424)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0a2a43;color:#fff;padding:11px 16px;border-radius:10px;max-width:92vw;display:none;z-index:9;font-weight:600}
#toast.bad{background:#c0392b}
@media (max-width:820px){
 table,thead,tbody,tr,td{display:block}thead{display:none}
 tr{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card);padding:6px 4px}
 td{border:0;padding:5px 10px}
 td[data-l]:before{content:attr(data-l);display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
 .act{flex-direction:row;flex-wrap:wrap}
}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:8px 16px}
.tabs button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.fr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.fr select,.fr input[type=text],.fr input[type=number]{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.fr label.fl{font-size:12px;color:var(--mut)}
.nm{text-align:right;white-space:nowrap}
.note{color:var(--mut);font-size:12px;margin:4px 0}
.bd.a{background:#d9f0df;color:#14612b}.bd.s{background:#fff3cd;color:#7a5b00}.bd.l{background:#e6e6e6;color:#444}
.krgx{display:none!important}
.top{position:relative}.homebtn{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#c9dde9;font:600 12px "Segoe UI",Roboto,Arial,sans-serif;text-decoration:none;border:1px solid rgba(227,201,143,.55);border-radius:8px;padding:7px 11px;letter-spacing:0}.homebtn:hover,.homebtn:focus-visible{background:rgba(255,255,255,.12);outline:none}@media (max-width:640px){.top{padding-top:50px}.homebtn{top:10px;transform:none}}
.ppbox{position:fixed;z-index:10000;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-height:260px;overflow:auto}
.ppit{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;line-height:1.35}.ppit:hover{background:rgba(76,195,240,.14)}.ppit small{display:block;color:var(--mut,#7a8c97);font-size:12px}.ppft{text-align:center;font-weight:700;color:#1b6fa8}
.ppin{position:static!important;width:auto!important;box-shadow:none;margin:-4px 0 12px;max-height:210px}
.ppcap{font-size:12.5px;margin:-6px 0 10px;min-height:1px}
.ppov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;display:flex;align-items:center;justify-content:center;padding:12px}
.ppdl{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.ppdl label{display:block;font-weight:700;margin:12px 0 4px;font-size:13px}.ppdl input,.ppdl textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:600 15px "Segoe UI",Roboto,Arial,sans-serif}
.ppdl .ppb{display:flex;gap:8px;margin-top:14px}
.wrap{max-width:1400px}
.adm>*{min-width:0}
.adm{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;align-items:start}
.side{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:4px;padding-bottom:6px}
.mcari{padding:8px}.mcari input{width:100%;padding:8px;border:1px solid var(--line);border-radius:3px;background:var(--field,var(--card));color:var(--ink);font:inherit}
.mgt{font:700 11px "Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.9px;text-transform:uppercase;color:var(--mut);padding:12px 12px 4px}
#tabs button{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);border:0;border-left:3px solid transparent;border-radius:0;padding:7px 12px;font-weight:500;font-size:13.5px}
#tabs button:hover{background:var(--hover,#e3eef5)}
#tabs button.on{background:var(--hover,#e3eef5);border-left-color:var(--accent,#0b5f8f);font-weight:700;color:var(--ink)}
.mnbtn{display:none;width:100%;text-align:left;background:var(--navy);color:#fff;border:0;border-radius:3px;padding:11px 12px;font-weight:600}
@media (max-width:860px){.adm{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none;overflow:visible}.mnbtn{display:block}#mnbox{display:none;max-height:70vh;overflow:auto}.side.buka #mnbox{display:block}}
@media print{.side{display:none}.adm{display:block}}

<body>
<div class="top"><a class="homebtn" href="dashboard.html">&larr; Halaman Utama</a><h1>ADMIN GUDANG</h1><div>PT SARANA CATUR TIRTA KELOLA</div></div>
<div class="wrap" id="app"></div>
<div id="toast"></div>
<script>
var API_URL="https://script.google.com/macros/s/AKfycbyVPrhw3xmk8D-73kgZQlesBB_1M6-Pc6vv3IUFMpa8jZx9bZmfGhzf_IFjKe3ZuYOMVw/exec";
var KRG=null,KRGF="semua",PDEPT=[],TAB="pantau",STOK=[],SUMB=["Bekas","Moka","Accurate"],PRO=[],PST=[],PIN="",MODE="belum",DATA=[],BUSY=false,SEMUA=false;
var app=document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function toast(m,bad){var t=document.getElementById("toast");t.textContent=m;t.className=bad?"bad":"";t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none";},4500);}
async function api(b){
  b.pin=PIN;
  var r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)});
  return await r.json();
}
function loginView(msg){
  app.innerHTML='<div class="card" style="max-width:380px;margin:30px auto"><p style="margin-top:0"><b>Masuk sebagai Admin Gudang</b></p><div class="note" style="margin-bottom:8px">Pantauan, stok, opname, proyek, dan laporan. Khusus admin gudang.</div>'+
   '<input class="t" id="pin" type="password" autocomplete="off" placeholder="Kode admin"><div style="height:10px"></div>'+
   '<button id="go" style="width:100%;padding:11px">Masuk</button><p class="err" id="lerr" style="margin:10px 0 0">'+esc(msg||"")+'</p></div>';
  var i=document.getElementById("pin");i.focus();
  i.onkeydown=function(e){if(e.key==="Enter")login();};
  document.getElementById("go").onclick=login;
}
async function login(){
  var v=document.getElementById("pin").value.trim();if(!v)return;
  PIN=v;document.getElementById("go").disabled=true;
  await load(true);
}
async function load(first){
  try{
    var r=await api({action:"adminList",semua:SEMUA});
    if(!r.ok){PIN="";try{sessionStorage.removeItem("sctk_admin")}catch(e){}loginView(r.msg||"Gagal masuk.");return;}
    DATA=r.data||[];try{sessionStorage.setItem("sctk_admin",PIN)}catch(e){}
    var h=(location.hash||"").replace("#","");
    if(first&&h&&h!=="pantau"&&["serah","stok","proyek","mutasi","opname","laporan","sistem","pengumuman","terima","pengajuan","accurate","masterbarang","komparasi","baopname","buffer","kerja","lapatasan","telusur","kedaluwarsa"].indexOf(h)>=0){goTab(h);return;}
    draw(r.now);paMuatRingkas();
  }catch(e){
    if(first)loginView("Gagal terhubung ke server. Periksa internet lalu coba lagi.");else toast("Gagal terhubung ke server.",true);
  }
}
function lamaTxt(jam){if(!jam)return "";return jam<24?Math.max(Math.round(jam),1)+" jam":(jam/24).toFixed(1).replace(".",",")+" hari";}
function statusBd(d){
  if(d.ditolak)return '<span class="bd r">Ditolak</span>';
  if(d.selesai)return d.diserahkan?'<span class="bd d">Sudah Diserahkan</span>':'<span class="bd d">Siap Diserahkan</span>';
  var c=d.jam>=48?"b":d.jam>=24?"w":"n";
  return '<span class="bd '+c+'">'+esc(d.status)+'</span><small>Menunggu: <b>'+esc(d.menunggu?d.menunggu.nama:"-")+'</b> ('+esc(lamaTxt(d.jam))+')</small>';
}
function filtered(){
  var q=(document.getElementById("q")||{value:""}).value.trim().toLowerCase();
  return DATA.filter(function(d){
    if(MODE==="setuju"&&!d.menunggu)return false;
    if(MODE==="ppbj"&&!d.ppbjBelum)return false;
    if(q){var h=(d.doc+" "+d.id+" "+d.by+" "+(d.pic||"")+" "+d.dept+" "+d.status+" "+(d.menunggu?d.menunggu.nama:"")+" "+d.ppbj+" "+(d.alasan||"")+" "+(d.barang||"")).toLowerCase();if(h.indexOf(q)<0)return false;}
    return true;
  });
}
function draw(now){
  var nSet=DATA.filter(function(d){return d.menunggu;}).length,nPp=DATA.filter(function(d){return d.ppbjBelum;}).length,nLate=DATA.filter(function(d){return d.menunggu&&d.jam>=24;}).length;
  var q=(document.getElementById("q")||{}).value||"";
  tabsUI();
  pane().innerHTML=
   '<div class="sum"><div><b>'+nSet+'</b><span>Menunggu persetujuan</span></div><div><b>'+nLate+'</b><span>Menunggu 24 jam atau lebih</span></div><div><b>'+nPp+'</b><span>PPBJ belum ada</span></div></div>'+
   '<div class="bar">'+
   [["belum","Belum lengkap"],["setuju","Menunggu persetujuan"],["ppbj","PPBJ belum ada"],["semua","Semua"]].map(function(c){var on=(c[0]==="semua"?SEMUA:(!SEMUA&&MODE===c[0]));return '<button class="chip'+(on?" on":"")+'" data-chip="'+c[0]+'">'+c[1]+'</button>';}).join("")+
   '<input id="q" placeholder="Cari No BPB, pemohon, PIC, departemen..." value="'+esc(q)+'"><button class="rm" id="rkgo">Rekap PPBJ per PIC</button><button class="gh" id="rf">Segarkan</button><button class="gh" id="lo">Keluar</button></div>'+
   '<div id="tb"></div><p style="color:var(--mut);font-size:12px">Diperbarui: '+esc(now||"")+'. Pengingat otomatis dikirim tiap pagi (persetujuan: menunggu 24 jam atau lebih; PPBJ: sejak hari ke-3).</p>';
  drawRows();
  document.getElementById("q").oninput=drawRows;
  document.getElementById("rf").onclick=function(){load(false);};
  document.getElementById("rkgo").onclick=loadRekap;
  document.getElementById("lo").onclick=function(){PIN="";try{sessionStorage.removeItem("sctk_admin")}catch(e){}loginView("");};
  pane().querySelectorAll("[data-chip]").forEach(function(b){b.onclick=function(){
    var k=b.getAttribute("data-chip");
    if(k==="semua"){SEMUA=true;MODE="belum";}else{SEMUA=false;MODE=k;}
    load(false);
  };});
}
function drawRows(){
  var rows=filtered(),box=document.getElementById("tb");
  if(!rows.length){box.innerHTML='<div class="card msg">Tidak ada data untuk ditampilkan.</div>';return;}
  box.innerHTML='<table><thead><tr><th>No BPB</th><th>Pemohon / PIC</th><th>Status</th><th>PPBJ</th><th>Pengingat terakhir</th><th>Aksi</th></tr></thead><tbody>'+rows.map(function(d){
    var pp=d.ppbjBelum
      ?'<span class="bd b">BELUM ADA</span><small>sejak '+d.hariKirim+' hari lalu</small><div class="ppi"><input placeholder="No PPBJ" maxlength="60" data-no="'+esc(d.id)+'"><button class="sv" data-act="ppbj" data-id="'+esc(d.id)+'">Simpan</button></div>'
      :(d.ditolak?'<small>-</small>':'<b>'+esc(d.ppbj)+'</b>'+(SEMUA?'<small><a href="#" data-act="ubah" data-id="'+esc(d.id)+'">ubah</a></small>':''));
    var last=[];if(d.follow)last.push("Persetujuan: "+esc(d.follow));if(d.pingatPpbj)last.push("PPBJ: "+esc(d.pingatPpbj));
    var acts="";
    if(d.menunggu)acts+='<button class="rm" data-act="remind" data-jenis="persetujuan" data-id="'+esc(d.id)+'">Kirim pengingat persetujuan</button>';
    if(d.ppbjBelum)acts+='<button class="rm" data-act="remind" data-jenis="ppbj" data-id="'+esc(d.id)+'">Kirim pengingat PPBJ</button>';
    if(d.selesai&&!d.ditolak&&!d.diserahkan)acts+='<button class="sv" data-act="serahkan" data-id="'+esc(d.id)+'">Serahkan barang</button>';
    var als=d.ditolak?"":('<small class="als" title="'+esc(d.alasan||"")+'">Alasan: <i>'+esc((d.alasan||"-").length>110?(d.alasan||"").slice(0,110)+"...":(d.alasan||"-"))+'</i> <a href="#" data-act="alasan" data-id="'+esc(d.id)+'">ubah</a>'+(d.proyekKet&&(d.alasan||"").indexOf(d.proyekKet)<0?' &middot; <a href="#" data-act="samakan" data-id="'+esc(d.id)+'">samakan dengan proyek</a>':'')+'</small>');
    return '<tr><td data-l="No BPB"><b>'+esc(d.doc||d.id)+'</b><small>'+esc(d.kirim)+'</small><small>'+esc(d.barang)+'</small>'+als+'</td>'+
      '<td data-l="Pemohon">'+esc(d.by)+'<small>'+esc(d.dept)+'</small>'+(d.pic?'<small>PIC: <b>'+esc(d.pic)+'</b></small>':"")+'</td>'+
      '<td data-l="Status">'+statusBd(d)+'</td><td data-l="PPBJ">'+pp+'</td>'+
      '<td data-l="Pengingat terakhir"><small style="margin:0">'+(last.join("<br>")||"-")+'</small></td>'+
      '<td data-l="Aksi"><div class="act">'+(acts||'<small>-</small>')+'</div></td></tr>';
  }).join("")+'</tbody></table>';
  box.querySelectorAll("[data-act]").forEach(function(b){b.onclick=function(e){e.preventDefault();onAct(b);};});
  ensureProyek().then(function(){box.querySelectorAll("[data-no]").forEach(function(i){pasangProyek(i,function(){return PROC||[];});});});
}
/* ---- pilihan proyek terdaftar (ketik untuk mencari; boleh juga ketik manual) ---- */
function ppBox(){var b=document.getElementById("ppglobal");if(!b){b=document.createElement("div");b.id="ppglobal";b.className="ppbox";b.style.display="none";document.body.appendChild(b);window.addEventListener("scroll",function(e){if(!b.contains(e.target))b.style.display="none";},true);}return b;}
function pasangProyek(inp,getList,onPick,inline){
  if(inp.__pp)return;inp.__pp=1;
  var semua=false,tm=null,ib=null;
  function BX(){if(!inline)return ppBox();if(!ib){ib=document.createElement("div");ib.className="ppbox ppin";ib.style.display="none";var c=inp.nextElementSibling;(c&&c.classList.contains("ppcap")?c:inp).insertAdjacentElement("afterend",ib);}return ib;}
  function ok(p){return p.status==="Aktif"||p.status==="Ditunda Sebentar";}
  function cari(v){return (getList()||[]).filter(function(p){return semua||ok(p);}).filter(function(p){var h=(p.ppbj+" "+p.ket+" "+(p.dept||"")).toLowerCase(),t=String(v||"").toLowerCase().split(/\s+/).filter(Boolean);for(var i=0;i<t.length;i++)if(h.indexOf(t[i])<0)return false;return true;});}
  function cap(){var el=inp.nextElementSibling;if(!el||!el.classList.contains("ppcap"))return;var v=String(inp.value||"").trim().toLowerCase();
    if(!v){el.textContent="";return;}
    var p=(getList()||[]).filter(function(x){return String(x.ppbj).toLowerCase()===v;})[0];
    if(!p&&cari(v).length){el.innerHTML='<span style="color:var(--mut,#4a5b68)">Pilih proyek dari daftar di bawah, atau ketik nomor lengkap.</span>';return;}
    el.innerHTML=p?'<span style="color:var(--grn,#14602f)">&#10003; Proyek terdaftar: <b>'+esc(p.ket)+'</b>'+(p.dept?' ('+esc(p.dept)+')':'')+'. Alasan permintaan akan disamakan dengan nama proyek ini.</span>':'<span style="color:#b8760a">Nomor ini belum terdaftar di daftar proyek, jadi nama proyek tidak terisi otomatis. Tetap bisa disimpan.</span>';}
  function tampil(){
    var box=BX(),r=inp.getBoundingClientRect(),L=cari(inp.value),jumlahSemua=(getList()||[]).length,v0=String(inp.value||"").trim().toLowerCase();
    if(v0&&(getList()||[]).some(function(p){return String(p.ppbj).toLowerCase()===v0;})){box.style.display="none";return;}   /* nomor sudah persis salah satu proyek: tutup daftar */
    if(!inline){box.style.left=Math.max(4,r.left)+"px";box.style.top=(r.bottom+2)+"px";box.style.width=Math.max(r.width,280)+"px";}
    box.innerHTML=(L.length?L.slice(0,12).map(function(p,i){return '<div class="ppit" data-i="'+i+'"><b>'+esc(p.ppbj)+'</b> &middot; '+esc(p.ket)+'<small>'+esc(p.dept||"")+(p.dept?" &middot; ":"")+esc(p.status)+'</small></div>';}).join(""):'<div class="ppit" style="opacity:.7">'+(jumlahSemua?"Tidak ada proyek yang cocok. Boleh ketik nomor sendiri.":"Daftar proyek belum termuat atau masih kosong. Boleh ketik nomor sendiri.")+'</div>')+
      (jumlahSemua?'<div class="ppit ppft" data-semua="1">'+(semua?"Hanya proyek aktif":"Tampilkan semua status")+'</div>':"");
    box.__own=inp;box.style.display="block";

function bacaFile(file,cb){
  if(typeof XLSX==="undefined"){toast("Pembaca Excel belum termuat. Periksa internet lalu muat ulang halaman.",true);return;}
  var fr=new FileReader();
  fr.onload=function(ev){
    try{
      var wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"}),ws=wb.Sheets[wb.SheetNames[0]];
      var a=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false});
      cb(a);
    }catch(e){toast("File tidak bisa dibaca. Gunakan .xlsx atau .csv.",true);}
  };
  fr.readAsArrayBuffer(file);
}
function unduhXlsx(nama,lembar,baris,lebar){
  if(typeof XLSX==="undefined"){toast("Pembaca Excel belum termuat.",true);return false;}
  var ws=XLSX.utils.aoa_to_sheet(baris);if(lebar)ws["!cols"]=lebar.map(function(w){return {wch:w};});
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,String(lembar).slice(0,31));XLSX.writeFile(wb,nama);return true;
}
function petaKolom(a){
  var hi=-1,m={};
  for(var i=0;i<Math.min(a.length,10);i++){
    var h=a[i].map(function(x){return String(x).toLowerCase().trim();}),t={};
    h.forEach(function(x,j){
      if(t.kode==null&&/kode/.test(x))t.kode=j;
      else if(t.nama==null&&/nama|uraian|deskripsi|barang/.test(x))t.nama=j;
      else if(t.satuan==null&&/satuan|sat\b|unit|uom/.test(x))t.satuan=j;
      else if(t.qty==null&&/qty|stok|stock|jumlah|saldo|kuantitas/.test(x))t.qty=j;
      else if(t.harga==null&&/harga|price/.test(x))t.harga=j;
    });
    if(t.kode!=null){hi=i;m=t;break;}
  }
  if(hi<0)return {hi:-1,m:{kode:0,nama:1,satuan:2,qty:3,harga:3}};
  return {hi:hi,m:m};
}
function ambil(a,mode){
  var p=petaKolom(a),out=[];
  for(var i=p.hi+1;i<a.length;i++){
    var r=a[i],k=String(r[p.m.kode]==null?"":r[p.m.kode]).trim();if(!k)continue;
    var o={kode:k,nama:p.m.nama!=null?String(r[p.m.nama]||"").trim():"",satuan:p.m.satuan!=null?String(r[p.m.satuan]||"").trim():""};
    if(mode==="harga"){if(p.m.harga==null)return {err:"Kolom Harga tidak ditemukan. Beri judul kolom 'Harga'."};o.harga=r[p.m.harga];}
    else{if(p.m.qty==null)return {err:"Kolom Qty tidak ditemukan. Beri judul kolom 'Qty' atau 'Stok'."};o.qty=r[p.m.qty];}
    out.push(o);
  }
  return {rows:out,adaJudul:p.hi>=0};
}

function bfImpor(inp){

    a.forEach(function(r){

      [A,B,t(r[2]),t(r[3])].forEach(function(c){var m=/kebutuhan\s+(.+?)\s+dikali\s+(\d+(?:[.,]\d+)?)\s*set/i.exec(c);if(m)sets[norm(m[1])]=Number(m[2].replace(",","."));});
      var h=/^kebutuhan\s+(.+)$/i.exec(A);
      if(h&&!/dikali/i.test(A)&&B===""){sec={nama:t(h[1]),items:[]};paket.push(sec);return;}
      if(!sec||/^kode barang$/i.test(A)||!B)return;
      var q=Number(String(r[3]).replace(",","."));if(!(q>0))return;
      var kode=A;if(/^#|^0$/.test(kode)||/^(false|true)$/i.test(kode))kode="";
      sec.items.push({kode:kode,nama:B,satuan:t(r[2]),qty:q});
    });
    paket=paket.filter(function(p){return p.items.length;});
    if(!paket.length){toast("Blok 'Kebutuhan ...' tidak ditemukan. Judul blok harus diawali kata Kebutuhan, lalu baris Kode Barang | Nama Barang | Satuan | Qty.",true);return;}
    paket.forEach(function(p){p.set=sets[norm(p.nama)]||0;});
    var ring=paket.map(function(p){return "- "+p.nama+": "+p.items.length+" baris, "+(p.set?p.set+" set":"jumlah set tidak ditemukan (dipakai 1)");}).join("\n");
    if(!confirm("Ditemukan "+paket.length+" paket:\n"+ring+"\n\nPaket yang namanya sama akan ditimpa. Lanjut impor?"))return;

      if(r.ok)await loadBF();else drawBF();
    }catch(e){toast("Gagal terhubung ke server.",true);}
  });
}

var CARI_Q={};
function cariNorm(s){return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}

function cariTeks(e){

function cariPasang(key,mode,o){
  o=o||{};var p=pane(),inp=null,cnt=null;
  var items=Array.prototype.slice.call(p.querySelectorAll(o.item||(mode==="card"?".card:not(.msg)":"table tbody tr:not(.grp)")));
  if(o.skip)items=items.filter(function(e){return !o.skip(e);});
  if(!items.length)return;
  items.forEach(function(e){e.__t=cariNorm(cariTeks(e));e.__s=e.__t.replace(/[^a-z0-9]/g,"");});
  if(o.input){inp=document.getElementById(o.input);if(!inp)return;}
  else{
    var anchor=o.before?o.before():(mode==="card"?items[0]:(function(){var t=p.querySelector("table");return t?(t.closest(".tw")||t):items[0];})());
    if(!anchor||!anchor.parentNode)return;

    inp=document.createElement("input");inp.type="search";inp.autocomplete="off";inp.placeholder=o.ph||"Cari...";inp.setAttribute("aria-label",o.ph||"Cari");
    cnt=document.createElement("span");cnt.className="note";cnt.style.margin="0";cnt.setAttribute("role","status");
    bar.appendChild(inp);bar.appendChild(cnt);anchor.parentNode.insertBefore(bar,anchor);
  }
  function saring(){
    var q=inp.value;CARI_Q[key]=q;
    var tok=cariNorm(q).split(/\s+/).filter(Boolean),n=0;
    items.forEach(function(e){
      var ok=!tok.length||tok.every(function(t){var s=t.replace(/[^a-z0-9]/g,"");return e.__t.indexOf(t)>=0||(s!==""&&e.__s.indexOf(s)>=0);});
      e.style.display=ok?"":"none";if(ok)n++;});
    if(o.hideEmptyCard)Array.prototype.forEach.call(p.querySelectorAll(".card"),function(c){
      var rs=c.querySelectorAll("table tbody tr");if(!rs.length)return;
      c.style.display=Array.prototype.some.call(rs,function(r){return r.style.display!=="none";})?"":"none";});
    Array.prototype.forEach.call(p.querySelectorAll("tr.grp"),function(g){
      var nx=g.nextElementSibling,ada=false;while(nx&&!nx.classList.contains("grp")){if(nx.style.display!=="none"){ada=true;break;}nx=nx.nextElementSibling;}
      g.style.display=ada||!tok.length?"":"none";});
    if(cnt)cnt.innerHTML=!tok.length?(items.length+" "+(o.satuan||"baris")):(n?n+" dari "+items.length+" "+(o.satuan||"baris"):'<span style="color:var(--red,#c0392b)">Tidak ada yang cocok</span>');
  }
  inp.addEventListener("input",saring);
  if(CARI_Q[key]&&!o.input)inp.value=CARI_Q[key];
  if(inp.value)saring();else if(cnt)cnt.textContent=items.length+" "+(o.satuan||"baris");
}

function lamaBaca(file,cb){
  if(typeof XLSX==="undefined"){toast("Pembaca Excel belum termuat. Periksa internet lalu muat ulang halaman.",true);return;}
  var fr=new FileReader();
  fr.onload=function(ev){
    try{
      var wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array",cellDates:true}),ws=wb.Sheets[wb.SheetNames[0]];
      var a=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true});
      a=a.map(function(r){return r.map(function(c){if(c instanceof Date){var d=new Date(c.getTime()+12*3600000);return d.getUTCFullYear()+"-"+("0"+(d.getUTCMonth()+1)).slice(-2)+"-"+("0"+d.getUTCDate()).slice(-2);}return c;});});
      cb(a);
    }catch(e){toast("File tidak bisa dibaca. Gunakan .xlsx atau .csv.",true);}
  };
  fr.readAsArrayBuffer(file);
}
function lamaPeta(a){
  var hi=-1,m={};
  var urutK=["doc","tgl","ppbj","kode","qty","sumber","pic","by","nama","proyek","dept","cat"];
  var kunciKolom={tgl:/^tanggal|^tgl/,doc:/no.*form|no.*bpb|nomor|^form|dokumen/,ppbj:/ppbj/,dept:/dept/,kode:/kode/,qty:/^qty|jumlah|^jml/,sumber:/sumber/,pic:/^pic|nama pic/,by:/pemohon|peminta/,nama:/nama barang|^barang|^nama$/,proyek:/proyek/,cat:/catatan|^ket|pengambil/};
  for(var i=0;i<Math.min(a.length,10)&&hi<0;i++){
    var t={};a[i].forEach(function(c,j){var s=String(c).toLowerCase().trim();for(var u=0;u<urutK.length;u++){var k=urutK[u];if(t[k]===undefined&&kunciKolom[k].test(s)){t[k]=j;break;}}});
    if(t.doc!==undefined&&t.kode!==undefined&&t.qty!==undefined){hi=i;m=t;}
  }
  if(hi<0)return [];
  var out=[];
  for(var r=hi+1;r<a.length;r++){
    var x=a[r],g=function(k){return m[k]===undefined?"":String(x[m[k]]==null?"":x[m[k]]).trim();};
    if(!g("doc")&&!g("kode")&&!g("qty"))continue;
    out.push({baris:r+1,tgl:g("tgl"),doc:g("doc"),ppbj:g("ppbj"),dept:g("dept"),kode:g("kode"),qty:g("qty").replace(",","."),sumber:g("sumber"),cat:g("cat"),pic:g("pic"),by:g("by"),proyek:g("proyek"),nama:g("nama")});
  }
  return out.slice(0,1500);
}

/* ---- teks prediktif seragam untuk semua kolom pencarian nama barang ---- */
function prediksi(inp,onPilih){
  if(!inp||inp._pred)return;inp._pred=true;inp.setAttribute("autocomplete","off");
  var box=document.createElement("div");box.className="pred";box.hidden=true;box.style.cssText="position:absolute;left:0;right:0;top:100%;z-index:30;max-height:280px;overflow:auto;margin-top:2px;box-shadow:0 8px 24px rgba(0,0,0,.35)";
  var par=inp.parentNode;if(getComputedStyle(par).position==="static")par.style.position="relative";par.appendChild(box);
  var tm=null,seq=0,L=[],act=-1;
  function tutup(){box.hidden=true;act=-1;}
  function pilih(i){var x=L[i];if(!x)return;inp.value=x.nama;tutup();if(onPilih)onPilih(x);}
  function tandai(){Array.prototype.forEach.call(box.children,function(c,i){c.style.background=i===act?"var(--solid-hover,#dff1f8)":"";if(i===act)c.scrollIntoView({block:"nearest"});});}
  inp.addEventListener("input",function(){clearTimeout(tm);var t=inp.value.trim();if(t.length<2){tutup();return;}
    tm=setTimeout(async function(){var my=++seq;try{var r=await api({action:"adminStokList",q:t,limit:8});if(my!==seq||!r.ok)return;L=r.data||[];
      if(!L.length){tutup();return;}
      box.innerHTML=L.map(function(x,i){return '<div data-i="'+i+'" style="padding:8px 10px;cursor:pointer;border-top:1px solid var(--line)"><b>'+esc(x.nama)+'</b><small style="display:block">'+esc(x.kode)+' · stok '+fmtN(x.total)+' '+esc(x.satuan||"")+'</small></div>';}).join("");
      box.hidden=false;act=-1;
      Array.prototype.forEach.call(box.children,function(c){c.onmousedown=function(e){e.preventDefault();pilih(Number(c.getAttribute("data-i")));};});
    }catch(e){}},220);});
  inp.addEventListener("keydown",function(e){if(box.hidden)return;
    if(e.key==="ArrowDown"){e.preventDefault();act=Math.min(L.length-1,act+1);tandai();}
    else if(e.key==="ArrowUp"){e.preventDefault();act=Math.max(0,act-1);tandai();}
    else if(e.key==="Enter"&&act>=0){e.preventDefault();e.stopImmediatePropagation();pilih(act);}
    else if(e.key==="Escape")tutup();},true);
  inp.addEventListener("blur",function(){setTimeout(tutup,150);});
}

function opLolos(x){
  var f=OPFIL,st=x.status,s=x.selisih;
  if(f.st=="tak"){if(st!=="Belum diketahui")return false;}
  else if(f.st!=="semua"&&st==="Belum diketahui")return false;
  if(f.arah&&st==="Belum diketahui")return false;
  if(f.st==="selisih"){if(!(s!==0&&st!=="Temuan"))return false;}
  else if(f.st==="kurang"){if(!(s<0&&st!=="Temuan"))return false;}
  else if(f.st==="lebih"){if(!(s>0&&st!=="Temuan"))return false;}
  else if(f.st==="menunggu"){if(st!=="Menunggu")return false;}
  else if(f.st==="diterapkan"){if(st!=="Diterapkan")return false;}
  else if(f.st==="sesuai"){if(st!=="Sesuai")return false;}
  else if(f.st==="temuan"){if(st!=="Temuan")return false;}
  else if(f.st==="diabaikan"){if(st!=="Diabaikan")return false;}
  if(f.arah==="kurang"&&!(s<0))return false;if(f.arah==="lebih"&&!(s>0))return false;if(f.arah==="sama"&&s!==0)return false;
  var mu=Number(String(f.minU).replace(",","."));if(f.minU!==""&&!isNaN(mu)&&Math.abs(s)<mu)return false;
  var mr=Number(String(f.minRp).replace(/[^\d.,-]/g,"").replace(/\./g,"").replace(",","."));if(f.minRp!==""&&!isNaN(mr)){if(x.nilai==null||Math.abs(x.nilai)<mr)return false;}
  if(f.rak&&String(x.rak||"")!==f.rak)return false;
  if(f.oleh&&String(x.oleh||"")!==f.oleh)return false;
  if(f.q){var h=(x.nama+" "+x.kode+" "+(x.rak||"")).toLowerCase(),t=f.q.toLowerCase().split(/\s+/).filter(Boolean);for(var i=0;i<t.length;i++)if(h.indexOf(t[i])<0)return false;}
  return true;
}
function opRingkas(rows){
  var o={n:0,sesuai:0,sel:0,kurang:0,lebih:0,uK:0,uL:0,nK:0,nL:0,tanpaHarga:0,temuan:0,tak:0,nTak:0};
  rows.forEach(function(x){
    if(x.status==="Temuan"){o.temuan++;return;}
    if(x.status==="Belum diketahui"){o.tak++;o.nTak+=x.nilaiStok||0;return;}
    o.n++;if(x.selisih===0){o.sesuai++;return;}
    o.sel++;
    if(x.selisih<0){o.kurang++;o.uK+=-x.selisih;if(x.nilai!=null)o.nK+=-x.nilai;else o.tanpaHarga++;}
    else{o.lebih++;o.uL+=x.selisih;if(x.nilai!=null)o.nL+=x.nilai;else o.tanpaHarga++;}

}
function opRekap(rows,kunci,label){

    R.push([sb,t.minus,t.plus,t.bersih,t.nMinus,t.nPlus,t.nBersih,t.barang,t.tanpaHarga]);
    g.items.forEach(function(i){if(i.tanpaHarga)TH.push([sb,i.kode,i.nama,i.minus,i.plus,i.bersih]);});
    L.push({n:"Dampak "+sb,rows:[["Kode","Nama","Dipotong","Ditambah","Bersih","Harga","Harga perkiraan?","Nilai dipotong","Nilai ditambah","Nilai bersih"]].concat(g.items.map(function(i){return [i.kode,i.nama,i.minus,i.plus,i.bersih,i.harga==null?"":i.harga,i.est?"ya":"",i.nMinus,i.nPlus,i.nBersih];})),w:[14,36,10,10,10,12,12,14,14,14]});});
  R.push([]);R.push(["Kekurangan tidak bisa dipotong (unit)",d.tidakTerpotong]);R.push(["Sesi",(d.sesi||[]).join(", ")]);R.push(["Filter",opDampakKet()]);R.push(["Diunduh",new Date().toLocaleString("id-ID")]);
  var sh=[{n:"Ringkasan",rows:R,w:[34,14,14,14,18,18,18,16,14]}].concat(L);
  if(TH.length>1)sh.push({n:"Belum ada harga",rows:TH,w:[12,14,36,12,12,12]});
  if(unduhBanyak("dampak_opname_"+tglIso(new Date())+".xlsx",sh))toast("Laporan dampak siap diunduh"+(TH.length>1?" (ada lembar barang belum berharga).":"."));
}
function unduhBanyak(nama,lembar){
  if(typeof XLSX==="undefined"){toast("Pembaca Excel belum termuat.",true);return false;}
  var wb=XLSX.utils.book_new();lembar.forEach(function(l){var ws=XLSX.utils.aoa_to_sheet(l.rows);if(l.w)ws["!cols"]=l.w.map(function(w){return {wch:w};});XLSX.utils.book_append_sheet(wb,ws,String(l.n).slice(0,31));});
  XLSX.writeFile(wb,nama);return true;
}
