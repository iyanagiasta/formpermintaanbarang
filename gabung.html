<!DOCTYPE html>
<html lang="id">
<head><link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta charset="utf-8">
<script src="ukur.js?v=59"></script><script src="akses.js?v=59"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Gabung PDF - Gudang SCTK</title>
<style>
:root{--navy:#17588f;--gold:var(--accent,#1a6cab);--bg:#eef3f6;--ink:#0d1f2d;--card:#fff;--line:#cfd8de;--mut:#5b7a8c}
@media (prefers-color-scheme:dark){:root{--bg:#0f171c;--ink:#e6eef2;--card:#1a252c;--line:#33444e;--mut:#9db0bc}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}
.top{position:relative;background:#1b6ca8;color:#fff;text-align:center;padding:16px 12px;border-bottom:4px solid var(--gold)}
.top h1{margin:0;font:700 17px Inter,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:1.5px}
.top div{margin-top:4px;font-size:11px;letter-spacing:2px;color:#e8f3fb;font-weight:600}
.homebtn{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#e8f3fb;font:600 12px "Segoe UI",Roboto,Arial,sans-serif;text-decoration:none;border:1px solid rgba(201,221,233,.5);border-radius:8px;padding:7px 11px}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
input,select,textarea{font:14px "Segoe UI",Roboto,Arial,sans-serif;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input.t{width:100%;padding:12px;font-size:16px}
button{font:600 13px "Segoe UI",Roboto,Arial,sans-serif;padding:10px 14px;border:0;border-radius:8px;color:#fff;background:var(--navy);cursor:pointer}
button.gh{background:transparent;color:var(--navy);border:1px solid var(--line)}
@media (prefers-color-scheme:dark){button.gh{color:var(--ink)}}
button:disabled{opacity:.55;cursor:not-allowed}
.msg{text-align:center;padding:18px;color:var(--mut)}.err{color:#a82424}
.fr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.fl{font-size:12px;color:var(--mut)}
.note{font-size:12px;color:var(--mut)}
.bd{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700}.bd.d{background:#d9f0df;color:#14612b}.bd.w{background:#fff3cd;color:#7a5b00}.bd.l{background:#e4e9ec;color:#445}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th.n,td.n{text-align:right}small{display:block;color:var(--mut);font-size:11px}
.chip{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:6px 12px}.chip.on{background:var(--navy);color:#fff}
.act{display:flex;gap:6px}
#toast{display:none;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#14612b;color:#fff;padding:11px 16px;border-radius:9px;z-index:10000;max-width:90%}#toast.bad{background:#a82424}
@media print{.top,.noprint{display:none}}

.drop{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--mut);margin-top:8px}.drop.on{border-color:var(--navy);background:rgba(23,88,143,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{position:relative;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--card)}.pc.seret{opacity:.45}
.pc .no{position:absolute;left:8px;top:8px;background:var(--navy);color:#fff;border-radius:12px;padding:1px 8px;font-size:12px;font-weight:700;z-index:1}
.pc .th{height:150px;display:flex;align-items:center;justify-content:center;background:rgba(127,127,127,.12);border-radius:6px;overflow:hidden}.pc .th img{max-width:100%;max-height:100%;object-fit:contain}
.pc .nm{text-align:left;font-size:12px;margin:6px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pc .nm small{color:var(--mut);white-space:normal}
.pc .bt{display:flex;flex-wrap:wrap;gap:4px}.pc .bt button{padding:6px 8px;font-size:12px;min-width:32px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9000;display:flex;align-items:center;justify-content:center;padding:10px}.ov[hidden]{display:none}
.dlg{background:var(--card);color:var(--ink);border-radius:12px;padding:14px;max-width:760px;width:100%;max-height:96vh;overflow:auto}.dlg h3{margin:0 0 8px}
.wrapc{position:relative;display:block;max-width:100%;margin:0 auto;touch-action:none;user-select:none;line-height:0}.wrapc canvas{width:100%;height:auto;display:block;border:1px solid var(--line)}
.cb{position:absolute;border:2px solid #1a6cab;box-shadow:0 0 0 9999px rgba(0,0,0,.45);cursor:move;display:none;touch-action:none}
.cb .hd{position:absolute;width:20px;height:20px;background:#fff;border:2px solid #1a6cab;border-radius:50%;touch-action:none}
.hd.nw{left:-11px;top:-11px;cursor:nwse-resize}.hd.n{left:calc(50% - 10px);top:-11px;cursor:ns-resize}.hd.ne{right:-11px;top:-11px;cursor:nesw-resize}.hd.e{right:-11px;top:calc(50% - 10px);cursor:ew-resize}
.hd.se{right:-11px;bottom:-11px;cursor:nwse-resize}.hd.s{left:calc(50% - 10px);bottom:-11px;cursor:ns-resize}.hd.sw{left:-11px;bottom:-11px;cursor:nesw-resize}.hd.w{left:-11px;top:calc(50% - 10px);cursor:ew-resize}
.ringkas{margin:4px 0 8px}label{display:inline-flex;gap:6px;align-items:center}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema-halaman.css">
<script src="nama-berkas.js"></script><script src="tema.js"></script>
<link rel="stylesheet" href="gaya-baru.css">
</head>
<body>
<div class="top"><a class="homebtn" href="dashboard.html">&larr; Halaman Utama</a><h1>GABUNG JADI 1 PDF</h1><div>GUDANG - PT SARANA CATUR TIRTA KELOLA</div></div>
<div class="wrap" id="app"></div>
<div id="toast"></div>
<script src="gabung-pdf.js"></script><script src="gabung-ui.js"></script>
<script>
var API_URL="https://script.google.com/macros/s/AKfycbyVPrhw3xmk8D-73kgZQlesBB_1M6-Pc6vv3IUFMpa8jZx9bZmfGhzf_IFjKe3ZuYOMVw/exec";
var KODE="",MODE="kode",ADMINMODE=false,app=document.getElementById("app");
function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function toast(m,bad){var t=document.getElementById("toast");t.textContent=m;t.className=bad?"bad":"";t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none";},4500);}
function simpan(v){try{if(v)localStorage.setItem("sctk_pic",v);else localStorage.removeItem("sctk_pic");}catch(e){}}
function baca(){try{return localStorage.getItem("sctk_pic")||"";}catch(e){return "";}}
function simpanPin(v){try{if(v)sessionStorage.setItem("sctk_admin",v);else sessionStorage.removeItem("sctk_admin");}catch(e){}}
function bacaPin(){try{return sessionStorage.getItem("sctk_admin")||"";}catch(e){return "";}}
async function api(b){
  if(MODE==="pin")b.pin=KODE;else b.kode=KODE;
  var r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)});
  return await r.json();
}
function loginView(msg){
  app.innerHTML='<div class="card" style="max-width:380px;margin:30px auto"><p style="margin-top:0"><b id="jd">Kode akses Staff Gudang</b></p><div class="note" style="margin-bottom:8px">Menggabungkan foto, PDF, dan Excel menjadi satu PDF. Khusus Staff Gudang dan admin.</div>'+
   '<input class="t" id="kd" type="password" autocomplete="off" placeholder="Kode akses"><div style="height:10px"></div>'+
   '<button id="go" style="width:100%">Masuk</button><p style="text-align:center;margin:10px 0 0"><button type="button" class="gh" id="adm" style="border:0;text-decoration:underline;padding:4px">Saya admin (pakai PIN)</button></p><p class="err" id="lerr" style="margin:10px 0 0">'+esc(msg||"")+'</p></div>';
  var tg=document.getElementById("adm");tg.onclick=function(){ADMINMODE=!ADMINMODE;document.getElementById("kd").placeholder=ADMINMODE?"PIN admin":"Kode akses";document.getElementById("jd").textContent=ADMINMODE?"PIN admin":"Kode akses Staff Gudang";tg.textContent=ADMINMODE?"Saya Staff Gudang (pakai kode)":"Saya admin (pakai PIN)";document.getElementById("kd").value="";document.getElementById("lerr").textContent="";document.getElementById("kd").focus();};
  var i=document.getElementById("kd");i.focus();i.onkeydown=function(e){if(e.key==="Enter")masuk();};document.getElementById("go").onclick=masuk;
}
async function masuk(){
  var v=document.getElementById("kd").value.trim();if(!v)return;
  var b=document.getElementById("go");b.disabled=true;KODE=v;MODE=ADMINMODE?"pin":"kode";
  var r;try{r=await api({action:"tandaList"});}catch(e){b.disabled=false;document.getElementById("lerr").textContent="Tidak bisa terhubung. Periksa internet.";return;}
  if(!r.ok){KODE="";MODE="kode";b.disabled=false;document.getElementById("lerr").textContent=r.msg||"Kode tidak dikenali. Periksa lagi atau minta ke admin gudang.";return;}
  if(MODE==="pin")simpanPin(v);else simpan(v);mulai();
}
function mulai(){
  app.innerHTML='<div class="noprint" style="text-align:right;margin-bottom:6px"><button class="gh" id="kel">Keluar</button></div><div id="isi"></div>';
  document.getElementById("kel").onclick=function(){if(MODE==="pin")simpanPin("");else simpan("");KODE="";MODE="kode";loginView("");};
  GPUI.mount(document.getElementById("isi"));
}
(async function(){var p=bacaPin();if(p){KODE=p;MODE="pin";var r0;try{r0=await api({action:"tandaList"});}catch(e){r0=null;}if(r0&&r0.ok){mulai();return;}KODE="";MODE="kode";}
  var k=baca();if(k){KODE=k;var r;try{r=await api({action:"tandaList"});}catch(e){r=null;}if(r&&r.ok){mulai();return;}KODE="";}loginView("");})();
</script>
</body>
</html>
