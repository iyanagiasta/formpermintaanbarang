<!DOCTYPE html>
<html lang="id">
<head><link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mutasi Gudang - SCTK</title>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--navy:#17588f;--gold:var(--accent,#1a6cab);--bg:#eef3f6;--ink:#0d1f2d;--card:#fff;--line:#cfd8de;--mut:#4a5b68;--red:#a82424;--grn:#14602f}
@media (prefers-color-scheme:dark){:root{--bg:#0f171c;--ink:#e6eef2;--card:#1a252c;--line:#33444e;--mut:#9db0bc;--red:#ff9a9a;--grn:#8fdca8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:15px}
.top{background:#1b6ca8;color:#fff;text-align:center;padding:18px 12px;border-bottom:4px solid var(--gold)}
.top h1{margin:0;font:700 18px Inter,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:1.5px}
.top div{margin-top:4px;font-size:12px;letter-spacing:2px;color:#e8f3fb;font-weight:600}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.mut{color:var(--mut);font-size:13px}
.sum{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.sum div{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:10px}
.sum b{display:block;font-size:20px}.sum span{color:var(--mut);font-size:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
th{background:var(--navy);color:#fff;padding:6px;text-align:left;font-weight:600;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:6px;vertical-align:top}
.nm{text-align:right;white-space:nowrap}
td small{display:block;color:var(--mut);font-size:12px}
h2{font-size:16px;margin:18px 0 6px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
button{font:700 14px "Segoe UI",Roboto,Arial,sans-serif;padding:10px 16px;border:0;border-radius:8px;color:#fff;background:var(--navy);cursor:pointer}
button.gh{background:transparent;color:var(--navy);border:1px solid var(--navy)}
@media (prefers-color-scheme:dark){button.gh{color:#9fd0f2;border-color:#9fd0f2}}
.msg{text-align:center;font-size:17px;padding:26px 10px}
.msg.err{color:var(--red)}
@media (max-width:640px){.wrap{padding:10px}.sum b{font-size:17px}}
@media print{.btns,.noprint{display:none}body{background:#fff}}
</style>
<link rel="stylesheet" href="tema-halaman.css">
<script src="tema.js"></script>
<link rel="stylesheet" href="gaya-baru.css">
</head>
<body>
<div class="top"><h1>MUTASI GUDANG</h1><div>PT SARANA CATUR TIRTA KELOLA</div></div>
<div class="wrap" id="app"><div class="msg">Memuat data mutasi...</div></div>
<script>
var API_URL="https://script.google.com/macros/s/AKfycbyVPrhw3xmk8D-73kgZQlesBB_1M6-Pc6vv3IUFMpa8jZx9bZmfGhzf_IFjKe3ZuYOMVw/exec";
var q=new URLSearchParams(location.search),T=(q.get("t")||"").trim(),app=document.getElementById("app"),R=null;
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fq(n){return String(Math.round(Number(n)*100)/100).replace(".",",");}
function rp(n){return n==null?"-":"Rp "+Math.round(n).toLocaleString("id-ID");}
function tg(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||""));return m?m[3]+"/"+m[2]+"/"+m[1]:String(s||"");}
async function api(b){var r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)});return await r.json();}
function pc(o){return o.persen==null?"-":(o.persen>=0?"&#9650; +":"&#9660; ")+o.persen+"%";}
function tabel(kep,baris,rata){return '<div class="tw"><table><thead><tr>'+kep.map(function(k,i){return '<th'+(rata.indexOf(i)>=0?' class="nm"':'')+'>'+k+'</th>';}).join("")+'</tr></thead><tbody>'+baris.join("")+'</tbody></table></div>';}
function render(){
  var d=R.data,f=R.filter,h="";
  var lab=[];if(f.jenis)lab.push("jenis "+f.jenis);if(f.arah)lab.push(f.arah==="keluar"?"hanya barang keluar":"hanya barang masuk");if(f.sumber)lab.push("sumber "+f.sumber);if(f.dept)lab.push("departemen "+f.dept);if(f.proyek)lab.push("proyek "+f.proyek);
  h+='<div class="card"><b>'+esc(R.label||"Mutasi gudang")+'</b><div class="mut">Periode '+tg(f.dari)+' s.d. '+tg(f.sampai)+(f.otomatis?' (bulan berjalan, ikut berubah tiap bulan)':'')+(lab.length?' &middot; '+esc(lab.join(", ")):'')+' &middot; data per '+esc(R.dibuat)+' &middot; tautan berlaku sampai '+esc(R.berlaku)+'</div><p style="margin:8px 0 0">'+esc(R.ringkasan)+'</p></div>';
  h+='<div class="sum"><div><b>'+d.total+'</b><span>Catatan mutasi</span></div><div><b>'+rp(d.nilaiKeluar)+'</b><span>Nilai barang keluar (serah)</span></div><div><b>'+rp(d.nilaiMasuk)+'</b><span>Nilai barang masuk</span></div><div><b>'+rp(d.nilaiPenyesuaian)+'</b><span>Penyesuaian bersih</span></div></div>';
  if(R.banding){var b=R.banding;h+='<div class="card"><b>Dibanding periode sebelumnya</b> <span class="mut">('+tg(b.dari)+' s.d. '+tg(b.sampai)+')</span>'+tabel(["","Sekarang","Sebelumnya","Perubahan"],[["Jumlah catatan",b.n,fq],["Nilai barang keluar",b.keluar,rp],["Nilai barang masuk",b.masuk,rp]].map(function(x){return '<tr><td>'+x[0]+'</td><td class="nm">'+x[2](x[1].sekarang)+'</td><td class="nm">'+x[2](x[1].lalu)+'</td><td class="nm">'+pc(x[1])+'</td></tr>';}),[1,2,3])+'</div>';}
  h+='<div class="btns"><button id="bx">Unduh Excel</button><button class="gh" id="bp">Cetak</button></div>';
  [["dept","Per departemen","Departemen"],["proyek","Per proyek / PPBJ","Proyek / PPBJ"],["barang","Per barang","Barang"]].forEach(function(g){
    var L=(d.rekap||{})[g[0]]||[];if(!L.length)return;
    h+='<h2>'+g[1]+'</h2>'+tabel([g[2],"Catatan","Qty bersih","Nilai bersih"],L.slice(0,15).map(function(x){return '<tr><td>'+esc(x.k)+'</td><td class="nm">'+x.n+'</td><td class="nm">'+fq(x.qty)+'</td><td class="nm">'+rp(x.nilai)+'</td></tr>';}),[1,2,3]);
  });
  h+='<h2>Rincian transaksi</h2>'+(d.data.length?tabel(["Waktu","Barang","Jenis","Sumber","Qty","Nilai","Referensi / Dept / Proyek"],d.data.map(function(m){return '<tr><td>'+esc(m.waktu)+'</td><td><b>'+esc(m.nama)+'</b><small>'+esc(m.kode)+'</small></td><td>'+esc(m.jenis)+'</td><td>'+esc(m.sumber)+'</td><td class="nm"><b style="color:'+(m.qty<0?"var(--red)":"var(--grn)")+'">'+(m.qty>0?"+":"")+fq(m.qty)+'</b></td><td class="nm">'+(m.nilai!=null?rp(m.nilai):"-")+'</td><td>'+esc(m.ref)+'<small>'+esc(m.dept)+(m.proyek?' &middot; '+esc(m.proyek):'')+'</small></td></tr>';}),[4,5]):'<div class="card msg">Tidak ada transaksi pada periode ini.</div>')+
    '<div class="mut" style="margin-top:8px">'+(d.total>d.data.length?'Menampilkan '+d.data.length+' dari '+d.total+' catatan terbaru; Excel memuat yang ditampilkan. ':'')+'Halaman ini hanya untuk dibaca. Nilai memakai harga saat transaksi; tanda perkiraan tidak ditampilkan di sini. Stok Bekas tidak dinilai.</div>';
  app.innerHTML=h;
  document.getElementById("bp").onclick=function(){window.print();};
  document.getElementById("bx").onclick=function(){
    if(typeof XLSX==="undefined"){alert("Pembaca Excel belum termuat. Periksa internet lalu muat ulang.");return;}
    var ws1=XLSX.utils.aoa_to_sheet([["Mutasi Gudang - PT Sarana Catur Tirta Kelola"],["Periode",tg(f.dari)+" s.d. "+tg(f.sampai)],[R.ringkasan],[],["Catatan",d.total],["Nilai barang keluar",d.nilaiKeluar],["Nilai barang masuk",d.nilaiMasuk],["Penyesuaian bersih",d.nilaiPenyesuaian]]);
    var rows=[["Waktu","Kode","Nama","Jenis","Sumber","Qty","Harga","Nilai","Saldo","Referensi","Departemen","Proyek","Keterangan"]].concat(d.data.map(function(m){return [m.waktu,m.kode,m.nama,m.jenis,m.sumber,m.qty,m.harga==null?"":m.harga,m.nilai==null?"":m.nilai,m.saldo,m.ref,m.dept,m.proyek,m.ket];}));
    var ws2=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws1,"Ringkasan");XLSX.utils.book_append_sheet(wb,ws2,"Rincian");
    [["dept","Per Departemen"],["proyek","Per Proyek"],["barang","Per Barang"]].forEach(function(g){var L=(d.rekap||{})[g[0]]||[];XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([[g[1],"Catatan","Qty Bersih","Nilai Bersih"]].concat(L.map(function(x){return [x.k,x.n,x.qty,x.nilai];}))),g[1]);});
    XLSX.writeFile(wb,"mutasi_gudang_"+f.dari+"_sd_"+f.sampai+".xlsx");};
}
(async function(){
  if(!T){app.innerHTML='<div class="card msg err">Tautan tidak lengkap. Minta tautan baru ke Gudang.</div>';return;}
  try{var r=await api({action:"mutasiPublik",t:T});
    if(!r.ok){app.innerHTML='<div class="card msg err">'+esc(r.msg||"Tautan tidak dapat dibuka.")+'</div>';return;}
    R=r;render();
  }catch(e){app.innerHTML='<div class="card msg err">Gagal terhubung ke server. Coba lagi sebentar.</div>';}
})();
</script>
</body>
</html>
