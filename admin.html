<style>
:root{--navy:#0a2a43;--gold:#b8975a;--bg:#eef3f6;--ink:#0d1f2d;--card:#fff;--line:#cfd8de;--mut:#5b7a8c}
@media (prefers-color-scheme:dark){:root{--bg:#0f171c;--ink:#e6eef2;--card:#1a252c;--line:#33444e;--mut:#9db0bc}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}
.top{background:linear-gradient(120deg,#06203a,#0a3a5c 55%,#0f6f93);color:#fff;text-align:center;padding:16px 12px;border-bottom:4px solid var(--gold)}
.top h1{margin:0;font:700 17px Georgia,serif;letter-spacing:1.5px}
.top div{margin-top:4px;font-size:11px;letter-spacing:2px;color:#e3c98f;font-weight:600}
.wrap{max-width:1180px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
input.t{width:100%;padding:11px;font:600 15px "Segoe UI",Roboto,Arial,sans-serif;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
button{font:600 13px "Segoe UI",Roboto,Arial,sans-serif;padding:8px 11px;border:0;border-radius:8px;color:#fff;background:var(--navy);cursor:pointer}
button:disabled{opacity:.5;cursor:default}

@media (prefers-color-scheme:dark){button.gh{color:var(--ink)}}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chip{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:6px 12px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.bar input{flex:1;min-width:150px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}

.sum b{display:block;font-size:22px}.sum span{color:var(--mut);font-size:12px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{background:var(--navy);color:#fff;text-align:left;padding:9px 8px;font-size:12px;letter-spacing:.3px}
td{border-top:1px solid var(--line);padding:9px 8px;vertical-align:top}
td small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.bd{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700}
.bd.n{background:#e8f1f6;color:#0a2a43}.bd.w{background:#fff3cd;color:#7a5b00}.bd.b{background:#f8d7da;color:#8a1c28}.bd.d{background:#d9f0df;color:#14612b}.bd.r{background:#e6e6e6;color:#444}
.act{display:flex;flex-direction:column;gap:6px;min-width:150px}
.ppi{display:flex;gap:5px;margin-top:6px}.ppi input{width:110px;padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
.msg{text-align:center;padding:22px;color:var(--mut)}
.err{color:#c0392b}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0a2a43;color:#fff;padding:11px 16px;border-radius:10px;max-width:92vw;display:none;z-index:9;font-weight:600}
#toast.bad{background:#c0392b}
@media (max-width:820px){
 table,thead,tbody,tr,td{display:block}thead{display:none}
 tr{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card);padding:6px 4px}
 td{border:0;padding:5px 10px}
 td[data-l]:before{content:attr(data-l);display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
 .act{flex-direction:row;flex-wrap:wrap}
}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:8px 16px}
.tabs button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.fr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.fr select,.fr input[type=text],.fr input[type=number]{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.fr label.fl{font-size:12px;color:var(--mut)}
.nm{text-align:right;white-space:nowrap}
.note{color:var(--mut);font-size:12px;margin:4px 0}
.bd.a{background:#d9f0df;color:#14612b}.bd.s{background:#fff3cd;color:#7a5b00}.bd.l{background:#e6e6e6;color:#444}
.top{position:relative}.homebtn{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#e3c98f;font:600 12px "Segoe UI",Roboto,Arial,sans-serif;text-decoration:none;border:1px solid rgba(227,201,143,.55);border-radius:8px;padding:7px 11px;letter-spacing:0}.homebtn:hover,.homebtn:focus-visible{background:rgba(255,255,255,.12);outline:none}@media (max-width:640px){.top{padding-top:50px}.homebtn{top:10px;transform:none}}

<body>
<div class="top"><a class="homebtn" href="dashboard.html">&larr; Halaman Utama</a><h1>ADMIN GUDANG</h1><div>PANTAUAN NO BPB - PT SARANA CATUR TIRTA KELOLA</div></div>
<div class="wrap" id="app"></div>
<div id="toast"></div>
<script>
var API_URL="https://script.google.com/macros/s/AKfycbyVPrhw3xmk8D-73kgZQlesBB_1M6-Pc6vv3IUFMpa8jZx9bZmfGhzf_IFjKe3ZuYOMVw/exec";
var PDEPT=[],TAB="pantau",STOK=[],SUMB=["Bekas","Moka","Accurate"],PRO=[],PST=[],PIN="",MODE="belum",DATA=[],BUSY=false,SEMUA=false;
var app=document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function toast(m,bad){var t=document.getElementById("toast");t.textContent=m;t.className=bad?"bad":"";t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none";},4500);}
async function api(b){
  b.pin=PIN;
  var r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)});
  return await r.json();
}
function loginView(msg){
  app.innerHTML='<div class="card" style="max-width:380px;margin:30px auto"><p style="margin-top:0"><b>Masuk sebagai Admin Gudang</b></p>'+
   '<input class="t" id="pin" type="password" autocomplete="off" placeholder="Kode admin"><div style="height:10px"></div>'+
   '<button id="go" style="width:100%;padding:11px">Masuk</button><p class="err" id="lerr" style="margin:10px 0 0">'+esc(msg||"")+'</p></div>';
  var i=document.getElementById("pin");i.focus();
  i.onkeydown=function(e){if(e.key==="Enter")login();};
  document.getElementById("go").onclick=login;
}
async function login(){
  var v=document.getElementById("pin").value.trim();if(!v)return;
  PIN=v;document.getElementById("go").disabled=true;
  await load(true);
}
async function load(first){
  try{
    var r=await api({action:"adminList",semua:SEMUA});
    if(!r.ok){PIN="";try{sessionStorage.removeItem("sctk_admin")}catch(e){}loginView(r.msg||"Gagal masuk.");return;}
    DATA=r.data||[];try{sessionStorage.setItem("sctk_admin",PIN)}catch(e){}
    var h=(location.hash||"").replace("#","");
    if(first&&h&&h!=="pantau"&&["serah","stok","proyek","mutasi","opname","laporan","sistem","pengumuman","terima","pengajuan","accurate","masterbarang","komparasi"].indexOf(h)>=0){goTab(h);return;}
    draw(r.now);paMuatRingkas();
  }catch(e){
    if(first)loginView("Gagal terhubung ke server. Periksa internet lalu coba lagi.");else toast("Gagal terhubung ke server.",true);
  }
}
function lamaTxt(jam){if(!jam)return "";return jam<24?Math.max(Math.round(jam),1)+" jam":(jam/24).toFixed(1).replace(".",",")+" hari";}
function statusBd(d){
  if(d.ditolak)return '<span class="bd r">Ditolak</span>';
  if(d.selesai)return '<span class="bd d">Siap Diserahkan</span>';
  var c=d.jam>=48?"b":d.jam>=24?"w":"n";
  return '<span class="bd '+c+'">'+esc(d.status)+'</span><small>Menunggu: <b>'+esc(d.menunggu?d.menunggu.nama:"-")+'</b> ('+esc(lamaTxt(d.jam))+')</small>';
}
function filtered(){
  var q=(document.getElementById("q")||{value:""}).value.trim().toLowerCase();
  return DATA.filter(function(d){
    if(MODE==="setuju"&&!d.menunggu)return false;
    if(MODE==="ppbj"&&!d.ppbjBelum)return false;
    if(q){var h=(d.doc+" "+d.id+" "+d.by+" "+(d.pic||"")+" "+d.dept+" "+d.status+" "+(d.menunggu?d.menunggu.nama:"")+" "+d.ppbj).toLowerCase();if(h.indexOf(q)<0)return false;}
    return true;
  });
}
function draw(now){
  var nSet=DATA.filter(function(d){return d.menunggu;}).length,nPp=DATA.filter(function(d){return d.ppbjBelum;}).length,nLate=DATA.filter(function(d){return d.menunggu&&d.jam>=24;}).length;
  var q=(document.getElementById("q")||{}).value||"";
  tabsUI();
  pane().innerHTML=
   '<div class="sum"><div><b>'+nSet+'</b><span>Menunggu persetujuan</span></div><div><b>'+nLate+'</b><span>Menunggu 24 jam atau lebih</span></div><div><b>'+nPp+'</b><span>PPBJ belum ada</span></div></div>'+
   '<div class="bar">'+
   [["belum","Belum lengkap"],["setuju","Menunggu persetujuan"],["ppbj","PPBJ belum ada"],["semua","Semua"]].map(function(c){var on=(c[0]==="semua"?SEMUA:(!SEMUA&&MODE===c[0]));return '<button class="chip'+(on?" on":"")+'" data-chip="'+c[0]+'">'+c[1]+'</button>';}).join("")+
   '<input id="q" placeholder="Cari No BPB, pemohon, PIC, departemen..." value="'+esc(q)+'"><button class="rm" id="rkgo">Rekap PPBJ per PIC</button><button class="gh" id="rf">Segarkan</button><button class="gh" id="lo">Keluar</button></div>'+
   '<div id="tb"></div><p style="color:var(--mut);font-size:12px">Diperbarui: '+esc(now||"")+'. Pengingat otomatis dikirim tiap pagi (persetujuan: menunggu 24 jam atau lebih; PPBJ: sejak hari ke-3).</p>';
  drawRows();
  document.getElementById("q").oninput=drawRows;
  document.getElementById("rf").onclick=function(){load(false);};
  document.getElementById("rkgo").onclick=loadRekap;
  document.getElementById("lo").onclick=function(){PIN="";try{sessionStorage.removeItem("sctk_admin")}catch(e){}loginView("");};
  pane().querySelectorAll("[data-chip]").forEach(function(b){b.onclick=function(){
    var k=b.getAttribute("data-chip");
    if(k==="semua"){SEMUA=true;MODE="belum";}else{SEMUA=false;MODE=k;}
    load(false);
  };});
}
function drawRows(){
  var rows=filtered(),box=document.getElementById("tb");
  if(!rows.length){box.innerHTML='<div class="card msg">Tidak ada data untuk ditampilkan.</div>';return;}
  box.innerHTML='<table><thead><tr><th>No BPB</th><th>Pemohon / PIC</th><th>Status</th><th>PPBJ</th><th>Pengingat terakhir</th><th>Aksi</th></tr></thead><tbody>'+rows.map(function(d){
    var pp=d.ppbjBelum
      ?'<span class="bd b">BELUM ADA</span><small>sejak '+d.hariKirim+' hari lalu</small><div class="ppi"><input placeholder="No PPBJ" maxlength="60" data-no="'+esc(d.id)+'"><button class="sv" data-act="ppbj" data-id="'+esc(d.id)+'">Simpan</button></div>'
      :(d.ditolak?'<small>-</small>':'<b>'+esc(d.ppbj)+'</b>'+(SEMUA?'<small><a href="#" data-act="ubah" data-id="'+esc(d.id)+'">ubah</a></small>':''));
    var last=[];if(d.follow)last.push("Persetujuan: "+esc(d.follow));if(d.pingatPpbj)last.push("PPBJ: "+esc(d.pingatPpbj));
    var acts="";
    if(d.menunggu)acts+='<button class="rm" data-act="remind" data-jenis="persetujuan" data-id="'+esc(d.id)+'">Kirim pengingat persetujuan</button>';
    if(d.ppbjBelum)acts+='<button class="rm" data-act="remind" data-jenis="ppbj" data-id="'+esc(d.id)+'">Kirim pengingat PPBJ</button>';
    return '<tr><td data-l="No BPB"><b>'+esc(d.doc||d.id)+'</b><small>'+esc(d.kirim)+'</small><small>'+esc(d.barang)+'</small></td>'+
      '<td data-l="Pemohon">'+esc(d.by)+'<small>'+esc(d.dept)+'</small>'+(d.pic?'<small>PIC: <b>'+esc(d.pic)+'</b></small>':"")+'</td>'+
      '<td data-l="Status">'+statusBd(d)+'</td><td data-l="PPBJ">'+pp+'</td>'+
      '<td data-l="Pengingat terakhir"><small style="margin:0">'+(last.join("<br>")||"-")+'</small></td>'+
      '<td data-l="Aksi"><div class="act">'+(acts||'<small>-</small>')+'</div></td></tr>';
  }).join("")+'</tbody></table>';
  box.querySelectorAll("[data-act]").forEach(function(b){b.onclick=function(e){e.preventDefault();onAct(b);};});
}
async function onAct(b){
  if(BUSY)return;
  var act=b.getAttribute("data-act"),id=b.getAttribute("data-id"),d=DATA.filter(function(x){return x.id===id;})[0]||{},body;
  if(act==="remind"){
    var j=b.getAttribute("data-jenis");
    var kpd=j==="persetujuan"?(d.menunggu?d.menunggu.nama:"approver"):"peminta (bila email diisi, jika tidak ke atasan departemen "+d.dept+")";
    if(!confirm("Kirim pengingat "+(j==="persetujuan"?"persetujuan":"PPBJ")+" untuk "+(d.doc||id)+" ke "+kpd+(j==="persetujuan"?". Salinan informasi juga dikirim ke Iyan dan Manager Gudang.":", CC atasan dan Gudang.")))return;
    body={action:"adminRemind",id:id,jenis:j};
  }else if(act==="ppbj"){
    var inp=document.querySelector('[data-no="'+id+'"]'),no=inp?inp.value.trim():"";
    if(!no){toast("Isi Nomor PPBJ dulu.",true);return;}
    if(!confirm("Simpan Nomor PPBJ "+no+" untuk "+(d.doc||id)+"? Pengingat PPBJ akan berhenti."))return;
    body={action:"adminPpbj",id:id,no:no};
  }else if(act==="ubah"){
    var no2=prompt("Nomor PPBJ baru untuk "+(d.doc||id)+":",d.ppbj||"");
    if(no2===null||!no2.trim())return;
    body={action:"adminPpbj",id:id,no:no2.trim(),timpa:true};
  }else return;
  BUSY=true;b.disabled=true;
  try{
    var r=await api(body);
    toast(r.msg||(r.ok?"Berhasil.":"Gagal."),!r.ok);
    if(r.ok)await load(false);
  }catch(e){toast("Gagal terhubung ke server.",true);}
  BUSY=false;b.disabled=false;
}

function pane(){return document.getElementById("pane")||app;}
function tabsUI(){
  if(!document.getElementById("pane"))app.innerHTML='<div class="tabs" id="tabs"></div><div id="pane"></div>';
  document.getElementById("tabs").innerHTML=[["pantau","Pantauan BPB"],["serah","Serah Barang"],["stok","Stok & Harga"],["opname","Selisih Opname"],["proyek","Proyek"],["mutasi","Mutasi"],["laporan","Laporan"],["accurate","Accurate"],["realisasi","Realisasi"],["pembelian","Pembelian"],["label","Label"],["masterbarang","Master Barang"],["komparasi","Komparasi"],["terima","Terima Barang"],["pengajuan","Pengajuan"],["pengumuman","Pengumuman"],["sistem","Sistem"]].map(function(t){return '<button class="'+(TAB===t[0]?"on":"")+'" data-tab="'+t[0]+'">'+t[1]+'</button>';}).join("");
  paBadge();
  document.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){goTab(b.getAttribute("data-tab"));};});
}
function goTab(t){
  if(t==="realisasi"){location.href="realisasi.html";return;}
  if(t==="pembelian"){location.href="pengadaan.html";return;}
  if(t==="label"){location.href="label.html";return;}
  TAB=t;
  if(t==="pantau"){load(false);return;}
  tabsUI();
  if(t==="masterbarang")loadMB();else if(t==="komparasi")drawKP();else if(t==="stok")loadStok();else if(t==="proyek")loadProyek();else if(t==="serah")loadSerah();else if(t==="mutasi")loadMutasi();else if(t==="opname")loadOpname();else if(t==="laporan")loadLaporan();else if(t==="accurate")loadAccurate();else if(t==="sistem")loadSistem();else if(t==="pengumuman")loadPengumuman();else if(t==="terima")loadTerima();else if(t==="pengajuan")loadPengajuan();
  try{history.replaceState(null,"","#"+t);}catch(e){}
}
function fmtN(n){n=Number(n)||0;return (Math.round(n*100)/100).toString().replace(".",",");}
function rp(n){return n==null?"-":"Rp "+Math.round(n).toLocaleString("id-ID");}
/* ---- baca file Excel/CSV ---- */
function bacaFile(file,cb){
  if(typeof XLSX==="undefined"){toast("Pembaca Excel belum termuat. Periksa internet lalu muat ulang halaman.",true);return;}
  var fr=new FileReader();
  fr.onload=function(ev){
    try{
      var wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"}),ws=wb.Sheets[wb.SheetNames[0]];
      var a=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false});
      cb(a);
    }catch(e){toast("File tidak bisa dibaca. Gunakan .xlsx atau .csv.",true);}
  };
  fr.readAsArrayBuffer(file);
}
function unduhXlsx(nama,lembar,baris,lebar){
  if(typeof XLSX==="undefined"){toast("Pembaca Excel belum termuat.",true);return false;}
  var ws=XLSX.utils.aoa_to_sheet(baris);if(lebar)ws["!cols"]=lebar.map(function(w){return {wch:w};});
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,String(lembar).slice(0,31));XLSX.writeFile(wb,nama);return true;
}
function petaKolom(a){
  var hi=-1,m={};
  for(var i=0;i<Math.min(a.length,10);i++){
    var h=a[i].map(function(x){return String(x).toLowerCase().trim();}),t={};
    h.forEach(function(x,j){
      if(t.kode==null&&/kode/.test(x))t.kode=j;
      else if(t.nama==null&&/nama|uraian|deskripsi|barang/.test(x))t.nama=j;
      else if(t.satuan==null&&/satuan|sat\b|unit|uom/.test(x))t.satuan=j;
      else if(t.qty==null&&/qty|stok|stock|jumlah|saldo|kuantitas/.test(x))t.qty=j;
      else if(t.harga==null&&/harga|price/.test(x))t.harga=j;
    });
    if(t.kode!=null){hi=i;m=t;break;}
  }
  if(hi<0)return {hi:-1,m:{kode:0,nama:1,satuan:2,qty:3,harga:3}};
  return {hi:hi,m:m};
}
function ambil(a,mode){
  var p=petaKolom(a),out=[];
  for(var i=p.hi+1;i<a.length;i++){
    var r=a[i],k=String(r[p.m.kode]==null?"":r[p.m.kode]).trim();if(!k)continue;
    var o={kode:k,nama:p.m.nama!=null?String(r[p.m.nama]||"").trim():"",satuan:p.m.satuan!=null?String(r[p.m.satuan]||"").trim():""};
    if(mode==="harga"){if(p.m.harga==null)return {err:"Kolom Harga tidak ditemukan. Beri judul kolom 'Harga'."};o.harga=r[p.m.harga];}
    else{if(p.m.qty==null)return {err:"Kolom Qty tidak ditemukan. Beri judul kolom 'Qty' atau 'Stok'."};o.qty=r[p.m.qty];}
    out.push(o);
  }
  return {rows:out,adaJudul:p.hi>=0};
}
/* ---- tab Stok & Harga ---- */
async function loadStok(){
  var q=(document.getElementById("sq")||{}).value||"",hs=document.getElementById("hs")?document.getElementById("hs").checked:true;
  pane().innerHTML='<div class="card msg">Memuat...</div>';
  try{
    var r=await api({action:"adminStokList",q:q,hanyaStok:hs,limit:100});
    if(!r.ok){toast(r.msg||"Gagal.",true);return;}
    STOK=r.data||[];SUMB=r.sumber||SUMB;drawStok(r.total,q,hs);
  }catch(e){toast("Gagal terhubung ke server.",true);}
}
function drawStok(total,q,hs){
  var opt=SUMB.map(function(s){return '<option>'+esc(s)+'</option>';}).join("");
  pane().innerHTML=
   '<div class="card"><b>Unggah stok dari Excel / CSV</b><div class="note">Kolom: Kode Barang, Nama, Satuan, Qty (judul kolom dikenali otomatis). Satu file untuk satu sumber.</div>'+
   '<div class="fr"><select id="us">'+opt+'</select><input type="file" id="uf" accept=".xlsx,.xls,.csv">'+

function lamaBaca(file,cb){
  if(typeof XLSX==="undefined"){toast("Pembaca Excel belum termuat. Periksa internet lalu muat ulang halaman.",true);return;}
  var fr=new FileReader();
  fr.onload=function(ev){

      var wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array",cellDates:true}),ws=wb.Sheets[wb.SheetNames[0]];
      var a=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true});
      a=a.map(function(r){return r.map(function(c){if(c instanceof Date){var d=new Date(c.getTime()+12*3600000);return d.getUTCFullYear()+"-"+("0"+(d.getUTCMonth()+1)).slice(-2)+"-"+("0"+d.getUTCDate()).slice(-2);}return c;});});
      cb(a);
    }catch(e){toast("File tidak bisa dibaca. Gunakan .xlsx atau .csv.",true);}
  };
  fr.readAsArrayBuffer(file);
}
function lamaPeta(a){
  var hi=-1,m={};
  var urutK=["doc","tgl","ppbj","kode","qty","sumber","pic","by","nama","proyek","dept","cat"];
  var kunciKolom={tgl:/^tanggal|^tgl/,doc:/no.*form|no.*bpb|nomor|^form|dokumen/,ppbj:/ppbj/,dept:/dept/,kode:/kode/,qty:/^qty|jumlah|^jml/,sumber:/sumber/,pic:/^pic|nama pic/,by:/pemohon|peminta/,nama:/nama barang|^barang|^nama$/,proyek:/proyek/,cat:/catatan|^ket|pengambil/};
  for(var i=0;i<Math.min(a.length,10)&&hi<0;i++){
    var t={};a[i].forEach(function(c,j){var s=String(c).toLowerCase().trim();for(var u=0;u<urutK.length;u++){var k=urutK[u];if(t[k]===undefined&&kunciKolom[k].test(s)){t[k]=j;break;}}});
    if(t.doc!==undefined&&t.kode!==undefined&&t.qty!==undefined){hi=i;m=t;}
  }
  if(hi<0)return [];
  var out=[];
  for(var r=hi+1;r<a.length;r++){

    if(bad){toast("Jumlah diterima harus angka 0 atau lebih.",true);return;}
    if(!confirm("Terima barang ini secara fisik dan tambahkan ke stok Accurate?"))return;
    await kirimAdmin(b,{action:"adminKembaliTerima",id:b.getAttribute("data-kt"),items:items},loadTerima);
  };});
  pane().querySelectorAll("[data-kp]").forEach(function(b){b.onclick=function(){kirimAdmin(b,{action:"adminRemind",jenis:"persetujuan",id:b.getAttribute("data-kp")},loadTerima);};});
}
var PGM=[];
async function loadPengumuman(){
  pane().innerHTML='<div class="card msg">Memuat...</div>';
  try{
    var r=await api({action:"adminPengumumanList"});
    if(!r.ok){pane().innerHTML='<div class="card msg">'+esc(r.msg||"Gagal memuat.")+'</div>';return;}
    PGM=r.data||[];drawPengumuman(null);
  }catch(e){pane().innerHTML='<div class="card msg">Gagal terhubung ke server.</div>';}
}
function drawPengumuman(edit){
  var e=edit||{id:"",judul:"",isi:"",tautan:"",penting:false,mulai:"",berakhir:"",aktif:true};
  var today=tglIso(new Date());
  function status(p){if(!p.aktif)return '<span class="bd r">Nonaktif</span>';if(p.berakhir&&p.berakhir<today)return '<span class="bd r">Sudah berakhir</span>';if(p.mulai&&p.mulai>today)return '<span class="bd n">Belum tayang</span>';return '<span class="bd d">Tayang</span>';}
  pane().innerHTML=
   '<div class="card"><b>'+(e.id?"Ubah pengumuman":"Pengumuman baru")+'</b><div class="note">Tampil di halaman utama dan <u>bisa dibaca siapa saja yang punya alamat halaman itu</u>. Jangan menulis data sensitif.</div>'+
   '<div class="fr"><input class="t" id="pj" maxlength="120" placeholder="Judul" value="'+esc(e.judul)+'"></div>'+
   '<div class="fr"><textarea id="pi" maxlength="1000" rows="4" placeholder="Isi pengumuman (maks 1000 huruf)" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit">'+esc(e.isi)+'</textarea></div>'+
   '<div class="fr"><input class="t" id="pt" placeholder="Tautan (opsional), mis. https://..." value="'+esc(e.tautan)+'"></div>'+
   '<div class="fr"><label>Mulai tayang <input type="date" id="pm" value="'+esc(e.mulai)+'"></label><label>Berakhir (kosong = tanpa batas) <input type="date" id="pe" value="'+esc(e.berakhir)+'"></label></div>'+
   '<div class="fr"><label><input type="checkbox" id="pp"'+(e.penting?" checked":"")+'> Penting (tampil menonjol)</label><label><input type="checkbox" id="pa"'+(e.aktif?" checked":"")+'> Aktif</label></div>'+
   '<div class="fr"><button class="sv" id="psv">'+(e.id?"Simpan perubahan":"Tayangkan")+'</button>'+(e.id?'<button class="gh" id="pbt">Batal</button>':'')+'</div></div>'+
   (PGM.length?'<table><thead><tr><th>Pengumuman</th><th>Masa tayang</th><th>Status</th><th>Aksi</th></tr></thead><tbody>'+PGM.map(function(p,i){
     return '<tr><td data-l="Pengumuman"><b>'+(p.penting?"&#9733; ":"")+esc(p.judul)+'</b><small>'+esc((p.isi||"").slice(0,140))+(p.tautan?' · '+esc(p.tautan):'')+'</small></td><td data-l="Masa tayang">'+esc(p.mulai||"-")+' s/d '+esc(p.berakhir||"tanpa batas")+'</td><td data-l="Status">'+status(p)+'</td><td><button class="rm" data-pe="'+i+'">Ubah</button> <button class="gh" data-ph="'+i+'">Hapus</button></td></tr>';}).join("")+'</tbody></table>':'<div class="card msg">Belum ada pengumuman.</div>');
  document.getElementById("psv").onclick=async function(){
    var b={action:"adminPengumumanSimpan",aksi:"simpan",id:e.id,judul:document.getElementById("pj").value,isi:document.getElementById("pi").value,tautan:document.getElementById("pt").value,mulai:document.getElementById("pm").value,berakhir:document.getElementById("pe").value,penting:document.getElementById("pp").checked,aktif:document.getElementById("pa").checked};
    await kirimAdmin(this,b,loadPengumuman);
  };
  var bt=document.getElementById("pbt");if(bt)bt.onclick=function(){drawPengumuman(null);};
  pane().querySelectorAll("[data-pe]").forEach(function(b){b.onclick=function(){drawPengumuman(PGM[Number(b.getAttribute("data-pe"))]);window.scrollTo(0,0);};});
  pane().querySelectorAll("[data-ph]").forEach(function(b){b.onclick=async function(){var p=PGM[Number(b.getAttribute("data-ph"))];if(!confirm('Hapus pengumuman "'+p.judul+'"?'))return;await kirimAdmin(this,{action:"adminPengumumanSimpan",aksi:"hapus",id:p.id},loadPengumuman);};});
}
async function loadSistem(){
  pane().innerHTML='<div class="card msg">Memuat...</div>';

    var r=await api({action:"adminSistem"});
    if(!r.ok){pane().innerHTML='<div class="card msg">'+esc(r.msg||"Gagal memuat.")+'</div>';return;}

async function loadLaporan(){
  var dari=(document.getElementById("ld")||{}).value,sampai=(document.getElementById("ls")||{}).value;
  if(dari===undefined){var t=new Date(),a=new Date(t.getFullYear(),t.getMonth(),1);dari=tglIso(a);sampai=tglIso(t);}
  pane().innerHTML='<div class="card msg">Memuat...</div>';
  try{
    var r=await api({action:"adminLaporan",dari:dari,sampai:sampai});
    if(!r.ok){toast(r.msg||"Gagal.",true);drawLaporan({rows:[],detail:[],total:{nilai:0,baris:0,tanpaHarga:0,bekas:0}},dari,sampai);return;}
    LAP=r;drawLaporan(r,dari,sampai);
  }catch(e){toast("Gagal terhubung ke server.",true);}
}
function drawLaporan(r,dari,sampai){
  var rows=r.rows||[],T=r.total||{};
  var perDept={};rows.forEach(function(x){perDept[x.dept]=(perDept[x.dept]||0)+x.nilai;});
  var body="",last="";
  rows.forEach(function(x){
    if(x.dept!==last){body+='<tr class="grp"><td colspan="5" style="background:#eef6f9;border-top:2px solid #b8975a"><b>'+esc(x.dept)+'</b> <small>Subtotal Rp '+fmtN(perDept[x.dept])+'</small></td></tr>';last=x.dept;}
    body+='<tr><td data-l="Proyek"><b>'+esc(x.ppbj)+'</b>'+(x.proyek?'<small>'+esc(x.proyek)+'</small>':"")+'</td><td class="nm" data-l="Baris">'+x.baris+'</td><td class="nm" data-l="Bekas (tidak dinilai)">'+fmtN(x.bekas)+'</td><td class="nm" data-l="Nilai (Moka+Accurate)"><b>Rp '+fmtN(x.nilai)+'</b></td><td data-l="Catatan">'+(x.tanpaHarga?'<small style="color:#c0392b">'+x.tanpaHarga+' baris tanpa harga</small>':"")+(x.kembali?'<small style="color:#14612b">'+x.kembali+' barang dikembalikan (nilai sudah dikurangi)</small>':"")+'</td></tr>';
  });
  pane().innerHTML=
   '<div class="bar"><label class="fl">Dari <input type="date" id="ld" value="'+esc(dari)+'"></label><label class="fl">Sampai <input type="date" id="ls" value="'+esc(sampai)+'"></label><button class="gh" id="lgo">Tampilkan</button><button class="gh" id="lxl"'+(rows.length?"":" disabled")+'>Unduh Excel</button></div>'+
   '<div class="sum"><div><b>Rp '+fmtN(T.nilai||0)+'</b><span>Nilai pemakaian (Moka + Accurate)</span></div><div><b>'+(T.baris||0)+'</b><span>Baris barang diserahkan</span></div><div><b>'+fmtN(T.bekas||0)+'</b><span>Qty Bekas (tidak dinilai)</span></div><div><b>'+(T.tanpaHarga||0)+'</b><span>Baris tanpa harga</span></div><div><b>'+(T.kembali||0)+'</b><span>Barang sisa proyek dikembalikan</span></div></div>'+
   '<div class="bar"><b>Barang keluar untuk Accurate</b><span class="note" style="margin:0 8px">Penyesuaian persediaan: semua barang yang diambil pada rentang di atas</span><button class="gh" id="lbk">Unduh Barang Keluar</button></div>'+
   '<div class="note">Nilai memakai harga saat barang diserahkan. Pengembalian sisa proyek yang sudah diterima gudang mengurangi nilai proyek asalnya (dihitung dengan harga saat ini). Permintaan tanpa PPBJ dikelompokkan sebagai "Tanpa Proyek".</div>'+
   (rows.length?'<table><thead><tr><th>Proyek (PPBJ)</th><th class="nm">Baris</th><th class="nm">Bekas</th><th class="nm">Nilai</th><th>Catatan</th></tr></thead><tbody>'+body+'</tbody></table>':'<div class="card msg">Belum ada barang diserahkan pada rentang ini.</div>');
  document.getElementById("lgo").onclick=loadLaporan;
  document.getElementById("lbk").onclick=async function(){
    var b=this;b.disabled=true;
    try{
      var d=document.getElementById("ld").value,e=document.getElementById("ls").value;
      var x=await api({action:"adminBarangKeluar",dari:d,sampai:e});
      if(!x.ok){toast(x.msg||"Gagal.",true);b.disabled=false;return;}
      if(typeof XLSX==="undefined"){toast("Pembaca Excel belum termuat. Periksa internet lalu muat ulang halaman.",true);b.disabled=false;return;}
      var wb=XLSX.utils.book_new();
      var a1=[["Kode Barang","Nama Barang","Qty Keluar","Nama Proyek","No PPBJ","No BPB","Dari Bekas","Dari Moka","Dari Accurate","Di luar stok"]].concat((x.keluar||[]).map(function(g){return [g.kode,g.nama,g.qty,g.proyek,g.ppbj,g.bpb,g.bekas,g.moka,g.accurate,g.lain];}));
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a1),"Barang Keluar");
      var a2=[["Kode Barang","Nama Barang","Qty Masuk (pengembalian)","Nama Proyek","No PPBJ","No BPK"]].concat((x.masuk||[]).map(function(g){return [g.kode,g.nama,g.qty,g.proyek,g.ppbj,g.bpk];}));
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a2),"Pengembalian Masuk");
      var a3=[["Kode Barang","Nama Barang","Qty Kurang (selisih opname)","Sumber"]].concat((x.kurang||[]).map(function(g){return [g.kode,g.nama,g.qty,g.sumber];}));
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a3),"Selisih Opname Kurang");
      XLSX.writeFile(wb,"barang_keluar_"+d+"_sd_"+e+".xlsx");
      toast("Unduhan siap: "+(x.keluar||[]).length+" baris barang keluar, "+(x.masuk||[]).length+" pengembalian, "+(x.kurang||[]).length+" barang kurang opname.");
    }catch(er){toast("Gagal terhubung ke server.",true);}
    b.disabled=false;};
  document.getElementById("lxl").onclick=function(){
    var wb=XLSX.utils.book_new();
    var s1=[["Departemen","No PPBJ / Proyek","Keterangan Proyek","Baris","Qty Bekas (tidak dinilai)","Nilai (Moka+Accurate)","Baris tanpa harga"]].concat(rows.map(function(x){return [x.dept,x.ppbj,x.proyek,x.baris,x.bekas,x.nilai,x.tanpaHarga];}));
    s1.push(["TOTAL","","",T.baris,T.bekas,T.nilai,T.tanpaHarga]);
    var s2=[["Departemen","No PPBJ / Proyek","Keterangan Proyek","Kode","Nama Barang","Bekas","Moka","Accurate","Dikembalikan (Accurate)","Harga Satuan","Nilai (Moka+Accurate, setelah pengembalian)","Catatan"]].concat((r.detail||[]).map(function(d){return [d.dept,d.ppbj,d.proyek,d.kode,d.nama,d.bekas,d.moka,d.accurate,d.kembali||0,d.harga,d.nilai,d.tanpaHarga?"Harga belum ada":""];}));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s1),"Ringkasan");XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s2),"Rincian Barang");
    XLSX.writeFile(wb,"laporan_pemakaian_"+dari+"_sd_"+sampai+".xlsx");
  };
}

/* ---- tab Selisih Opname ---- */
var OPS=[],OPR=[],OPID="";
async function loadOpname(id){
  if(id!==undefined)OPID=id;
  pane().innerHTML='<div class="card msg">Memuat...</div>';
  try{
    var r=await api({action:"adminOpnameList",sesi:OPID||undefined});
    if(!r.ok){toast(r.msg||"Gagal.",true);return;}
    OPS=r.sesi||[];OPR=r.rows||[];SUMB=r.sumber||SUMB;drawOpname(r);
  }catch(e){toast("Gagal terhubung ke server.",true);}
}
function drawOpname(r){
  var head='<div class="note">Hasil stock opname dari aplikasi Cari Barang masuk ke sini. Selisih = hasil hitung dikurangi stok sistem saat dihitung. Kekurangan diambil dari '+esc((r.otomatis||["Moka","Accurate"]).join(" lalu "))+'; kelebihan masuk ke '+esc(r.lebih||"Accurate")+'. Stok baru berubah setelah Anda menekan Terapkan.</div>';
  var list='<div class="bar">'+(OPS.length?OPS.map(function(x){return '<button class="chip'+(x.id===OPID?" on":"")+'" data-os="'+esc(x.id)+'">'+esc(x.nama)+' · '+x.menunggu+' menunggu</button>';}).join(""):'<span class="note">Belum ada hasil opname yang dikirim.</span>')+'</div>';
  if(!OPID){pane().innerHTML=head+list;bindOs();return;}
  var mn=OPR.filter(function(x){return x.status==="Menunggu";});
  var tb=OPR.length?'<table><thead><tr><th></th><th>Barang</th><th class="nm">Stok saat dihitung</th><th class="nm">Hasil hitung</th><th class="nm">Selisih</th><th class="nm">Stok gudang sekarang</th><th>Terapkan ke</th><th>Status</th></tr></thead><tbody>'+
   OPR.map(function(x,i){
     var m=x.status==="Menunggu";
     return '<tr><td>'+(m?'<input type="checkbox" data-oc="'+i+'" checked>':'')+'</td><td data-l="Barang"><b>'+esc(x.nama)+'</b><small>'+esc(x.kode)+(x.rak?' · rak '+esc(x.rak):'')+'</small></td>'+
      '<td class="nm" data-l="Saat dihitung">'+fmtN(x.snap)+'</td><td class="nm" data-l="Hasil hitung">'+fmtN(x.hitung)+'</td>'+
      '<td class="nm" data-l="Selisih"><b style="color:'+(x.selisih<0?"#c0392b":x.selisih>0?"#1b8a3a":"inherit")+'">'+(x.selisih>0?"+":"")+fmtN(x.selisih)+'</b></td>'+
      '<td class="nm" data-l="Sekarang">'+fmtN(x.sekarang)+(x.beda?'<small style="color:#b8760a">beda dari saat dihitung</small>':'')+'</td>'+
      '<td data-l="Terapkan ke">'+(m?'<select data-ou="'+i+'"><option value="Otomatis">Otomatis'+(x.d?' ('+SUMB.map(function(n,j){return x.d[j]?n+' '+(x.d[j]>0?"+":"")+x.d[j]:"";}).filter(Boolean).join(", ")+(x.potong>0?"; kurang "+fmtN(x.potong)+" tak bisa dipotong":"")+')':'')+'</option><option>Moka</option><option>Accurate</option><option value="SetHitung">Samakan dengan hasil hitung</option></select>':'<small>'+esc(x.ket)+'</small>')+'</td>'+
      '<td data-l="Status"><span class="bd '+(x.status==="Diterapkan"?"a":x.status==="Menunggu"?"s":"l")+'">'+esc(x.status)+'</span></td></tr>';
   }).join("")+'</tbody></table>':'<div class="card msg">Tidak ada baris.</div>';
  pane().innerHTML=head+list+'<div class="bar"><button class="sv" id="oter"'+(mn.length?"":" disabled")+'>Terapkan terpilih</button><button class="gh" id="oab"'+(mn.length?"":" disabled")+'>Abaikan terpilih</button><span class="note">'+mn.length+' menunggu</span></div>'+tb;
  bindOs();
  function pilih(){var out=[];pane().querySelectorAll("[data-oc]").forEach(function(c){if(c.checked){var i=Number(c.getAttribute("data-oc")),sl=pane().querySelector('[data-ou="'+i+'"]');out.push({kode:OPR[i].kode,sumber:sl?sl.value:"Otomatis"});}});return out;}
  var bt=document.getElementById("oter");if(bt)bt.onclick=function(){var p=pilih();if(!p.length){toast("Pilih barang dulu.",true);return;}if(!confirm("Terapkan selisih "+p.length+" barang? Stok gudang berubah dan tercatat di Mutasi."))return;kirimAdmin(bt,{action:"adminOpnameProses",aksi:"terapkan",sesi:OPID,rows:p},function(){return loadOpname();});};
  var ba=document.getElementById("oab");if(ba)ba.onclick=function(){var p=pilih();if(!p.length){toast("Pilih barang dulu.",true);return;}if(!confirm("Abaikan "+p.length+" barang? Stok tidak berubah."))return;kirimAdmin(ba,{action:"adminOpnameProses",aksi:"abaikan",sesi:OPID,rows:p},function(){return loadOpname();});};
}
function bindOs(){pane().querySelectorAll("[data-os]").forEach(function(b){b.onclick=function(){loadOpname(b.getAttribute("data-os"));};});}
