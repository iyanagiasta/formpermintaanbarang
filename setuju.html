<!DOCTYPE html>
<html lang="id">
<head><link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta charset="utf-8">
<script src="ukur.js?v=59"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persetujuan Permintaan Barang</title>
<style>
:root{--navy:#17588f;--gold:var(--accent,#1a6cab);--bg:#eef3f6;--ink:#0d1f2d;--card:#fff;--line:#cfd8de}
@media (prefers-color-scheme:dark){:root{--bg:#0f171c;--ink:#e6eef2;--card:#1a252c;--line:#33444e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:15px}
.top{background:#1b6ca8;color:#fff;text-align:center;padding:18px 12px;border-bottom:4px solid var(--gold)}
.top h1{margin:0;font:700 18px Inter,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:1.5px}
.top div{margin-top:4px;font-size:12px;letter-spacing:2px;color:#e8f3fb;font-weight:600}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row b{flex:0 0 120px;color:var(--mut,#4a5b68)}
.row span{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.note{background:#fff7e0;border-left:4px solid var(--accent,#1a6cab);border-radius:6px;padding:8px 12px;margin-top:10px;font-size:14px;color:#3b2f10;white-space:pre-wrap;overflow-wrap:anywhere}
@media (prefers-color-scheme:dark){.note{background:#3a3220;color:#f2e6c4}}
textarea{width:100%;min-height:80px;max-height:300px;resize:vertical;font:15px "Segoe UI",Roboto,Arial,sans-serif;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);overflow-wrap:anywhere}
.cnt{font-size:12px;color:var(--mut,#4a5b68);text-align:right;margin:2px 0 12px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
th{background:var(--navy);color:#fff;padding:6px;text-align:left;font-weight:600}
td{border-bottom:1px solid var(--line);padding:6px;vertical-align:top}
.btns{display:flex;gap:10px}
button{flex:1;font:700 16px "Segoe UI",Roboto,Arial,sans-serif;padding:14px;border:0;border-radius:10px;color:#fff;cursor:pointer}
button.ok{background:#1b8a3a}button.no{background:#c0392b}button:disabled{opacity:.5}
.msg{text-align:center;font-size:17px;padding:26px 10px}
.msg.err{color:var(--red,#a82424)}.msg.good{color:var(--grn,#14602f)}
.tag{display:inline-block;background:#e8f1f6;color:#17588f;border-radius:20px;padding:3px 10px;font-size:13px;font-weight:600}
@media (prefers-color-scheme:dark){.tag{background:#23333c;color:#e6eef2}}

.kk{border-left:6px solid var(--navy)}
.kk h2{margin:0 0 8px;font:700 16px "Segoe UI",Roboto,Arial,sans-serif}
.kk ul{list-style:none;margin:0;padding:0}
.kk li{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;margin:6px 0;border-radius:8px;font-size:14px;line-height:1.35}
.kk li b{flex:none;min-width:84px;font-size:12px;letter-spacing:.3px;text-transform:uppercase}
.k-merah{background:#fde8e8;color:#8a1c28}.k-kuning{background:#fff3cd;color:#6b4300}.k-hijau{background:#e3f4e8;color:#14602f}.k-info,.k-abu{background:#e8f1f6;color:#2f4a5c}
@media (prefers-color-scheme:dark){.k-merah{background:#46191d;color:#ffb4b4}.k-kuning{background:#3a3010;color:#f2dc9b}.k-hijau{background:#1d3a26;color:#a8e0b5}.k-info,.k-abu{background:#23333c;color:#cdd9e0}}
html[data-tema=gelap] .k-merah{background:#46191d;color:#ffb4b4}html[data-tema=gelap] .k-kuning{background:#3a3010;color:#f2dc9b}html[data-tema=gelap] .k-hijau{background:#1d3a26;color:#a8e0b5}html[data-tema=gelap] .k-info,html[data-tema=gelap] .k-abu{background:#23333c;color:#cdd9e0}
html[data-tema=terang] .k-merah{background:#fde8e8;color:#8a1c28}html[data-tema=terang] .k-kuning{background:#fff3cd;color:#6b4300}html[data-tema=terang] .k-hijau{background:#e3f4e8;color:#14602f}html[data-tema=terang] .k-info,html[data-tema=terang] .k-abu{background:#e8f1f6;color:#2f4a5c}
.kchips{display:flex;flex-wrap:wrap;gap:6px}
.kchip{display:inline-block;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;line-height:1.3}
tr.kd td{border-bottom:1px solid var(--line);padding:2px 6px 10px}
tr.kd+tr td,tr.it td{border-top:0}
.nilai{margin-top:8px;font-size:15px}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema-halaman.css">
<script src="tema.js"></script>
<link rel="stylesheet" href="gaya-baru.css">
</head>
<body>
<div class="top"><h1>PERSETUJUAN PERMINTAAN BARANG</h1><div>PT SARANA CATUR TIRTA KELOLA</div></div>
<div class="wrap" id="app"><div class="msg">Memuat permintaan...</div></div>
<script>
var API_URL="https://script.google.com/macros/s/AKfycbyVPrhw3xmk8D-73kgZQlesBB_1M6-Pc6vv3IUFMpa8jZx9bZmfGhzf_IFjKe3ZuYOMVw/exec";
var q=new URLSearchParams(location.search),act=q.get("a")==="reject"?"reject":"approve";
var app=document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function show(msg,cls){app.innerHTML='<div class="card msg '+(cls||"")+'">'+esc(msg)+'</div>';}
async function api(b){
  /* Aksi baca (info) aman diulang: server Apps Script kadang menjawab halaman galat sesaat (terukur: 5 dari 16 gagal). Aksi tulis (decide) TIDAK diulang otomatis. */
  var maks=b.action==="info"?3:1,gal=null;
  for(var i=0;i<maks;i++){
    try{
      var r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)});
      return await r.json();
    }catch(e){gal=e;if(i<maks-1)await new Promise(function(ok){setTimeout(ok,700*(i+1));});}
  }
  throw gal;
}

function rp(n){return "Rp "+String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,".");}
function fq(n){return String(Math.round(Number(n)*100)/100).replace(".",",");}
function chip(t,teks){return '<span class="kchip k-'+t+'">'+({merah:"\u2715 ",kuning:"! ",hijau:"\u2713 ",abu:"\u2139 "}[t]||"")+esc(teks)+'</span>';}
function chipsItem(k,it){
  var c=[];
  if(k.jenis==="Pengembalian"){
    var kb=it.kembali||{};
    c.push(chip(kb.status==="Sesuai"?"hijau":(kb.status==="Melebihi yang diserahkan"?"merah":"kuning"),kb.status==="Sesuai"?"Sesuai yang pernah diserahkan ("+fq(kb.serah)+")":(kb.status==="Melebihi yang diserahkan"?"Melebihi yang pernah diserahkan ("+fq(kb.serah)+")":kb.status)));
  }else{
    var s=it.stok||{};
    if(s.status==="Cukup")c.push(chip("hijau","Stok cukup (bebas "+fq(s.bebas)+")"));
    else if(s.status==="Terbatas")c.push(chip("kuning","Stok terbatas: bebas "+fq(s.bebas)+", diminta "+fq(it.q)));
    else if(s.status==="Kurang")c.push(chip("merah","Stok bebas habis (diminta "+fq(it.q)+")"));
    else if(s.status==="Tidak tercatat")c.push(chip("merah","Tidak ada di data stok"));
    else if(s.status==="Baru")c.push(chip("abu","Barang baru, belum ada kode"));
    var r=it.rab||{};
    if(r.status==="Dalam RAB")c.push(chip("hijau","Dalam RAB (sisa "+fq(r.sisa)+" dari "+fq(r.rab)+")"));
    else if(r.status==="Melebihi sisa RAB")c.push(chip("merah","Melebihi sisa RAB (sisa "+fq(r.sisa)+" dari "+fq(r.rab)+")"));
    else if(r.status==="Di luar RAB")c.push(chip("kuning","Di luar RAB proyek"));
    else if(r.status)c.push(chip("abu",r.status));
    var p=it.pola;
    if(p){
      if(p.status==="Wajar")c.push(chip("hijau","Wajar bagi departemen ini (rata-rata "+fq(p.rata)+", "+p.n+"\u00d7)"));
      else if(p.status==="Jauh di atas biasanya"||p.status==="Di atas biasanya")c.push(chip("kuning",p.status+" (rata-rata "+fq(p.rata)+", terbesar "+fq(p.maks)+", "+p.n+"\u00d7)"));
      else if(p.status==="Pertama kali")c.push(chip("abu","Belum pernah diminta departemen ini (6 bulan)"));
      else c.push(chip("abu","Riwayat departemen masih sedikit ("+p.n+"\u00d7, rata-rata "+fq(p.rata)+")"));
    }
  }
  if(k.nilaiTampil&&it.subtotal!=null)c.push(chip("abu",fq(it.q)+" \u00d7 "+rp(it.harga)+" = "+rp(it.subtotal)));
  else if(k.nilaiTampil&&k.jenis!=="Pengembalian"&&it.harga==null&&(it.stok||{}).status!=="Baru")c.push(chip("abu","Harga belum ada"));
  return c.join("");
}
function kartuKeputusan(k){
  if(!k)return "";
  var lbl={merah:"Perhatikan",kuning:"Cek dulu",hijau:"Aman",info:"Info"};
  var li=(k.ringkas||[]).map(function(x){return '<li class="k-'+x.t+'"><b>'+lbl[x.t]+'</b><span>'+esc(x.teks)+'</span></li>';}).join("");
  var nilai=k.nilaiTampil&&k.nilai!=null?'<div class="nilai"><b>Perkiraan nilai: '+rp(k.nilai)+'</b>'+(k.tanpaHarga?' <small>('+k.tanpaHarga+' barang tanpa harga tidak dihitung)</small>':"")+'</div>':"";
  var pr=k.proyek?'<div class="nilai" style="font-size:13px">Proyek: <b>'+esc(k.proyek.ket||k.proyek.ppbj)+'</b> ('+esc(k.proyek.ppbj)+', '+esc(k.proyek.status)+')</div>':"";
  return '<div class="card kk"><h2>Kartu keputusan</h2><ul>'+li+'</ul>'+nilai+pr+'<div class="note" style="margin-top:10px">Ini bantuan membaca data, bukan pengganti penilaian Anda. Data stok, RAB, dan riwayat diambil dari sistem saat halaman ini dibuka.</div></div>';
}
function render(r){
  var CAD=!!r.cadangan; if(CAD)act="approve";
  var d=r.data,aksi=act==="reject"?"TOLAK":"SETUJUI";
  var cat=(d.cat||[]).map(function(x){return "\n\n"+esc(x.peran+(x.nama?" ("+x.nama+(x.waktu?", "+x.waktu:"")+")":"")+": "+x.teks);}).join("");
  var K=r.keputusan||null;
  var rows=d.items.map(function(i,n){return "<tr class=\"it\"><td>"+(n+1)+"</td><td>"+(i.kode==="BARU"?"<b style=\"color:var(--ambt,#6b4300)\">BARU</b> (belum ada kode)":esc(i.kode))+"</td><td>"+esc(i.nama)+"</td><td>"+esc(i.satuan)+"</td><td>"+esc(i.jumlah)+"</td></tr>"+(K&&K.items&&K.items[n]?"<tr class=\"kd\"><td></td><td colspan=\"4\"><div class=\"kchips\">"+chipsItem(K,K.items[n])+"</div></td></tr>":"");}).join("");
  app.innerHTML=
   '<div class="card"><span class="tag">'+esc(r.tahap)+'</span>'+
   (CAD?'<p style="margin:10px 0 4px">Halo <b>'+esc(r.cadangan)+'</b>, Anda penyetuju cadangan untuk <b>'+esc(r.approver)+'</b>. Persetujuan tercatat atas nama '+esc(r.approver)+', dan klik Anda dicatat sebagai pembantu. Mohon periksa ':'<p style="margin:10px 0 4px">Halo <b>'+esc(r.approver)+'</b>, mohon periksa ')+(d.jenis==='Pengembalian'?'pengembalian barang sisa proyek':'permintaan')+' berikut.</p>'+
   '<div class="row"><b>No</b><span>'+esc(d.id)+'</span></div>'+
   '<div class="row"><b>Pemohon</b><span><strong>'+esc(d.by)+'</strong>'+(d.email?' ('+esc(d.email)+')':"")+'</span></div>'+
   (d.pic&&d.pic.nama?'<div class="row"><b>PIC</b><span>'+esc(d.pic.nama)+'</span></div>':"")+
   '<div class="row"><b>Departemen</b><span>'+esc(d.dept)+'</span></div>'+
   '<div class="row"><b>Nomor Dokumen</b><span>'+esc(d.doc)+'</span></div>'+
   '<div class="row"><b>'+(d.jenis==='Pengembalian'?'Sisa Proyek (PPBJ)':'Nomor PPBJ')+'</b><span>'+esc(d.ppbj)+'</span></div>'+
   '<div class="row"><b>'+(d.jenis==='Pengembalian'?'Keterangan':'Alasan')+'</b><span>'+esc(d.alasan)+'</span></div>'+
   (cat?'<div class="note"><b>Catatan</b>'+cat+'</div>':"")+'</div>'+
   kartuKeputusan(K)+
   '<div class="card" style="overflow-x:auto"><table><tr><th>No</th><th>Kode</th><th>Nama Barang</th><th>Sat</th><th>Jml</th></tr>'+rows+'</table></div>'+
   '<div class="card"><label for="cat"><b>Catatan Anda</b> (opsional)</label><textarea id="cat" maxlength="1000" placeholder="'+(act==="reject"?"Alasan penolakan atau informasi untuk pihak berikutnya":"Informasi tambahan untuk pihak berikutnya")+'"></textarea><div class="cnt" id="cnt">0 / 1000</div>'+
   '<div class="btns"><button class="'+(act==="reject"?"no":"ok")+'" id="go">Ya, '+aksi+'</button>'+
   (CAD?'':'<button class="'+(act==="reject"?"ok":"no")+'" id="alt">'+(act==="reject"?"Setujui saja":"Tolak saja")+'</button>')+'</div></div>';
  var ta=document.getElementById("cat");ta.oninput=function(){document.getElementById("cnt").textContent=ta.value.length+" / 1000";};
  document.getElementById("go").onclick=function(){send(act);};
  var alt=document.getElementById("alt");if(alt)alt.onclick=function(){send(act==="reject"?"approve":"reject");};
}
async function send(a){
  document.querySelectorAll("button").forEach(function(b){b.disabled=true;});
  try{
    var cEl=document.getElementById("cat"),r=await api({action:"decide",id:q.get("id"),t:q.get("t"),act:a,cat:cEl?cEl.value:""});
    show(r.msg||"Selesai.",r.ok?"good":"err");
  }catch(e){show("Gagal terhubung ke server. Coba lagi.","err");document.querySelectorAll("button").forEach(function(b){b.disabled=false;});}
}
(async function(){
  if(API_URL.indexOf("PASTE_")===0){show("API_URL belum diisi di file setuju.html.","err");return;}
  if(!q.get("id")||!q.get("t")){show("Link tidak lengkap.","err");return;}
  try{
    var r=await api({action:"info",kind:"approve",id:q.get("id"),t:q.get("t")});
    if(!r.ok){show(r.msg||"Link tidak valid.","err");return;}
    render(r);
  }catch(e){show("Gagal terhubung ke server. Periksa internet lalu muat ulang.","err");}
})();
</script>
</body>
</html>
