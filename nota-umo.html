<!DOCTYPE html>
<html lang="id">
<head><link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kirim Nota UMO - Gudang SCTK</title>
<style>
:root{--navy:#17588f;--bg:#eef3f6;--ink:#0d1f2d;--card:#fff;--line:#cfd8de;--mut:#5b7a8c;--ok:#1b8a3a;--bad:#a82424}
@media (prefers-color-scheme:dark){:root{--bg:#0f171c;--ink:#e6eef2;--card:#1a252c;--line:#33444e;--mut:#9db0bc;--bad:#f2b8bf}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:15px}
.top{background:#1b6ca8;color:#fff;text-align:center;padding:16px 12px}.top h1{margin:0;font-size:17px;letter-spacing:1px}
.wrap{max-width:520px;margin:0 auto;padding:14px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
input[type=text]{width:100%;padding:11px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
button{font:600 15px "Segoe UI",Roboto,Arial,sans-serif;padding:12px 16px;border:0;border-radius:9px;color:#fff;background:var(--navy);cursor:pointer;width:100%;margin-top:10px}
button.ok{background:var(--ok)}button.gh{background:transparent;color:var(--navy);border:1px solid var(--line)}
@media (prefers-color-scheme:dark){button.gh{color:var(--ink)}}
button:disabled{opacity:.5}
.note{color:var(--mut);font-size:13px}.err{color:var(--bad);font-weight:600}.sukses{color:var(--ok);font-weight:700}
.fi{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.fi:first-child{border-top:0}.fi button{width:auto;margin:0;padding:6px 10px;font-size:12px}
</style>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<div class="top"><h1>KIRIM NOTA UMO</h1></div>
<div class="wrap" id="app"><div class="card note">Memuat...</div></div>
<script>
var API_URL="https://script.google.com/macros/s/AKfycbyVPrhw3xmk8D-73kgZQlesBB_1M6-Pc6vv3IUFMpa8jZx9bZmfGhzf_IFjKe3ZuYOMVw/exec";
var P=new URLSearchParams(location.search),ID=P.get("id")||"",T=P.get("t")||"",app=document.getElementById("app"),FL=[],BUSY=false;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function rp(n){return "Rp "+Math.round(Number(n)||0).toLocaleString("id-ID");}
async function api(b){b.id=ID;b.t=T;var r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)});return await r.json();}
function blobB64(b){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(String(fr.result).split(",")[1]||"");};fr.onerror=function(){rej(new Error("gagal membaca file"));};fr.readAsDataURL(b);});}
async function keJpeg(file){
  var bm;try{bm=await createImageBitmap(file,{imageOrientation:"from-image"});}catch(e){bm=await new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(file);im.onload=function(){res(im);};im.onerror=function(){rej(new Error("Foto tidak bisa dibuka. Gunakan JPG atau PNG."));};im.src=u;});}
  var w=bm.width||bm.naturalWidth,h=bm.height||bm.naturalHeight,s=Math.min(1,1800/Math.max(w,h)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));
  var cx=c.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,c.width,c.height);cx.drawImage(bm,0,0,c.width,c.height);
  return await new Promise(function(res){c.toBlob(res,"image/jpeg",0.8);});
}
async function siap(){
  var out=[],tot=0;
  for(var i=0;i<FL.length;i++){var f=FL[i],pdf=f.type==="application/pdf"||/\.pdf$/i.test(f.name);
    if(f.size>20*1048576)throw new Error(f.name+" lebih dari 20 MB.");
    var b=pdf?f:await keJpeg(f),d=await blobB64(b);tot+=d.length;out.push({nama:pdf?f.name:(f.name||"nota").replace(/\.[^.]+$/,"")+".jpg",mime:pdf?"application/pdf":"image/jpeg",data:d});}
  if(tot>20000000)throw new Error("Total file terlalu besar. Kirim bertahap.");return out;
}
function daftar(){
  var b=document.getElementById("dfl");if(!b)return;
  b.innerHTML=FL.map(function(f,i){return '<div class="fi"><span>'+esc(f.name)+'</span><button class="gh" data-x="'+i+'">Hapus</button></div>';}).join("");
  Array.prototype.forEach.call(b.querySelectorAll("button[data-x]"),function(x){x.onclick=function(){FL.splice(Number(x.getAttribute("data-x")),1);daftar();};});
  document.getElementById("kirim").disabled=!FL.length;
}
function tampil(r){
  if(!r.bisa){app.innerHTML='<div class="card"><b>'+esc(r.nomor)+'</b><div class="note">'+esc(r.pengaju)+' · '+esc(r.perihal)+'</div><p>Realisasi UMO ini sudah ditutup. Hubungi Pengadaan bila ada nota yang terlewat.</p></div>';return;}
  app.innerHTML='<div class="card"><b>'+esc(r.nomor)+'</b><div class="note">'+esc(r.pengaju)+' · '+esc(r.perihal)+' · '+rp(r.total)+'</div><p class="note">Foto nota belanja Anda, lalu kirim. Pengadaan yang akan mencatat nilainya. Anda tidak perlu mengisi angka.</p>'+
  '<label class="note">Foto atau berkas nota (maksimal 5)</label><input type="file" id="fo" accept="image/*,application/pdf" multiple style="width:100%"><div id="dfl"></div>'+
  '<label>Nama pengirim (boleh dikosongkan)</label><input type="text" id="kn" maxlength="80" placeholder="'+esc(r.pengaju)+'">'+
  '<label>Keterangan (opsional)</label><input type="text" id="kk" maxlength="200" placeholder="mis. belanja ATK, bensin"><button class="ok" id="kirim" disabled>Kirim nota</button><div id="hs" class="note" style="margin-top:8px"></div></div>';
  document.getElementById("fo").onchange=function(){Array.prototype.forEach.call(this.files,function(f){if(FL.length<5)FL.push(f);});this.value="";daftar();};
  document.getElementById("kirim").onclick=async function(){
    if(BUSY||!FL.length)return;BUSY=true;var b=this,hs=document.getElementById("hs");b.disabled=true;hs.className="note";hs.textContent="Mengirim...";
    try{var files=await siap(),x=await api({action:"rlNotaKirim",files:files,ket:document.getElementById("kk").value,pengirim:document.getElementById("kn").value});
      if(x.ok){app.innerHTML='<div class="card"><p class="sukses">Terkirim.</p><p>'+esc(x.msg||"")+'</p><button class="gh" id="lagi">Kirim nota lain</button></div>';document.getElementById("lagi").onclick=function(){FL=[];mulai();};BUSY=false;return;}
      hs.className="err";hs.textContent=x.msg||"Gagal mengirim.";
    }catch(e){hs.className="err";hs.textContent=e.message||"Gagal terhubung ke server. Coba lagi.";}
    BUSY=false;b.disabled=!FL.length;};
}
async function mulai(){
  if(!ID||!T){app.innerHTML='<div class="card err">Tautan tidak lengkap. Minta tautan baru ke Pengadaan.</div>';return;}
  try{var r=await api({action:"rlNotaInfo"});if(!r.ok){app.innerHTML='<div class="card err">'+esc(r.msg||"Tautan tidak valid.")+'</div>';return;}tampil(r);}
  catch(e){app.innerHTML='<div class="card err">Gagal terhubung ke server. Periksa internet lalu muat ulang.</div>';}
}
mulai();
</script>
</body>
</html>
