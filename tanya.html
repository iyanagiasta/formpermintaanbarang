<!DOCTYPE html>
<html lang="id">
<head><link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tanya Gudang - Gudang SCTK</title>
<style>
:root{--navy:#17588f;--gold:var(--accent,#1a6cab);--bg:#eef3f6;--ink:#0d1f2d;--card:#fff;--line:#cfd8de;--mut:#5b7a8c}
@media (prefers-color-scheme:dark){:root{--bg:#0f171c;--ink:#e6eef2;--card:#1a252c;--line:#33444e;--mut:#9db0bc}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}
.top{background:#1b6ca8;color:#fff;text-align:center;padding:16px 12px;border-bottom:4px solid var(--gold);position:relative}
.top h1{margin:0;font:700 17px Inter,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:1.5px}
.top div{margin-top:4px;font-size:11px;letter-spacing:2px;color:#e8f3fb;font-weight:600}
.top .homebtn{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#e8f3fb;font:600 12px "Segoe UI",Roboto,Arial,sans-serif;text-decoration:none;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:6px 10px;letter-spacing:0}
.wrap{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
input.t{width:100%;padding:12px;font:600 16px "Segoe UI",Roboto,Arial,sans-serif;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
button{font:600 13px "Segoe UI",Roboto,Arial,sans-serif;padding:10px 14px;border:0;border-radius:8px;color:#fff;background:var(--navy);cursor:pointer}
button.gh{background:transparent;color:var(--navy);border:1px solid var(--line)}
@media (prefers-color-scheme:dark){button.gh{color:var(--ink)}}
.err{color:var(--red,#a82424)}.note{color:var(--mut);font-size:13px}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="tanya.css?v=3">

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>

<div class="wrap" id="app"></div>
<script src="tanya.js?v=14"></script>
</body>
</html>
