<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sistem Gudang SCTK</title>
<style>
:root{--navy:#0a2a43;--navy2:#0f6f93;--gold:#b8975a;--bg:#eef3f6;--ink:#0d1f2d;--card:#fff;--line:#d5dee4;--mut:#5b7a8c;--ic:#0a3a5c;--icbg:#e8f1f6}
@media (prefers-color-scheme:dark){:root{--bg:#0f171c;--ink:#e6eef2;--card:#1a252c;--line:#33444e;--mut:#9db0bc;--ic:#9fd3ea;--icbg:#22333d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}
.top{background:linear-gradient(120deg,#06203a,#0a3a5c 55%,#0f6f93);color:#fff;border-bottom:4px solid var(--gold)}
.top .in{max-width:1100px;margin:0 auto;padding:22px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font:700 20px Georgia,serif;letter-spacing:1.5px}
.top small{display:block;margin-top:5px;font-size:11px;letter-spacing:2px;color:#e3c98f;font-weight:600}
.who{display:flex;gap:8px;align-items:center;font-size:12px;color:#cfe3ee}
button{font:600 13px "Segoe UI",Roboto,Arial,sans-serif;padding:9px 14px;border:0;border-radius:8px;color:#fff;background:var(--navy);cursor:pointer}
button.gh{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
button.gold{background:var(--gold)}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
h2{font:700 12px "Segoe UI",Roboto,Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin:22px 0 10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-left:4px solid var(--navy2);border-radius:12px;padding:14px}
.stat b{display:block;font-size:30px;line-height:1.1}.stat span{color:var(--mut);font-size:12px}
.stat.w{border-left-color:#d08a00}.stat.b{border-left-color:#c0392b}.stat.ok{border-left-color:#1b8a3a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;transition:transform .12s,box-shadow .12s,border-color .12s}
.tile:hover,.tile:focus-visible{transform:translateY(-2px);box-shadow:0 8px 20px rgba(10,42,67,.12);border-color:var(--gold);outline:none}
.ico{flex:none;width:46px;height:46px;border-radius:12px;background:var(--icbg);color:var(--ic);display:grid;place-items:center}
.ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font-size:15px}.tile small{display:block;margin-top:3px;color:var(--mut);font-size:12px;line-height:1.35}
.badge{display:inline-block;margin-top:6px;font-size:10px;font-weight:700;letter-spacing:1px;color:#7a5b00;background:#fff3cd;border-radius:20px;padding:2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:400px;margin:36px auto}
input.t{width:100%;padding:12px;font:600 16px "Segoe UI",Roboto,Arial,sans-serif;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
.err{color:#c0392b;margin:10px 0 0}.msg{color:var(--mut);text-align:center;padding:24px}
.hello{margin:6px 0 4px;font:700 22px Georgia,serif;color:var(--ink)}.hello+p{margin:0 0 4px;color:var(--mut)}
.hero{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:16px}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.big{position:relative;display:flex;flex-direction:column;gap:12px;min-height:168px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-top:4px solid var(--navy2);border-radius:16px;padding:22px;cursor:pointer;text-align:left;font:inherit;transition:transform .14s,box-shadow .14s,border-color .14s}
.big:hover,.big:focus-visible{transform:translateY(-3px);box-shadow:0 14px 30px rgba(10,42,67,.14);border-color:var(--gold);outline:none}
.big .ico{width:56px;height:56px;border-radius:15px;background:linear-gradient(135deg,#0a3a5c,#0f6f93);color:#fff}.big .ico svg{width:28px;height:28px}
.big b{display:block;font:700 19px Georgia,serif}.big small{display:block;margin-top:5px;color:var(--mut);font-size:13px;line-height:1.45}
.big .go{position:absolute;right:20px;top:22px;color:var(--gold);font-size:22px;font-weight:700}
.big.adm{border-top-color:var(--gold)}.big.adm .ico{background:linear-gradient(135deg,#8a6b2f,#b8975a)}
.tag{display:inline-block;margin-top:auto;align-self:flex-start;font-size:10px;font-weight:700;letter-spacing:1px;border-radius:20px;padding:3px 10px;background:var(--icbg);color:var(--ic)}
.tag.a{background:#fff3cd;color:#7a5b00}
@media (prefers-reduced-motion:reduce){.big{transition:none}}
.pgm{margin:14px 0 0;display:grid;gap:10px}
.pg{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--navy2);border-radius:12px;padding:12px 14px}
.pg.pen{border-left-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.pg b{display:block;font:700 15px Georgia,serif}.pg.pen b:before{content:"\2605  ";color:var(--gold)}
.pg p{margin:5px 0 0;color:var(--ink);font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.pg a{display:inline-block;margin-top:7px;font-weight:700;font-size:13px;color:var(--navy2)}
.pg small{display:block;margin-top:6px;color:var(--mut);font-size:11px}
.ov{position:fixed;inset:0;background:rgba(6,32,58,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.on{display:flex}.dlg{background:var(--card);color:var(--ink);border-radius:16px;max-width:380px;width:100%;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.35);border-top:4px solid var(--gold)}
.dlg h3{margin:0 0 4px;font:700 18px Georgia,serif}.dlg p{margin:0 0 12px;color:var(--mut);font-size:13px;line-height:1.45}
.dlg .row{display:flex;gap:8px;margin-top:12px}.dlg .row button{flex:1}.dlg button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.big[disabled]{opacity:.6;cursor:wait}
.ov{position:fixed;inset:0;background:rgba(6,32,58,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.on{display:flex}
</style>
</head>
<body>
<div class="top"><div class="in"><div><h1>SISTEM GUDANG</h1><small>PT SARANA CATUR TIRTA KELOLA</small></div><div class="who" id="who"></div></div></div>
<div class="wrap" id="app"></div>
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="dj"><div class="dlg"><h3 id="dj"></h3><p id="dk"></p><input class="t" id="di" type="password" autocomplete="off"><p class="err" id="de" role="alert"></p><div class="row"><button class="sec" id="db" type="button">Batal</button><button id="dg" type="button">Masuk</button></div></div></div>
<script>
var API_URL="https://script.google.com/macros/s/AKfycbyVPrhw3xmk8D-73kgZQlesBB_1M6-Pc6vv3IUFMpa8jZx9bZmfGhzf_IFjKe3ZuYOMVw/exec";
var app=document.getElementById("app"),who=document.getElementById("who");
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function st(k,v,sess){try{var s=sess?sessionStorage:localStorage;if(v===undefined)return s.getItem(k)||"";if(v===null)s.removeItem(k);else s.setItem(k,v);}catch(e){return "";}return "";}
var ICON={
 form:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
 cari:'<circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/>',
 kebutuhan:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 12l2 2 4-4"/>',
 admin:'<path d="M12 3 4 6v6c0 4.5 3.2 7.8 8 9 4.8-1.2 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
 pantau:'<path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/>',
 serah:'<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
 stok:'<path d="M12 3 3 7.5 12 12l9-4.5z"/><path d="M3 12l9 4.5 9-4.5M3 16.5 12 21l9-4.5"/>',
 proyek:'<path d="M3 21h18M5 21V8l7-4 7 4v13M9 21v-5h6v5M9 11h.01M15 11h.01"/>',
 mutasi:'<path d="M7 7h12l-3-3M17 17H5l3 3"/>',
 opname:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/>',
 link:'<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'
};
function ikon(k){return '<span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">'+(ICON[k]||ICON.link)+'</svg></span>';}
async function api(b){
  var r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)});
  return await r.json();
}
/* ---- kotak kode ---- */
var dlgRes=null;
function mintaKode(judul,ket,verif){
  return new Promise(function(done){
    var ov=document.getElementById("ov"),di=document.getElementById("di"),de=document.getElementById("de"),dg=document.getElementById("dg");
    document.getElementById("dj").textContent=judul;document.getElementById("dk").textContent=ket;di.value="";de.textContent="";dg.disabled=false;ov.classList.add("on");setTimeout(function(){di.focus();},30);
    function tutup(v){ov.classList.remove("on");dg.onclick=null;document.getElementById("db").onclick=null;di.onkeydown=null;done(v);}
    async function ok(){
      var v=di.value.trim();if(!v){di.focus();return;}
      dg.disabled=true;de.textContent="";
      try{var r=await verif(v);if(r&&r.ok){tutup(v);return;}de.textContent=(r&&r.msg)||"Kode tidak diterima.";}
      catch(e){de.textContent="Gagal terhubung ke server. Periksa internet lalu coba lagi.";}
      dg.disabled=false;di.select();
    }
    dg.onclick=ok;document.getElementById("db").onclick=function(){tutup(null);};
    di.onkeydown=function(e){if(e.key==="Enter")ok();else if(e.key==="Escape")tutup(null);};
  });
}
/* ---- gerbang per kartu ---- */
async function pastikanPegawai(){
  var k=st("sctk_kode");
  if(k){try{var r=await api({action:"proyek",kode:k});if(r.ok)return k;}catch(e){return k;}st("sctk_kode",null);}
  var v=await mintaKode("Kode akses pegawai","Masukkan kode akses pegawai untuk melanjutkan. Kode cukup dimasukkan sekali di perangkat ini.",function(x){return api({action:"proyek",kode:x});});
  if(v)st("sctk_kode",v);return v;
}
async function pastikanPic(){
  var k=st("sctk_pic"),pin=st("sctk_admin",undefined,true);
  if(k||pin){try{var r=await api({action:"proyekPic",kode:k,pin:k?undefined:pin});if(r.ok)return true;}catch(e){return true;}st("sctk_pic",null);}
  var v=await mintaKode("Kode PIC / atasan","Menu ini khusus PIC dan atasan. Masukkan kode PIC.",function(x){return api({action:"proyekPic",kode:x});});
  if(v)st("sctk_pic",v);return !!v;
}
async function pastikanAdmin(){
  var pin=st("sctk_admin",undefined,true);
  if(pin){try{var r=await api({action:"adminSistem",pin:pin});if(r.ok)return pin;}catch(e){return pin;}st("sctk_admin",null,true);}
  var v=await mintaKode("Kode admin","Khusus admin gudang. Masukkan kode admin Anda.",function(x){return api({action:"adminSistem",pin:x});});
  if(v)st("sctk_admin",v,true);return v;
}
async function buka(aksi,btn){
  if(btn)btn.disabled=true;
  try{
    if(aksi==="minta"){if(await pastikanPegawai())location.href="index.html";}
    else if(aksi==="cari"){
      var k=await pastikanPegawai();
      if(k){var r=await api({action:"menu",kode:k}),u=(r&&r.ok&&r.cari)||"gudang.html";location.href=u;}
    }
    else if(aksi==="kebutuhan"){if(await pastikanPic())location.href="kebutuhan.html";}
    else if(aksi==="admin"){if(await pastikanAdmin())location.href="admin.html";}
  }finally{if(btn)btn.disabled=false;}
}
function keluar(){st("sctk_kode",null);st("sctk_pic",null);st("sctk_admin",null,true);tampilAwal();}
/* ---- tampilan ---- */
function big(aksi,ik,judul,ket,tag,adm){
  return '<button class="big'+(adm?" adm":"")+'" type="button" data-aksi="'+aksi+'"><span class="go" aria-hidden="true">&#8594;</span>'+ikon(ik)+'<div><b>'+esc(judul)+'</b><small>'+esc(ket)+'</small></div><span class="tag'+(adm?" a":"")+'">&#128274; '+tag+'</span></button>';
}
function kartu(){
  return '<div class="hello">Selamat datang</div><p>Pilih layanan yang Anda perlukan. Kode akses diminta saat Anda membuka layanan.</p><div class="hero">'+
   big("minta","form","Permintaan Barang","Buat permintaan pengambilan barang harian. Persetujuan lewat email, tanpa kertas.","KODE PEGAWAI")+
   big("cari","cari","Cari Barang","Lokasi gudang dan rak, foto barang dan rak, stok Moka dan Accurate, serta proyek yang memakai barang itu.","KODE PEGAWAI")+
   big("kebutuhan","kebutuhan","Cek Kebutuhan Proyek","Unggah kebutuhan barang proyek baru. Hasilnya: pakai stok Moka, stok Accurate, atau beli, lengkap dengan harga stok.","KODE PIC / ATASAN")+
   big("admin","admin","Admin Gudang","Pantauan persetujuan, serah barang, stok dan harga, opname, proyek, mutasi, laporan, dan cadangan.","KHUSUS ADMIN",true)+
   '</div>';
}
function pasangKartu(){
  Array.prototype.forEach.call(document.querySelectorAll(".big"),function(b){b.onclick=function(){buka(b.getAttribute("data-aksi"),b);};});
}
function bar(){
  var ada=st("sctk_kode")||st("sctk_pic")||st("sctk_admin",undefined,true);
  who.innerHTML=ada?'<button class="gh" id="lo">Keluar</button>':"";
  var lo=document.getElementById("lo");if(lo)lo.onclick=keluar;
}
function stat(n,l,c,href){return '<a class="stat '+c+'" href="'+href+'"><b>'+esc(n)+'</b><span>'+esc(l)+'</span></a>';}
function grid(a){
  return '<div class="grid">'+a.map(function(m){
    var ext=/^https?:/i.test(m.link);
    return '<a class="tile" href="'+esc(m.link)+'"'+(ext?' target="_blank" rel="noopener"':'')+'>'+ikon(m.ikon)+'<div><b>'+esc(m.judul)+'</b><small>'+esc(m.ket)+'</small>'+(m.untuk==="Admin"?'<span class="badge">ADMIN</span>':'')+'</div></a>';
  }).join("")+'</div>';
}
async function ringkasAdmin(pin){
  try{
    var r=await api({action:"menu",pin:pin});if(!r.ok)return;
    var s=r.ringkas||{},h="";
    h+='<h2>Ringkasan</h2><div class="stats">'+
     stat(s.menunggu,"Menunggu persetujuan",s.menunggu>0?"w":"ok","admin.html#pantau")+
     stat(s.siapSerah,"Siap diserahkan",s.siapSerah>0?"w":"ok","admin.html#serah")+
     stat(s.ppbjBelum,"PPBJ belum diisi",s.ppbjBelum>0?"b":"ok","admin.html#pantau")+
     stat(s.opname||0,"Selisih opname menunggu",(s.opname||0)>0?"w":"ok","admin.html#opname")+
     stat(s.proyekAktif,"Proyek mengikat stok","","admin.html#proyek")+
     stat(s.stokHabis,"Barang stok bebas habis",s.stokHabis>0?"w":"ok","admin.html#stok")+
     (s.kuota>=0?stat(s.kuota,"Sisa kuota email hari ini",s.kuota<20?"b":"ok","admin.html#sistem"):"")+'</div>';
    var utama={"index.html":1,"gudang.html":1,"kebutuhan.html":1,"admin.html":1},lain=r.data.filter(function(m){return !utama[m.link]&&m.untuk!=="Admin";}),ad=r.data.filter(function(m){return m.untuk==="Admin";});
    if(lain.length)h+='<h2>Menu lainnya</h2>'+grid(lain);
    if(ad.length)h+='<h2>Menu Admin</h2>'+grid(ad);
    var box=document.getElementById("adm-box");if(box)box.innerHTML=h;
  }catch(e){}
}
function tglId(iso){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||"");return m?m[3]+"/"+m[2]+"/"+m[1]:"";}
async function papan(){
  try{
    var r=await api({action:"pengumuman"});if(!r||!r.ok||!r.data||!r.data.length)return;
    var box=document.getElementById("pgm");if(!box)return;
    box.innerHTML=r.data.map(function(p){
      var ext=/^https?:/i.test(p.tautan||"");
      return '<div class="pg'+(p.penting?" pen":"")+'"><b>'+esc(p.judul)+'</b>'+(p.isi?'<p>'+esc(p.isi)+'</p>':'')+
        (p.tautan?'<a href="'+esc(p.tautan)+'"'+(ext?' target="_blank" rel="noopener"':'')+'>Buka tautan &#8594;</a>':'')+
        (p.berakhir?'<small>Berlaku sampai '+esc(tglId(p.berakhir))+'</small>':'')+'</div>';}).join("");
  }catch(e){}
}
function tampilAwal(){
  app.innerHTML='<div class="pgm" id="pgm" role="region" aria-label="Pengumuman"></div>'+kartu()+'<div id="adm-box"></div>';pasangKartu();bar();papan();
  var pin=st("sctk_admin",undefined,true);if(pin)ringkasAdmin(pin);
}
(function(){
  if(API_URL.indexOf("PASTE_")===0){app.innerHTML='<div class="msg err">API_URL belum diisi.</div>';return;}
  tampilAwal();
})();
</script>
</body>
</html>
