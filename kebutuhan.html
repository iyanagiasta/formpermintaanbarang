<!DOCTYPE html>
<html lang="id">
<head><link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin><link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

<style>
.sres{display:grid;gap:4px;margin:4px 0}.hs{display:block;text-align:left;width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer}.hs:hover,.hs:focus-visible{border-color:var(--gold);outline:none}.hs small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.rw{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:9px;margin-top:4px}.rr{display:flex;gap:8px;align-items:center;padding:7px 9px;border-top:1px solid var(--line)}.rr:first-child{border-top:0}.rr>span{flex:1;min-width:0}.rr small{display:block;color:var(--mut);font-size:12px}.rr input{width:84px;padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);text-align:right}
:root{--navy:#0a2a43;--gold:var(--accent,#0b5f8f);--bg:#eef3f6;--ink:#0d1f2d;--card:#fff;--line:#cfd8de;--mut:#5b7a8c;--beli:#fde8e8;--belit:#8a1c28}
@media (prefers-color-scheme:dark){:root{--bg:#0f171c;--ink:#e6eef2;--card:#1a252c;--line:#33444e;--mut:#9db0bc;--beli:#3a1d22;--belit:#f2b8bf}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}
.top{background:#0c3b57;color:#fff;text-align:center;padding:16px 12px;border-bottom:4px solid var(--gold)}
.top h1{margin:0;font:700 18px Inter,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:1.5px}.top div{margin-top:4px;font-size:11px;letter-spacing:2px;color:#c9dde9;font-weight:600}
.wrap{max-width:1150px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
input.t,select,input[type=text]{padding:9px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input.t{width:100%;font:600 16px "Segoe UI",Roboto,Arial,sans-serif;padding:12px}
button{font:600 13px "Segoe UI",Roboto,Arial,sans-serif;padding:9px 13px;border:0;border-radius:8px;color:#fff;background:var(--navy);cursor:pointer}
button:disabled{opacity:.5;cursor:default}button.gh{background:transparent;color:var(--navy);border:1px solid var(--line)}button.sv{background:#1b8a3a}button.gold{background:var(--gold)}
@media (prefers-color-scheme:dark){button.gh{color:var(--ink)}}
.fr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.note{color:var(--mut);font-size:12px}.err{color:var(--red,#a82424)}.msg{text-align:center;padding:22px;color:var(--mut)}
.blk{border-left:4px solid var(--gold)}
.blk h3{margin:0 0 6px;font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tabs button{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:20px}.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sum{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.sum div{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.sum b{display:block;font-size:20px}.sum span{color:var(--mut);font-size:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
th{background:var(--navy);color:#fff;text-align:left;padding:8px;font-size:12px;white-space:nowrap}td{border-top:1px solid var(--line);padding:8px;vertical-align:top}
td small{display:block;color:var(--mut);font-size:11px}.nm{text-align:right;white-space:nowrap}
tr.beli td.b{background:var(--beli);color:var(--belit);font-weight:700}
.tag{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700}.tag.w{background:#fff3cd;color:#7a5b00}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0a2a43;color:#fff;padding:11px 16px;border-radius:10px;max-width:92vw;display:none;z-index:9;font-weight:600}#toast.bad{background:#c0392b}
.top{position:relative}.homebtn{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#c9dde9;font:600 12px "Segoe UI",Roboto,Arial,sans-serif;text-decoration:none;border:1px solid rgba(227,201,143,.55);border-radius:8px;padding:7px 11px;letter-spacing:0}.homebtn:hover,.homebtn:focus-visible{background:rgba(255,255,255,.12);outline:none}@media (max-width:640px){.top{padding-top:50px}.homebtn{top:10px;transform:none}}
.at{display:flex;gap:8px;align-items:center;padding:7px 9px;border-top:1px solid var(--line)}.at:first-child{border-top:0}.at>span{flex:1;min-width:0;word-break:break-all}.at small{color:var(--mut)}
.pgf{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:8px 0}.pgf label{display:block;font-size:12px;color:var(--mut)}.pgf input{width:100%}

<body>
<div class="top"><a class="homebtn" href="dashboard.html">&larr; Halaman Utama</a><h1>CEK KEBUTUHAN PROYEK</h1><div>RAB: PAKAI STOK ATAU BELI</div></div>
<div class="wrap" id="app"></div><div id="toast"></div>
<script>
var API_URL="https://script.google.com/macros/s/AKfycbyVPrhw3xmk8D-73kgZQlesBB_1M6-Pc6vv3IUFMpa8jZx9bZmfGhzf_IFjKe3ZuYOMVw/exec";
var KODE="",PROY=[],BL=[],HAS=null,TAB=0,BUSY=false,app=document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function toast(m,bad){var t=document.getElementById("toast");t.textContent=m;t.className=bad?"bad":"";t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none";},5000);}
function fmtN(n){n=Number(n)||0;return (Math.round(n*100)/100).toString().replace(".",",");}
function rp(n){return n==null?"":"Rp "+Math.round(n).toLocaleString("id-ID");}
var PINADM="";try{PINADM=sessionStorage.getItem("sctk_admin")||"";}catch(e){}
async function api(b){b.kode=KODE;if(PINADM&&!KODE)b.pin=PINADM;var r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)});return await r.json();}
function loginView(msg){
  app.innerHTML='<div class="card" style="max-width:380px;margin:30px auto"><p style="margin-top:0"><b>Kode akses PIC / atasan / gudang</b></p><div class="note" style="margin-bottom:8px">Cek kebutuhan barang proyek terhadap stok gudang. Untuk PIC, atasan, dan gudang.</div><input class="t" id="kd" type="password" autocomplete="off" placeholder="Kode PIC"><div style="height:10px"></div><button id="go" style="width:100%">Masuk</button><p class="err" id="lerr" style="margin:10px 0 0">'+esc(msg||"")+'</p></div>';
  var i=document.getElementById("kd");i.focus();i.onkeydown=function(e){if(e.key==="Enter")masuk();};document.getElementById("go").onclick=masuk;
}
async function masuk(){
  var v=document.getElementById("kd").value.trim();if(!v)return;KODE=v;document.getElementById("go").disabled=true;
  try{var r=await api({action:"proyekPic"});if(!r.ok){KODE="";loginView(r.msg||"Kode salah.");return;}PROY=r.data||[];try{localStorage.setItem("sctk_pic",KODE)}catch(e){}start();}
  catch(e){KODE="";loginView("Gagal terhubung ke server.");}
}
function start(){if(!BL.length)BL.push(baru());HAS=null;gambarForm();}
function baru(){return {ppbj:"",nama:"",kategori:"",dept:"",rows:[],file:""};}
/* ---------- input ---------- */
function gambarForm(){
  var opt='<option value="">(RAB baru / belum terdaftar)</option>'+PROY.map(function(p){return '<option value="'+esc(p.ppbj)+'">'+esc(p.ppbj)+' - '+esc(p.ket)+'</option>';}).join("");
  app.innerHTML='<div class="card"><b>Langkah 1. Siapkan proyek</b><div class="note">Satu blok per proyek. Urutan blok = prioritas stok: proyek paling atas mendapat stok lebih dulu. Excel berisi kolom <b>Kode Barang</b>, Nama Barang (opsional), dan <b>Qty</b>. Kebutuhan yang sudah disimpan per No PPBJ bisa diambil dengan tombol di tiap proyek. <a href="#" id="contoh">Unduh contoh Excel</a></div></div>'+
   BL.map(function(b,i){
     return '<div class="card blk"><h3>Proyek '+(i+1)+'</h3><div class="fr"><select data-p="'+i+'">'+opt+'</select><button class="gh" data-kb="'+i+'" title="Isi daftar barang dari kebutuhan proyek yang tersimpan">Ambil kebutuhan tersimpan</button><input type="text" data-n="'+i+'" placeholder="Nama proyek" value="'+esc(b.nama)+'" style="flex:1;min-width:180px"><select data-k="'+i+'" title="Kategori anggaran proyek (dipakai untuk pengajuan pembelian)"><option value="">Kategori: pilih</option><option value="Opex"'+(b.kategori==="Opex"?' selected':'')+'>Opex</option><option value="Capex"'+(b.kategori==="Capex"?' selected':'')+'>Capex</option></select></div>'+
      '<div class="fr"><input type="file" data-f="'+i+'" accept=".xlsx,.xls,.csv"><span class="note" id="fi'+i+'">'+(b.file?esc(b.file)+': diunggah':'Excel boleh dilewati, barang bisa ditambah lewat pencarian')+'</span></div>'+
      '<div class="fr"><input type="search" data-s="'+i+'" placeholder="Cari nama atau kode barang untuk ditambahkan..." autocomplete="off" style="flex:1;min-width:220px"></div><div class="sres" id="sr'+i+'"></div><div id="rb'+i+'"></div>'+
      '<div class="fr"><button class="gh" data-up="'+i+'"'+(i?'':' disabled')+'>&uarr; Naik</button><button class="gh" data-dn="'+i+'"'+(i<BL.length-1?'':' disabled')+'>&darr; Turun</button><button class="gh" data-rm="'+i+'"'+(BL.length>1?'':' disabled')+'>Hapus</button></div></div>';
   }).join("")+
   '<div class="fr"><button class="gh" id="tmb"'+(BL.length>=8?" disabled":"")+'>+ Tambah proyek</button><button class="gold" id="hit">Hitung kebutuhan</button></div>';
  BL.forEach(function(b,i){app.querySelector('[data-p="'+i+'"]').value=b.ppbj;});
  app.querySelectorAll("[data-p]").forEach(function(s){s.onchange=function(){var i=Number(s.getAttribute("data-p"));BL[i].ppbj=s.value;var p=PROY.filter(function(x){return x.ppbj===s.value;})[0];if(p&&!BL[i].nama){BL[i].nama=p.ket||p.ppbj;app.querySelector('[data-n="'+i+'"]').value=BL[i].nama;}};});
  app.querySelectorAll("[data-kb]").forEach(function(b){b.onclick=async function(){
    var i=Number(b.getAttribute("data-kb")),pp=BL[i].ppbj;if(!pp){toast("Pilih proyek (No PPBJ) dulu.",true);return;}
    if(BL[i].rows.length&&!confirm("Daftar barang proyek ini diganti dengan kebutuhan tersimpan?"))return;
    b.disabled=true;
    try{var r=await api({action:"kbGet",ppbj:pp});
      if(!r.ok){toast(r.msg||"Gagal.",true);}
      else if(!r.items.length){toast("PPBJ "+pp+" belum punya kebutuhan tersimpan. Isi lewat menu Kebutuhan dan Cek PPBJ, atau unggah Excel.",true);}
      else{BL[i].rows=r.items.map(function(x){return {kode:x.kode,nama:x.nama,satuan:x.satuan,qty:String(x.qty).replace(".",",")};});if(!BL[i].nama){BL[i].nama=r.nama||pp;app.querySelector('[data-n="'+i+'"]').value=BL[i].nama;}if(r.kategori){BL[i].kategori=r.kategori;app.querySelector('[data-k="'+i+'"]').value=r.kategori;}if(r.dept)BL[i].dept=r.dept;renderRows(i);toast(r.items.length+" barang dimuat dari kebutuhan tersimpan.");}
    }catch(e){toast("Gagal terhubung ke server.",true);}
    b.disabled=false;};});
  app.querySelectorAll("[data-n]").forEach(function(s){s.oninput=function(){BL[Number(s.getAttribute("data-n"))].nama=s.value;};});
  app.querySelectorAll("[data-k]").forEach(function(s){s.onchange=function(){BL[Number(s.getAttribute("data-k"))].kategori=s.value;};});
  app.querySelectorAll("[data-f]").forEach(function(f){f.onchange=function(){var i=Number(f.getAttribute("data-f"));if(f.files[0])bacaFile(f.files[0],i);};});
  app.querySelectorAll("[data-up]").forEach(function(b){b.onclick=function(){var i=Number(b.getAttribute("data-up"));var t=BL[i];BL[i]=BL[i-1];BL[i-1]=t;gambarForm();};});
  app.querySelectorAll("[data-dn]").forEach(function(b){b.onclick=function(){var i=Number(b.getAttribute("data-dn"));var t=BL[i];BL[i]=BL[i+1];BL[i+1]=t;gambarForm();};});
  app.querySelectorAll("[data-rm]").forEach(function(b){b.onclick=function(){BL.splice(Number(b.getAttribute("data-rm")),1);gambarForm();};});
  BL.forEach(function(b,i){renderRows(i);});
  app.querySelectorAll("[data-s]").forEach(function(inp){var i=Number(inp.getAttribute("data-s")),tm=null;inp.oninput=function(){clearTimeout(tm);var q=inp.value.trim(),box=document.getElementById("sr"+i);if(q.length<2){box.innerHTML="";return;}tm=setTimeout(function(){cariBarang(i,q);},350);};});
  document.getElementById("tmb").onclick=function(){BL.push(baru());gambarForm();};
  document.getElementById("hit").onclick=hitung;
  document.getElementById("contoh").onclick=function(e){e.preventDefault();unduhContoh();};
}
var SEQ=0;
async function cariBarang(i,q){
  var box=document.getElementById("sr"+i),my=++SEQ;if(!box)return;box.innerHTML='<div class="note">Mencari...</div>';
  try{
    var r=await api({action:"cariPic",q:q});if(my!==SEQ)return;
    if(!r.ok){box.innerHTML='<div class="note err">'+esc(r.msg||"Gagal.")+'</div>';return;}
    if(!r.data.length){box.innerHTML='<div class="note">Tidak ada barang yang cocok.</div>';return;}
    box.innerHTML=r.data.map(function(x,j){return '<button type="button" class="hs" data-a="'+j+'"><b>'+esc(x.nama)+'</b><small>'+esc(x.kode)+(x.satuan?' · '+esc(x.satuan):'')+'</small></button>';}).join("")+(r.total>r.data.length?'<div class="note">'+r.total+' barang cocok. Persempit pencarian untuk melihat lainnya.</div>':'');
    box.querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){
      var x=r.data[Number(b.getAttribute("data-a"))],k=String(x.kode).toUpperCase();
      var ada=BL[i].rows.some(function(y){return String(y.kode).toUpperCase()===k;});
      if(ada){toast("Barang itu sudah ada di daftar proyek ini.",true);return;}
      BL[i].rows.push({kode:x.kode,nama:x.nama,satuan:x.satuan,qty:"1"});
      box.innerHTML="";var s=app.querySelector('[data-s="'+i+'"]');if(s){s.value="";s.focus();}
      renderRows(i,true);toast("Ditambahkan: "+x.nama);
    };});
  }catch(e){if(my===SEQ)box.innerHTML='<div class="note err">Gagal terhubung ke server.</div>';}
}
function renderRows(i,akhir){
  var box=document.getElementById("rb"+i);if(!box)return;var R=BL[i].rows;
  if(!R.length){box.innerHTML="";return;}
  var tampilR=R.slice(0,300);
  box.innerHTML='<div class="note"><b>'+R.length+' barang</b> di proyek ini'+(R.length>300?' (menampilkan 300 pertama)':'')+'. Ubah jumlah di kolom kanan bila perlu.</div><div class="rw">'+tampilR.map(function(x,j){return '<div class="rr"><span><b>'+esc(x.nama||x.kode)+'</b><small>'+esc(x.kode)+(x.satuan?' · '+esc(x.satuan):'')+'</small></span><input inputmode="decimal" aria-label="Jumlah" data-q="'+j+'" value="'+esc(x.qty)+'"><button type="button" class="gh" aria-label="Hapus barang" data-x="'+j+'">&times;</button></div>';}).join("")+'</div>';
  box.querySelectorAll("[data-q]").forEach(function(e){e.oninput=function(){BL[i].rows[Number(e.getAttribute("data-q"))].qty=e.value;};});
  box.querySelectorAll("[data-x]").forEach(function(b){b.onclick=function(){BL[i].rows.splice(Number(b.getAttribute("data-x")),1);renderRows(i);};});
  if(akhir){var rw=box.querySelector(".rw");if(rw)rw.scrollTop=rw.scrollHeight;}
}
function bacaFile(file,i){
  if(typeof XLSX==="undefined"){toast("Pembaca Excel belum termuat. Periksa internet lalu muat ulang halaman.",true);return;}
  var fr=new FileReader();
  fr.onload=function(ev){
    try{
      var wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"}),a=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:"",raw:false});
      var o=ambil(a);if(o.err){toast(o.err,true);return;}
      var ada={};BL[i].rows.forEach(function(y){ada[String(y.kode).toUpperCase()]=true;});
      var tambah=o.rows.filter(function(y){return !ada[String(y.kode).toUpperCase()];});
      BL[i].rows=BL[i].rows.concat(tambah);BL[i].file=file.name;document.getElementById("fi"+i).textContent=file.name+": "+o.rows.length+" baris"+(o.adaJudul?"":" (tanpa judul kolom: A=Kode, B=Nama, C=Qty)");renderRows(i);
    }catch(e){toast("File tidak bisa dibaca. Gunakan .xlsx atau .csv.",true);}
  };
  fr.readAsArrayBuffer(file);
}
function ambil(a){
  var hi=-1,m={};
  for(var i=0;i<Math.min(a.length,10);i++){
    var t={};a[i].forEach(function(x,j){x=String(x).toLowerCase().trim();
      if(t.kode==null&&/kode/.test(x))t.kode=j;else if(t.nama==null&&/nama|uraian|deskripsi|barang/.test(x))t.nama=j;else if(t.satuan==null&&/satuan|unit|uom/.test(x))t.satuan=j;else if(t.qty==null&&/qty|jumlah|kebutuhan|volume|kuantitas|butuh/.test(x))t.qty=j;});
    if(t.kode!=null){hi=i;m=t;break;}
  }
  if(hi<0)m={kode:0,nama:1,qty:2};
  if(m.qty==null)return {err:"Kolom Qty tidak ditemukan. Beri judul kolom 'Qty' atau 'Jumlah'."};
  var rows=[];
  for(var r=hi+1;r<a.length;r++){var x=a[r],k=String(x[m.kode]==null?"":x[m.kode]).trim();if(!k)continue;
    rows.push({kode:k,nama:m.nama!=null?String(x[m.nama]||"").trim():"",satuan:m.satuan!=null?String(x[m.satuan]||"").trim():"",qty:x[m.qty]});}
  if(!rows.length)return {err:"Tidak ada baris data di file."};
  return {rows:rows,adaJudul:hi>=0};
}
function unduhContoh(){
  if(typeof XLSX==="undefined"){alert("Pembaca Excel belum termuat.");return;}
  var ws=XLSX.utils.aoa_to_sheet([["Kode Barang","Nama Barang","Qty"],["K1","Pipa PVC 3 inch",10],["K2","Oli Mesin",4]]);ws["!cols"]=[{wch:16},{wch:36},{wch:8}];
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Contoh");XLSX.writeFile(wb,"contoh-kebutuhan-proyek.xlsx");
}
/* ---------- hitung & tampil ---------- */
function payload(){return BL.filter(function(b){return b.rows.length;}).map(function(b,i){return {nama:b.nama||("Proyek "+(i+1)),ppbj:b.ppbj,kategori:b.kategori||"",dept:b.dept||"",rows:b.rows};});}
async function hitung(){
  if(BUSY)return;var p=payload();if(!p.length){toast("Unggah Excel kebutuhan minimal untuk satu proyek.",true);return;}
  BUSY=true;var b=document.getElementById("hit");b.disabled=true;b.textContent="Menghitung...";
  try{var r=await api({action:"kebutuhan",proyek:p});if(!r.ok){toast(r.msg||"Gagal menghitung.",true);}else{HAS=r;HAS.input=p;TAB=0;tampil();pengajuan();}}
  catch(e){toast("Gagal terhubung ke server.",true);}
  BUSY=false;b.disabled=false;b.textContent="Hitung kebutuhan";
}
function tampil(){
  var r=HAS,box=document.getElementById("hasil");
  if(!box){box=document.createElement("div");box.id="hasil";app.appendChild(box);}
  var tabs=['Gabungan'].concat(r.proyek.map(function(p){return p.nama;}));
  var cur=TAB===0?{rows:r.gabungan.rows,total:r.gabungan.total}:r.proyek[TAB-1];
  var t=cur.total;
  box.innerHTML='<h2 style="font-size:15px;margin:18px 0 0">Hasil perhitungan</h2><div class="note">Stok yang dipakai: '+esc(r.oto.join(" lalu "))+', dikurangi alokasi proyek lain dan permintaan yang sedang berjalan. Harga hanya muncul untuk bagian yang diambil dari stok; barang BELI tidak diberi harga.</div>'+

     x.ambil.map(function(a){return '<td class="nm">'+(a?fmtN(a):'-')+'</td>';}).join("")+'<td class="nm b">'+(x.beli>0?fmtN(x.beli):'-')+'</td><td class="nm">'+rp(x.harga)+'</td><td class="nm">'+rp(x.subtotal)+'</td><td><small>'+esc(x.cat)+'</small></td></tr>';}).join("")+'</tbody></table></div>';
  box.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){TAB=Number(b.getAttribute("data-t"));tampil();};});

function buatPembelian(){

function simpanAlokasi(){

    toast(r.msg||(r.ok?"Tersimpan.":"Gagal."),!r.ok);if(r.ok){try{sessionStorage.setItem("sctk_admin",pin)}catch(e){}}else{try{sessionStorage.removeItem("sctk_admin")}catch(e){}}b.disabled=false;
  }).catch(function(){toast("Gagal terhubung ke server.",true);b.disabled=false;});

function unduhExcel(){
  if(typeof XLSX==="undefined"){toast("Pembuat Excel belum termuat. Periksa internet lalu muat ulang halaman.",true);return;}
  var r=HAS,wb=XLSX.utils.book_new(),oto=r.oto;
  function head(){return ["Kode","Nama Barang","Satuan","Butuh"].concat(oto.map(function(n){return "Pakai "+n;})).concat(["BELI","Harga Satuan (stok)","Subtotal (stok)","Catatan"]);}
  function baris(x){return [x.kode,x.nama,x.satuan||"",x.butuh].concat(x.ambil).concat([x.beli,x.harga==null?"":x.harga,x.subtotal==null?"":x.subtotal,x.cat||""]);}
  var ring=[["Cek Kebutuhan Proyek"],["Tanggal",new Date().toLocaleDateString("id-ID")],["Stok dipakai urut",oto.join(" > ")],[],["Proyek","Jenis barang","Nilai pemakaian stok (BUKAN total RAB)","Barang perlu BELI","Barang stok tanpa harga"]];
  r.proyek.forEach(function(p){ring.push([p.nama+(p.ppbj?" ("+p.ppbj+")":""),p.total.barang,p.total.nilaiStok,p.total.adaBeli,p.total.tanpaHarga]);});
  ring.push(["GABUNGAN",r.gabungan.total.barang,r.gabungan.total.nilaiStok,r.gabungan.total.adaBeli,r.gabungan.total.tanpaHarga]);
  ring.push([],["Catatan: barang BELI tidak diberi harga; harga dan subtotal hanya untuk bagian yang diambil dari stok."]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ring),"Ringkasan");
  var gh=head();gh.splice(4+oto.length+0,0);
  var gab=[["Kode","Nama Barang","Satuan","Butuh"].concat(oto.map(function(n){return "Pakai "+n;})).concat(["BELI","Harga Satuan (stok)","Subtotal (stok)","Catatan"]).concat(r.proyek.map(function(p){return "Butuh: "+p.nama;}))];
  r.gabungan.rows.forEach(function(x){gab.push(baris(x).concat(x.perProyek));});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(gab),"Gabungan");
  r.proyek.forEach(function(p,i){var a=[head()];p.rows.forEach(function(x){a.push(baris(x));});XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),String(i+1)+" "+p.nama.replace(/[\[\]:*?\/\\]/g," ").slice(0,26));});
  XLSX.writeFile(wb,"kebutuhan-proyek-"+new Date().toISOString().slice(0,10)+".xlsx");
}

/* ---------- pengajuan: PDF bergaya Bukti Pengambilan + lampiran digabung + ajukan lewat email ---------- */
var ATT=[],PGJ={pengaju:"",dept:"",email:"",tgl:"",perihal:""},LAST_PG=null;
try{var sv=JSON.parse(localStorage.getItem("sctk_pgj")||"{}");PGJ.pengaju=sv.pengaju||"";PGJ.dept=sv.dept||"";PGJ.email=sv.email||"";}catch(e){}

  if(!PGJ.tgl){var _n=new Date(),_p=function(x){return String(x).padStart(2,"0");};PGJ.tgl=_n.getFullYear()+"-"+_p(_n.getMonth()+1)+"-"+_p(_n.getDate());}
  box.innerHTML='<h2 style="font-size:15px;margin:22px 0 0">Pengajuan (PDF dan persetujuan email)</h2><div class="card"><div class="note">Hasil di atas dijadikan PDF pengajuan bergaya sama dengan Bukti Pengambilan Barang, lengkap kolom tanda tangan (Diajukan Oleh, Bagian Gudang, Bagian Pengadaan, lalu Disetujui Oleh). <b>Tambahkan lampiran dulu</b>, lalu unduh PDF gabungan atau <b>ajukan lewat email</b> agar disetujui dan ditandatangani otomatis oleh masing-masing pihak.</div>'+
   '<div class="pgf"><div><label>Yang mengajukan (nama)</label><input type="text" id="pg_n" value="'+esc(PGJ.pengaju)+'"></div><div><label>Departemen (RM, Produksi, Gudang, Sales, Distribusi)</label><input type="text" id="pg_d" value="'+esc(PGJ.dept)+'"></div><div><label>Email pengaju (untuk kabar persetujuan)</label><input type="text" id="pg_e" value="'+esc(PGJ.email)+'"></div><div><label>Tanggal</label><input type="date" id="pg_t" value="'+esc(PGJ.tgl)+'"></div></div>'+
   '<div class="pgf"><div style="grid-column:1/-1"><label>Perihal / keterangan (opsional)</label><input type="text" id="pg_p" value="'+esc(PGJ.perihal)+'" placeholder="mis. Pengajuan kebutuhan material proyek Pompa Utara"></div></div>'+
   '<div class="fr"><b>Lampiran</b><input type="file" id="pg_f" accept=".pdf,.jpg,.jpeg,.png,.webp,image/*,application/pdf" multiple><span class="note">PDF dan foto (JPG, PNG). Excel/Word: ubah ke PDF dulu. Bisa menambah berkali-kali.</span></div><div id="pg_l"></div>'+
   '<div class="fr"><button class="gh" id="pg_x">Unduh PDF gabungan</button><button class="sv" id="pg_a">Ajukan lewat email</button><span class="note" id="pg_i"></span></div><div class="note" id="pg_r"></div></div>'+
   '<h2 style="font-size:15px;margin:18px 0 0">Pengajuan terbaru</h2><div id="pg_h" class="card note">Memuat...</div>';
  var m={pg_n:"pengaju",pg_d:"dept",pg_e:"email",pg_t:"tgl",pg_p:"perihal"};Object.keys(m).forEach(function(id){document.getElementById(id).oninput=function(){PGJ[m[id]]=this.value;};});

async function riwayatPgj(){

  try{var r=await api({action:"pgjList"});if(!r.ok){b.textContent=r.msg||"";return;}

  }catch(e){b.textContent="";}

function ukuranTxt(n){return n>=1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";}
function tambahAtt(fl){
  Array.prototype.forEach.call(fl,function(f){
    var nm=f.name.toLowerCase(),pdf=f.type==="application/pdf"||/\.pdf$/.test(nm),img=/^image\//.test(f.type)||/\.(jpe?g|png|webp)$/.test(nm);
    if(!pdf&&!img){toast(f.name+": hanya PDF atau foto (JPG/PNG). Ubah Excel/Word ke PDF dulu.",true);return;}
    if(f.size>25*1048576){toast(f.name+" lebih dari 25 MB.",true);return;}
    ATT.push({file:f,pdf:pdf});
  });gambarAtt();
}
function gambarAtt(){
  var b=document.getElementById("pg_l");if(!b)return;var tot=ATT.reduce(function(a,x){return a+x.file.size;},0);
  b.innerHTML=ATT.length?'<div class="rw" style="max-height:220px">'+ATT.map(function(a,i){return '<div class="at"><span><b>'+(i+1)+'.</b> '+esc(a.file.name)+' <small>'+(a.pdf?"PDF":"Foto")+' · '+ukuranTxt(a.file.size)+'</small></span><button class="gh" data-au="'+i+'"'+(i?'':' disabled')+'>&uarr;</button><button class="gh" data-ad="'+i+'"'+(i<ATT.length-1?'':' disabled')+'>&darr;</button><button class="gh" data-ax="'+i+'">&times;</button></div>';}).join("")+'</div><div class="note">'+ATT.length+' lampiran, '+ukuranTxt(tot)+(tot>15*1048576?' <b class="err">(besar: pengajuan lewat email dibatasi sekitar 15 MB setelah digabung)</b>':'')+'. Urutan di sini = urutan di PDF.</div>':'';
  b.querySelectorAll("[data-au]").forEach(function(x){x.onclick=function(){var i=Number(x.getAttribute("data-au")),t=ATT[i];ATT[i]=ATT[i-1];ATT[i-1]=t;gambarAtt();};});
  b.querySelectorAll("[data-ad]").forEach(function(x){x.onclick=function(){var i=Number(x.getAttribute("data-ad")),t=ATT[i];ATT[i]=ATT[i+1];ATT[i+1]=t;gambarAtt();};});
  b.querySelectorAll("[data-ax]").forEach(function(x){x.onclick=function(){ATT.splice(Number(x.getAttribute("data-ax")),1);gambarAtt();};});
}
async function gambarKeJpeg(file){
  var bm;try{bm=await createImageBitmap(file);}catch(e){bm=await new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(file);im.onload=function(){res(im);};im.onerror=function(){rej(new Error("gambar rusak"));};im.src=u;});}
  var w=bm.width||bm.naturalWidth,h=bm.height||bm.naturalHeight,s=Math.min(1,1800/Math.max(w,h)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));
  var cx=c.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,c.width,c.height);cx.drawImage(bm,0,0,c.width,c.height);
  var blob=await new Promise(function(res){c.toBlob(res,"image/jpeg",0.8);});return {bytes:await blob.arrayBuffer(),w:c.width,h:c.height};
}
function bytesKeB64(u8){var s="",CH=0x8000;for(var i=0;i<u8.length;i+=CH)s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));return btoa(s);}
async function buatDokumen(ajukan){
  if(!window.PDFLib||!window.PengajuanPdf){toast("Pustaka PDF belum termuat. Periksa internet lalu muat ulang halaman.",true);return;}
  if(!HAS){toast("Hitung kebutuhan dulu.",true);return;}
  if(BUSY)return;
  PGJ.pengaju=document.getElementById("pg_n").value.trim();PGJ.dept=document.getElementById("pg_d").value.trim();PGJ.email=document.getElementById("pg_e").value.trim();PGJ.tgl=document.getElementById("pg_t").value;PGJ.perihal=document.getElementById("pg_p").value.trim();
  if(!PGJ.pengaju){toast("Isi nama yang mengajukan.",true);return;}
  if(ajukan){
    if(!PGJ.dept){toast("Isi departemen pengaju.",true);return;}
    if(PGJ.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(PGJ.email)){toast("Format email pengaju tidak valid.",true);return;}
    if(!confirm("Kirim pengajuan ini ke Bagian Gudang lewat email untuk persetujuan?\n\nSetelah terkirim, isi kebutuhan tidak bisa diubah (buat pengajuan baru bila perlu)."))return;
  }
  try{localStorage.setItem("sctk_pgj",JSON.stringify({pengaju:PGJ.pengaju,dept:PGJ.dept,email:PGJ.email}));}catch(e){}
  BUSY=true;var bx=document.getElementById("pg_x"),ba=document.getElementById("pg_a"),inf=document.getElementById("pg_i");bx.disabled=ba.disabled=true;
  try{
    var bundle=null;
    if(ATT.length){inf.textContent="Menggabungkan lampiran...";
      try{bundle=await PengajuanPdf.buatBundle(ATT,function(i,n){inf.textContent="Menggabungkan lampiran "+i+" dari "+n+"...";},gambarKeJpeg);}
      catch(e){toast("Lampiran \""+(e.nama||"")+"\" tidak bisa digabung ("+e.message+"). Hapus atau ganti file itu.",true);inf.textContent="";BUSY=false;bx.disabled=ba.disabled=false;return;}}
    var data={nomor:"",tgl:PGJ.tgl,pengaju:PGJ.pengaju,dept:PGJ.dept,perihal:PGJ.perihal,oto:HAS.oto,proyek:HAS.proyek};
    if(ajukan){
      if(bundle&&bundle.length>15*1048576){toast("Lampiran gabungan "+ukuranTxt(bundle.length)+" terlalu besar untuk diajukan (maksimal sekitar 15 MB). Kurangi atau kecilkan lampiran.",true);inf.textContent="";BUSY=false;bx.disabled=ba.disabled=false;return;}
      inf.textContent="Mengirim pengajuan ke server...";
      var r=await api({action:"pgjSubmit",proyek:HAS.input,pengaju:PGJ.pengaju,dept:PGJ.dept,email:PGJ.email,perihal:PGJ.perihal,tgl:PGJ.tgl,lampiran:bundle?bytesKeB64(bundle):"",lampiranNama:ATT.map(function(a){return a.file.name;})});
      inf.textContent="";
      if(!r.ok){toast(r.msg||"Gagal mengajukan.",true);document.getElementById("pg_r").innerHTML='<span class="err">'+esc(r.msg||"Gagal mengajukan.")+'</span>';}
      else{LAST_PG=r;toast(r.msg);document.getElementById("pg_r").innerHTML='<b style="color:var(--grn,#14602f)">'+esc(r.msg)+'</b> Status dan PDF bertanda tangan bisa dilihat di daftar Pengajuan terbaru di bawah.';riwayatPgj();}
    } else {
      inf.textContent="Menyusun PDF...";
      var bytes=await PengajuanPdf.buatPdf({data:data,ttd:[{nama:PGJ.pengaju},{},{},{},{}],status:"",lampiranNama:ATT.map(function(a){return a.file.name;}),lampiranBytes:bundle});
      var blob=new Blob([bytes],{type:"application/pdf"}),nm="pengajuan-kebutuhan-"+(HAS.proyek.length===1&&HAS.proyek[0].ppbj?String(HAS.proyek[0].ppbj).replace(/[^\w-]+/g,"_")+"-":"")+PGJ.tgl+".pdf",a2=document.createElement("a");
      a2.href=URL.createObjectURL(blob);a2.download=nm;document.body.appendChild(a2);a2.click();setTimeout(function(){URL.revokeObjectURL(a2.href);a2.remove();},1500);
      inf.textContent="";toast("PDF siap ("+ukuranTxt(blob.size)+"). Ini versi draf tanpa tanda tangan; untuk persetujuan digital pakai Ajukan lewat email.");
    }
  }catch(e){toast("Gagal: "+(e&&e.message?e.message:"kesalahan tak dikenal"),true);inf.textContent="";}
  BUSY=false;bx.disabled=ba.disabled=false;
}
