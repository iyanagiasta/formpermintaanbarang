<!DOCTYPE html>
<html lang="id">
<head><link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta charset="utf-8">
<script src="ukur.js?v=59"></script><script src="akses.js?v=59"></script><script src="cari-pintar.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Penerimaan Barang - Gudang SCTK</title>
<style>
:root{--navy:#17588f;--gold:var(--accent,#1a6cab);--bg:#eef3f6;--ink:#0d1f2d;--card:#fff;--line:#cfd8de;--mut:#5b7a8c;--red:#a82424}
@media (prefers-color-scheme:dark){:root{--bg:#0f171c;--ink:#e6eef2;--card:#1a252c;--line:#33444e;--mut:#9db0bc;--red:#f2a0a0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:15px}
.top{background:#1b6ca8;color:#fff;text-align:center;padding:14px 12px;border-bottom:4px solid var(--gold);position:relative}
.top h1{margin:0;font:700 17px Inter,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:1.5px}.top div{margin-top:3px;font-size:11px;letter-spacing:2px;color:#e8f3fb;font-weight:600}
.homebtn{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#e8f3fb;font:600 12px "Segoe UI",Roboto,Arial,sans-serif;text-decoration:none;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:7px 10px}
.wrap{max-width:760px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}
label.l{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:11px;font:inherit;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
button{font:600 14px "Segoe UI",Roboto,Arial,sans-serif;padding:11px 14px;border:0;border-radius:9px;color:#fff;background:var(--navy);cursor:pointer}
button:disabled{opacity:.5;cursor:default}button.gh{background:transparent;color:var(--navy);border:1px solid var(--line)}button.sv{background:#1b8a3a}button.rd{background:#c0392b}
@media (prefers-color-scheme:dark){button.gh{color:var(--ink)}}
.fr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.fr>*{flex:1}
.note{color:var(--mut);font-size:12px}.err{color:var(--red)}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:20px}.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.it{display:grid;grid-template-columns:1fr 84px 92px 34px;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.it:first-child{border-top:0}
.it small{display:block;color:var(--mut);font-size:11px}.it input{padding:9px}
.it.luar{background:rgba(255,200,0,.08)}
.sg{border:1px solid var(--line);border-radius:9px;max-height:230px;overflow:auto;margin-top:4px}.sg button{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);border:0;border-top:1px solid var(--line);border-radius:0;font-weight:400}.sg button:first-child{border-top:0}.sg small{display:block;color:var(--mut);font-size:11px}
.th{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.th div{position:relative;width:86px;height:86px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center;padding:3px}
.th img{width:100%;height:100%;object-fit:cover}.th b{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;cursor:pointer;font-size:13px}
.box{border-left:4px solid var(--gold);padding:8px 10px;background:rgba(26,108,171,.07);border-radius:6px;margin:8px 0;font-size:13px}
.box.w{border-color:#d9a400;background:rgba(217,164,0,.1)}.box.r{border-color:#c0392b;background:rgba(192,57,43,.09)}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mut);font-size:11px;padding:4px}td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}.nm{text-align:right;white-space:nowrap}
.tag{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;background:#e3edf3;color:#17588f}.tag.ok{background:#dff3e4;color:#14612b}.tag.bad{background:#fde8e8;color:#8a1c28}.tag.w{background:#fff3cd;color:#7a5b00}
.can{text-decoration:line-through;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#17588f;color:#fff;padding:11px 16px;border-radius:10px;max-width:92vw;display:none;z-index:9;font-weight:600}#toast.bad{background:#c0392b}
.kp{margin:10px 0}.kp .kh{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}.kp .kh b{font-size:15px}.kp small{color:var(--mut,#667)}
.kp .bar2{height:6px;background:var(--line,#dde);border-radius:4px;overflow:hidden;min-width:90px;margin-top:3px}.kp .bar2 i{display:block;height:100%;background:#2e8b57}
.kp table{margin-top:8px}.kp td.nm,.kp th.nm{text-align:right;white-space:nowrap}.kp .lk{color:#17683c;font-weight:700}.kp .sk{color:#a8620a;font-weight:700}
.sres{display:grid;gap:4px;position:fixed;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 6px 18px rgba(0,0,0,.18);max-height:280px;overflow:auto}.sres:empty{display:none}
.sres .hs{display:block;text-align:left;width:100%;background:var(--card)!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:8px;padding:8px 10px;font:inherit;font-weight:400;cursor:pointer}.sres .hs:hover,.sres .hs:focus-visible{border-color:var(--gold)!important;outline:none}.sres .hs small{display:block;color:var(--mut)!important;font-size:12px;margin-top:2px}
.ci{display:grid;grid-template-columns:1fr 96px 34px;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.ci:first-child{border-top:0}.ci small{display:block;color:var(--mut);font-size:11px}.ci input{padding:9px}
.ci.bb{grid-template-columns:1fr 96px 34px}.ci.bb .sat{margin-top:4px}
.tabs button{padding:9px 6px;font-size:13px}
.pita table{margin-top:6px}.pita .fr{margin:6px 0 0}.pita button{padding:7px 10px;font-size:12px}
</style>
<link rel="stylesheet" href="tema-halaman.css">

</head>
<body>
<div class="top"><a class="homebtn" href="dashboard.html">&larr; Utama</a><h1>PENERIMAAN BARANG</h1><div>STAFF GUDANG · ADMIN</div></div>
<div class="wrap" id="app"></div><div id="toast"></div>
<script>
var API_URL="https://script.google.com/macros/s/AKfycbyVPrhw3xmk8D-73kgZQlesBB_1M6-Pc6vv3IUFMpa8jZx9bZmfGhzf_IFjKe3ZuYOMVw/exec";
var SATU=false,KODE="",PINADM="",ADMIN=false,NAMA="",PES=[],PROY=[],BARANG=[],FILES=[],ITEMS=[],F={sumber:"ppbj",ppbj:"",po:"",proyek:"",cat:"",alasan:""},TAB="baru",BUSY=false,KUNCI="",app=document.getElementById("app");
try{PINADM=sessionStorage.getItem("sctk_admin")||"";KODE=localStorage.getItem("sctk_pic")||"";}catch(e){}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function toast(m,bad){var t=document.getElementById("toast");t.textContent=m;t.className=bad?"bad":"";t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none";},8000);}
function fq(n){n=Number(n)||0;return (Math.round(n*1000)/1000).toString().replace(".",",");}
function numIn(v){var s=String(v==null?"":v).trim().replace(/[^\d.,-]/g,"");if(!s)return 0;if(/,/.test(s)&&/\./.test(s))s=s.replace(/\./g,"").replace(",",".");else if(/,/.test(s))s=s.replace(",",".");else if(/\.\d{3}($|\.)/.test(s))s=s.replace(/\./g,"");var n=Number(s);return isNaN(n)?0:n;}
function rid(){return "k"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
async function api(b){if(KODE)b.kode=KODE;else if(PINADM)b.pin=PINADM;var r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)});return await r.json();}
function loginView(msg){
  app.innerHTML='<div class="card" style="max-width:380px;margin:26px auto"><p style="margin-top:0"><b>Masukkan kode akses</b></p><div class="note" style="margin-bottom:8px">Halaman ini memerlukan kode akses. Silakan masukkan kode Anda, atau minta akses langsung kepada admin gudang.</div><input id="kd" type="password" autocomplete="off" placeholder="Kode akses"><div style="height:10px"></div><button id="go" style="width:100%">Masuk</button>'+(msg?'<p class="err">'+esc(msg)+'</p>':'')+'</div>';
  var i=document.getElementById("kd");i.onkeydown=function(e){if(e.key==="Enter")masuk();};document.getElementById("go").onclick=masuk;
}
async function masuk(){
  var v=document.getElementById("kd").value.trim();if(!v)return;
  document.getElementById("go").disabled=true;
  KODE=v;PINADM="";var ok=await mulai(true);
  if(!ok){KODE="";PINADM=v;ok=await mulai(true);if(ok){try{sessionStorage.setItem("sctk_admin",v);}catch(e){}}else{PINADM="";loginView("Kode atau PIN salah.");}}
}
async function mulai(diam){
  try{
    var r=await api({action:"terimaPesanan"});
    if(!r.ok){if(diam)return false;KODE="";try{localStorage.removeItem("sctk_pic");}catch(e){}loginView(r.msg||"Kode tidak dikenali. Periksa lagi atau minta ke admin gudang.");return false;}
    try{if(KODE)localStorage.setItem("sctk_pic",KODE);}catch(e){}
    SATU=!!r.satuJalur;PES=r.data||[];PROY=r.proyek||[];ADMIN=!!r.admin;NAMA=r.nama||"";muatBarang();tampil();return true;
  }catch(e){if(diam)return false;KODE="";loginView("Gagal terhubung ke server.");return false;}
}
async function muatBarang(){
  try{var o=JSON.parse(sessionStorage.getItem("sctk_tb_idx")||"null");if(o&&o.rows){BARANG=o.rows;}}catch(e){}
  try{var r=await api({action:"terimaBarang",v:(BARANG.length&&window.__tbv)?window.__tbv:""});if(r&&r.ok&&Array.isArray(r.rows)){BARANG=r.rows;window.__tbv=r.v;try{sessionStorage.setItem("sctk_tb_idx",JSON.stringify({rows:r.rows}));}catch(e){}}}catch(e){}
}
function tampil(){
  app.innerHTML='<div id="pita"></div><div class="tabs"><button id="t1" class="'+(TAB==="baru"?"on":"")+'">'+(SATU?"Menunggu diterima":"Terima barang")+'</button><button id="t3" class="'+(TAB==="catat"?"on":"")+'">Catat barang masuk</button><button id="t2" class="'+(TAB==="riwayat"?"on":"")+'">Riwayat</button></div><div id="isi"></div>';
  document.getElementById("t1").onclick=function(){pindah("baru");};document.getElementById("t3").onclick=function(){pindah("catat");};document.getElementById("t2").onclick=function(){pindah("riwayat");};
  tutupSaran();
  if(TAB==="baru")formBaru();else if(TAB==="catat")formCatat();else riwayat();
  gambarPita();muatPita();
}
function pindah(t){if(TAB!==t){FILES=[];KUNCI="";}TAB=t;tampil();}
/* ===== pita: barang keluar melebihi stok ===== */
var UTANG=null,PITA_BUKA=false;
async function muatPita(){try{var r=await api({action:"utangDaftar"});if(r&&r.ok){UTANG=r;gambarPita();}}catch(e){}}
function gambarPita(){
  var el=document.getElementById("pita");if(!el)return;var b=UTANG&&UTANG.buka||[];
  if(!b.length){el.innerHTML="";return;}
  var rg=UTANG.ringkas||[],h='<div class="box w pita" style="margin-bottom:12px"><b>Barang keluar melebihi stok ('+rg.length+' barang)</b><div class="note">Sudah diserahkan saat diajukan, tetapi stok tercatat tidak cukup. Daftar ini hilang otomatis saat barangnya dicatat masuk.</div>';
  h+='<div style="margin-top:4px">'+rg.slice(0,3).map(function(r){return esc(r.nama)+' <b>'+fq(r.qty)+'</b>';}).join(" · ")+(rg.length>3?' · dan '+(rg.length-3)+' lainnya':'')+'</div>';
  if(PITA_BUKA){
    h+='<div class="tw"><table><thead><tr><th>Barang</th><th class="nm">Qty</th><th>Dokumen</th><th>Waktu</th>'+(UTANG.admin?'<th></th>':'')+'</tr></thead><tbody>'+b.map(function(x){return '<tr><td>'+esc(x.nama)+'<small style="display:block;color:var(--mut)">'+esc(x.dept||"")+'</small></td><td class="nm">'+fq(x.qty)+'</td><td>'+esc(x.doc)+'</td><td>'+esc(x.waktu)+'</td>'+(UTANG.admin?'<td><button class="gh" data-tu="'+x.baris+'">Tutup manual</button></td>':'')+'</tr>';}).join("")+'</tbody></table></div>';
  }
  h+='<div class="fr"><button type="button" id="pb1">'+(PITA_BUKA?"Sembunyikan rincian":"Lihat rincian")+'</button><button type="button" class="gh" id="pb2">Catat barang masuk</button></div></div>';
  el.innerHTML=h;
  document.getElementById("pb1").onclick=function(){PITA_BUKA=!PITA_BUKA;gambarPita();};document.getElementById("pb2").onclick=function(){pindah("catat");};
  el.querySelectorAll("[data-tu]").forEach(function(e){e.onclick=function(){tutupManual(+e.getAttribute("data-tu"));};});
}
async function tutupManual(baris){
  var al=prompt("Alasan menutup catatan ini tanpa mengubah stok? (mis. stok sudah dikoreksi)");if(!al||!al.trim())return;
  try{var r=await api({action:"utangTutup",baris:[baris],alasan:al.trim()});if(!r.ok){toast(r.msg||"Gagal.",true);return;}toast(r.msg);muatPita();}catch(e){toast("Gagal terhubung ke server.",true);}
}
/* ===== form ===== */
function pesananDipilih(){return PES.filter(function(p){return p.ppbj===F.ppbj;})[0]||null;}
async function formBaru(){
  if(!SATU){formBaruLama();return;}
  var el=document.getElementById("isi");el.innerHTML='<div class="card"><div class="msg">Memuat daftar barang yang menunggu diterima...</div></div>';
  var r;try{r=await api({action:"plList",rincian:true});}catch(e){el.innerHTML='<div class="card"><p class="err">Gagal terhubung ke server.</p></div>';return;}
  if(!r.ok){el.innerHTML='<div class="card"><p class="err">'+esc(r.msg||"Gagal.")+'</p></div>';return;}
  var d=(r.data||[]).filter(function(x){return x.status!=="Diterima lengkap"&&x.status!=="Dibatalkan";});
  var h='<div class="card"><h3>Barang menunggu diterima <span class="tag">'+d.length+' pembelian</span></h3><div class="note">Semua penerimaan lewat satu jalur: pilih pembelian/PO di bawah, lalu catat jumlah Baik, Rusak, atau Salah kirim beserta foto surat jalan. Stok bertambah hanya untuk barang yang Baik; yang rusak atau salah kirim otomatis menjadi klaim vendor.</div><div class="note"><b>Barang tanpa PO tidak bisa diterima di sini.</b> Minta Pengadaan mencatat pembelian atau PO-nya lebih dulu, lalu barangnya muncul di daftar ini.</div></div>';
  if(!d.length)h+='<div class="card"><div class="note">Tidak ada pembelian yang menunggu diterima.</div></div>';
  else h+=d.map(function(x){
    var it=x.items||[],nL=0;it.forEach(function(i){if(Math.round((i.qBeli-i.qTerima)*1000)/1000<=0)nL++;});
    var pc=x.persen||0,sebagian=x.qTerima>0;
    var baris=it.map(function(i){var sisa=Math.round((i.qBeli-i.qTerima)*1000)/1000,p=i.qBeli>0?Math.min(100,Math.round(i.qTerima/i.qBeli*100)):0;
      return '<tr><td>'+esc(i.nama)+'</td><td class="nm">'+fq(i.qBeli)+' '+esc(i.satuan||"")+'</td><td class="nm">'+fq(i.qTerima)+'<div class="bar2"><i style="width:'+p+'%"></i></div></td><td class="nm">'+(sisa>0?'<span class="sk">sisa '+fq(sisa)+'</span>':'<span class="lk">lengkap</span>')+'</td></tr>';}).join("");
    return '<div class="card kp"><div class="kh"><div><b>'+esc(x.nomor)+'</b> <small>'+esc(x.tgl||"")+'</small><br>'+esc(x.supplier||"")+' <small>PO '+esc(x.po||"-")+'</small><br><small>'+esc(x.proyek||x.ppbj||"")+(x.proyek&&x.ppbj?' ('+esc(x.ppbj)+')':'')+'</small></div>'+
      '<div style="text-align:right"><span class="tag '+(sebagian?'w':'')+'">'+esc(sebagian?'Sebagian':x.status)+'</span><br><small>'+(it.length?nL+' dari '+it.length+' barang lengkap':'')+'</small><div class="bar2"><i style="width:'+pc+'%"></i></div></div></div>'+
      (it.length?'<div class="tw"><table><thead><tr><th>Barang</th><th class="nm">Dipesan</th><th class="nm">Diterima</th><th class="nm">Sisa</th></tr></thead><tbody>'+baris+'</tbody></table></div>':'')+
      '<div class="fr" style="margin-top:8px"><a href="pengadaan.html?terima='+encodeURIComponent(x.id)+'"><button type="button">'+(sebagian?'Terima barang berikutnya':'Terima barang')+'</button></a></div></div>';}).join("");
  el.innerHTML=h;
}
function formBaruLama(){
  var h='<div class="card"><h3>1. Barang datang dari mana?</h3><div class="fr"><button class="'+(F.sumber==="ppbj"?"":"gh")+'" id="s1">Pesanan PPBJ</button><button class="'+(F.sumber==="po"?"":"gh")+'" id="s2">PO / tanpa PPBJ</button></div>';
  if(F.sumber==="ppbj"){h+='<div id="psel"></div><label class="l">Cari proyek (No PPBJ, nama proyek, departemen, atau nama PIC)</label><input id="pq" placeholder="mis. cibadak, atap, RM, Ramji" autocomplete="off"><div id="phasil"></div><div class="fr" style="margin-top:6px"><button class="gh" id="pshow" type="button"></button></div><div id="info" class="note"></div>';}
  else{h+='<label class="l">No PO (boleh kosong)</label><input id="po" value="'+esc(F.po)+'"><label class="l">Untuk proyek (ketik, atau pilih)</label><input id="proy" value="'+esc(F.proyek)+'" placeholder="Ketik nama proyek / No PPBJ / PIC, atau tulis bebas" autocomplete="off"><div id="phasil"></div><div class="fr" style="margin-top:6px"><button class="gh" id="pshow" type="button"></button></div><div class="note">Bila memilih nomor PPBJ, PIC proyek ikut tampil di ringkasan.</div>';}
  h+='</div><div class="card"><h3>2. Barang yang diterima</h3><div id="daftar"></div><label class="l">Tambah barang lain (cari nama atau kode)</label><input id="cari" placeholder="Ketik nama barang..." autocomplete="off"><div id="hasil"></div><button class="gh" id="bebas" style="width:100%;margin-top:8px">+ Barang belum terdaftar (tulis nama)</button></div>';
  h+='<div class="card"><h3>3. Foto surat jalan'+(ADMIN?'':' <span class="err">(wajib)</span>')+'</h3><div class="fr"><button id="kam">Ambil foto</button><button class="gh" id="gal">Pilih dari galeri / PDF</button></div><input type="file" id="fk" accept="image/*" capture="environment" style="display:none"><input type="file" id="fg" accept="image/*,application/pdf" multiple style="display:none"><div class="th" id="th"></div><div class="note" id="fn"></div>'+(ADMIN?'<label class="l">Alasan bila tanpa foto (khusus admin)</label><input id="alasan" value="'+esc(F.alasan)+'" placeholder="mis. surat jalan menyusul">':'')+'<label class="l">Catatan (boleh kosong)</label><input id="cat" value="'+esc(F.cat)+'"></div>';
  h+='<button class="sv" id="cek" style="width:100%;padding:14px">Periksa dan lihat ringkasan</button><div id="ring"></div>';
  document.getElementById("isi").innerHTML=h;
  document.getElementById("s1").onclick=function(){simpanF();F.sumber="ppbj";ITEMS=[];formBaru();};document.getElementById("s2").onclick=function(){simpanF();F.sumber="po";ITEMS=ITEMS.filter(function(x){return x.manual;});formBaru();};
  pasangProyek();
  document.getElementById("cari").oninput=cari;document.getElementById("bebas").onclick=function(){ITEMS.push({kode:"",nama:"",satuan:"",qty:"",harga:"",manual:1,bebas:1});gambarDaftar();};
  document.getElementById("kam").onclick=function(){document.getElementById("fk").click();};document.getElementById("gal").onclick=function(){document.getElementById("fg").click();};
  document.getElementById("fk").onchange=function(){tambahFile(this.files);this.value="";};document.getElementById("fg").onchange=function(){tambahFile(this.files);this.value="";};
  document.getElementById("cek").onclick=periksa;gambarDaftar();gambarFoto();info();
}
function simpanF(){var g=function(i){var e=document.getElementById(i);return e?e.value:null;};var a=g("po");if(a!==null)F.po=a;a=g("proy");if(a!==null)F.proyek=a;a=g("cat");if(a!==null)F.cat=a;a=g("alasan");if(a!==null)F.alasan=a;}

  h+='<button class="sv" id="cc" style="width:100%;padding:14px">Periksa dan lihat ringkasan</button><div id="cring"></div>';
  el.innerHTML=h;gambarCt();gambarFoto();
  if(VEND===null){VEND=[];api({action:"masukVendor"}).then(function(r){if(r&&r.ok)VEND=r.data||[];}).catch(function(){VEND=null;});}
  pasangSaran(document.getElementById("cb"),function(q){return saranBarang(q);},function(x){
    var c=x.d,ada=CT.items.filter(function(z){return z.kode===c.kode;})[0];
    if(!ada)CT.items.push({kode:c.kode,nama:c.nama,satuan:c.satuan,qty:""});
    document.getElementById("cb").value="";gambarCt();
    var q=document.querySelectorAll("#cdaftar input[data-f=qty]");var ix=ada?CT.items.indexOf(ada):CT.items.length-1;if(q[ix])q[ix].focus();
  });
  var cv=document.getElementById("cv");
  pasangSaran(cv,function(q){return saranVendor(q);},function(x){cv.value=x.d.nama;CT.vendor=x.d.nama;});
  cv.addEventListener("input",function(){CT.vendor=cv.value;});
  document.getElementById("cbebas").onclick=function(){CT.items.push({kode:"",nama:"",satuan:"",qty:"",bebas:1});gambarCt();};
  document.getElementById("kam").onclick=function(){document.getElementById("fk").click();};document.getElementById("gal").onclick=function(){document.getElementById("fg").click();};
  document.getElementById("fk").onchange=function(){tambahFile(this.files);this.value="";};document.getElementById("fg").onchange=function(){tambahFile(this.files);this.value="";};
  document.getElementById("cc").onclick=periksaCatat;
}
function kirimCt(){return CT.items.filter(function(x){return numIn(x.qty)>0&&(x.kode||String(x.nama||"").trim());}).map(function(x){return {kode:x.kode,nama:x.nama,satuan:x.satuan,qty:numIn(x.qty)};});}
async function periksaCatat(){
  if(BUSY)return;simpanCt();var it=kirimCt();
  if(!it.length){toast("Pilih barang dan isi jumlahnya.",true);return;}
  CT.items=CT.items.filter(function(x){return numIn(x.qty)>0&&(x.kode||String(x.nama||"").trim());});gambarCt();
  BUSY=true;var b=document.getElementById("cc");b.disabled=true;b.textContent="Memeriksa...";
  try{
    var r=await api({action:"terimaPratinjau",mode:"catat",items:it,po:CT.po,tgl:CT.tgl,vendor:CT.vendor});
    if(!r.ok){toast(r.msg||"Gagal.",true);return;}
    ringkasanCatat(r);
  }catch(e){toast("Gagal terhubung ke server.",true);}finally{BUSY=false;b.disabled=false;b.textContent="Periksa dan lihat ringkasan";}
}
function tglId(iso){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||""));return m?m[3]+"/"+m[2]+"/"+m[1]:"";}
function ringkasanCatat(r){
  var el=document.getElementById("cring");KUNCI=KUNCI||rid();
  var h='<div class="card" style="border:2px solid var(--gold);margin-top:12px"><h3>Ringkasan sebelum disimpan</h3><div class="box">Datang: <b>'+esc(tglId(CT.tgl)||"hari ini")+'</b>'+(CT.vendor?' · Vendor: <b>'+esc(CT.vendor)+'</b>':'')+(CT.po?' · PO: <b>'+esc(CT.po)+'</b>':'')+' · '+(FILES.length?FILES.length+' foto/berkas':'tanpa foto')+'</div>';
  h+='<table><tr><th>Barang</th><th class="nm">Masuk</th><th class="nm">Stok '+esc(r.sumber)+'</th></tr>'+r.items.map(function(x){
    return '<tr><td><b>'+esc(x.nama)+'</b><small style="display:block;color:var(--mut)">'+esc(x.kode||"belum terdaftar")+'</small></td><td class="nm">+'+fq(x.qty)+' '+esc(x.satuan)+'</td><td class="nm">'+(x.daftar?'<span class="tag w">tidak bertambah</span>':fq(x.sebelum)+' → <b>'+fq(x.sesudah)+'</b>')+'</td></tr>';}).join("")+'</table>';
  (r.peringatan||[]).forEach(function(w){h+='<div class="box w">⚠ '+esc(w)+'</div>';});
  h+='<div class="fr"><button type="button" class="gh" id="ckb">Kembali ubah</button><button type="button" class="sv" id="csm">Simpan catatan masuk</button></div><div class="note">Stok langsung bertambah saat disimpan. Pembatalan hanya bisa oleh admin.</div></div>';
  el.innerHTML=h;el.scrollIntoView({behavior:"smooth"});
  document.getElementById("ckb").onclick=function(){el.innerHTML="";};document.getElementById("csm").onclick=simpanCatat;
}
async function simpanCatat(){
  if(BUSY)return;BUSY=true;var b=document.getElementById("csm");b.disabled=true;b.textContent="Menyimpan...";
  try{
    var r=await api({action:"terimaSimpan",mode:"catat",kunciKirim:KUNCI,items:kirimCt(),po:CT.po,tgl:CT.tgl,vendor:CT.vendor,catatan:CT.cat,files:FILES.map(function(x){return {nama:x.nama,mime:x.mime,data:x.data};})});
    if(!r.ok){toast(r.msg||"Gagal menyimpan.",true);return;}
    toast(r.msg);CT={items:[],tgl:"",po:"",vendor:"",cat:""};FILES=[];KUNCI="";TAB="riwayat";VEND=null;
    try{sessionStorage.removeItem("sctk_idx_v1");}catch(e){}
    await mulai();
  }catch(e){toast("Koneksi terputus. Cek Riwayat sebelum menyimpan ulang — jika tercatat, jangan kirim lagi.",true);}finally{BUSY=false;}
}
/* ===== riwayat ===== */
async function riwayat(){
  var el=document.getElementById("isi");el.innerHTML='<div class="note" style="text-align:center;padding:20px">Memuat...</div>';
  try{
    var r=await api({action:"terimaDaftar"});if(!r.ok){el.innerHTML='<p class="err">'+esc(r.msg||"Gagal.")+'</p>';return;}
    var d=r.data||[];
    el.innerHTML=d.length?d.map(function(x){
      var st=x.batal?'<span class="tag bad">Dibatalkan</span>':(x.accurate==="Sudah"?'<span class="tag ok">Sudah di Accurate</span>':'<span class="tag w">Belum di Accurate</span>');
      return '<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b class="'+(x.batal?"can":"")+'">'+esc(x.nomor)+'</b>'+st+'</div><div class="note">'+esc(x.waktu)+' · oleh '+esc(x.oleh)+(x.po?' · PO '+esc(x.po):'')+'</div>'+
        (x.mode==="Catat"?'<div style="margin-top:4px"><span class="tag">Catatan manual</span>'+(x.tertaut?' <span class="tag ok">Tertaut ke PO</span>':'')+' Datang <b>'+esc(x.tglDatang||"-")+'</b>'+(x.vendor?' · Vendor: <b>'+esc(x.vendor)+'</b>':'')+'</div>'+(x.tutup>0?'<div class="note">Menutup '+fq(x.tutup)+' barang yang sudah keluar lebih dulu dari stok.</div>':''):'')+
        ((x.proyek||x.ppbj)?'<div style="margin-top:4px">Untuk proyek: <b>'+esc(x.proyek||x.ppbj)+'</b>'+(x.pic?' · PIC: '+esc(x.pic):'')+'</div>':'')+
        '<div style="margin-top:6px;font-size:13px">'+x.items.map(function(i){return esc(i.nama)+' <b>'+fq(i.qty)+'</b> '+esc(i.satuan)+(i.daftar?' <span class="tag w">perlu didaftarkan</span>':'')+(i.luar?' <span class="tag">di luar pesanan</span>':'');}).join('<br>')+'</div>'+
        '<div class="note" style="margin-top:6px">'+(x.foto?x.foto+' foto surat jalan':(x.alasanFoto?'Tanpa foto: '+esc(x.alasanFoto):'Tanpa foto'))+(x.cat?' · '+esc(x.cat):'')+'</div>'+
        (x.batal?'<div class="box r">Dibatalkan oleh '+esc(x.batalOleh)+': '+esc(x.batalAlasan)+'</div>':(r.admin?'<div class="fr"><button class="rd" data-b="'+esc(x.nomor)+'">Batalkan penerimaan</button></div>':''))+'</div>';}).join(""):'<div class="card note" style="text-align:center">Belum ada penerimaan.</div>';
    el.querySelectorAll("[data-b]").forEach(function(e){e.onclick=function(){batal(e.getAttribute("data-b"),false);};});
  }catch(e){el.innerHTML='<p class="err">Gagal terhubung ke server.</p>';}
}
async function batal(no,setuju){
  var al=window.__alasanBatal;if(!setuju){al=prompt("Alasan membatalkan "+no+"? (stok akan dikembalikan)");if(!al||!al.trim())return;window.__alasanBatal=al.trim();al=window.__alasanBatal;}
  try{
    var r=await api({action:"terimaBatal",nomor:no,alasan:al,setujuSudah:setuju?1:0});
    if(r.perlu==="sudah"){if(confirm(r.msg))batal(no,true);return;}
    if(!r.ok){toast(r.msg||"Gagal.",true);return;}
    toast(r.msg);try{sessionStorage.removeItem("sctk_idx_v1");}catch(e){}riwayat();
  }catch(e){toast("Gagal terhubung ke server.",true);}
}
if(KODE||PINADM)mulai();else loginView("");
</script>

</html>
